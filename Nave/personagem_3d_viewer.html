<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Fantasma 3D — Three.js</title>

  <style>
    * { box-sizing: border-box; }
    html, body { margin: 0; width: 100%; height: 100%; overflow: hidden; background: #070909; }
    body { font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; }
    #app { width: 100%; height: 100%; position: relative; }
    canvas { display: block; width: 100%; height: 100%; }

    #ui {
      position: absolute;
      top: 14px;
      left: 14px;
      z-index: 5;
      padding: 14px;
      width: min(320px, calc(100vw - 28px));
      color: #eef3ee;
      background: rgba(12,16,15,.84);
      border: 1px solid rgba(180,210,190,.18);
      border-radius: 14px;
      backdrop-filter: blur(10px);
      box-shadow: 0 10px 35px rgba(0,0,0,.35);
    }
    #ui h1 { font-size: 17px; margin: 0 0 10px; }
    #ui p { font-size: 12px; opacity: .72; margin: 7px 0 12px; line-height: 1.4; }
    .buttons { display: grid; grid-template-columns: repeat(3,1fr); gap: 7px; }
    button {
      appearance: none;
      border: 1px solid rgba(210,230,215,.18);
      border-radius: 9px;
      padding: 9px 6px;
      color: #eef3ee;
      background: #1b211e;
      cursor: pointer;
    }
    button:hover { background: #29312d; }
    button.active { background: #405247; border-color: #8fa694; }
    .row { display:flex; gap:8px; align-items:center; margin-top:10px; }
    label { font-size: 12px; opacity:.8; }
    input[type=range] { width:100%; }
    #status { margin-top: 10px; font-size: 11px; opacity: .55; }
    #hint {
      position:absolute; right:14px; bottom:14px; z-index:5;
      padding:8px 11px; color:#dfe8e1; font-size:11px;
      background:rgba(12,16,15,.62); border-radius:10px;
      backdrop-filter:blur(8px);
    }
  </style>

  <script type="importmap">
  {
    "imports": {
      "three": "https://cdn.jsdelivr.net/npm/three@0.180.0/build/three.module.js",
      "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.180.0/examples/jsm/"
    }
  }
  </script>
</head>

<body>
<div id="app">
  <div id="ui">
    <h1>👻 Fantasma 3D</h1>
    <p>Modelo procedural baseado na referência. Arraste para girar, use a roda/pinça para aproximar e teste as poses.</p>

    <div class="buttons">
      <button data-pose="idle" class="active">Parado</button>
      <button data-pose="staff">Cajado</button>
      <button data-pose="attack">Ataque</button>
    </div>

    <div class="row">
      <label for="float">Flutuação</label>
      <input id="float" type="range" min="0" max="1" step=".01" value=".45">
    </div>
    <div class="row">
      <label for="speed">Velocidade</label>
      <input id="speed" type="range" min="0" max="2" step=".01" value=".8">
    </div>
    <div id="status">Pose: parado</div>
  </div>

  <div id="hint">Arraste para girar • scroll/pinça para zoom</div>
</div>

<script type="module">
import * as THREE from "three";
import { OrbitControls } from "three/addons/controls/OrbitControls.js";
import {
  criarPersonagemCompleto,
  aplicarPose,
  adicionarIluminacaoPersonagem,
  configurarSombras
} from "./personagem_3d_completo_threejs.js";

const scene = new THREE.Scene();
scene.background = new THREE.Color(0x070909);
scene.fog = new THREE.Fog(0x070909, 5, 12);

const camera = new THREE.PerspectiveCamera(
  42,
  innerWidth / innerHeight,
  0.05,
  100
);
camera.position.set(3.9, 2.25, 5.4);
camera.lookAt(0, 1.0, 0);

const renderer = new THREE.WebGLRenderer({ antialias: true });
renderer.setPixelRatio(Math.min(devicePixelRatio, 2));
renderer.setSize(innerWidth, innerHeight);
renderer.outputColorSpace = THREE.SRGBColorSpace;
renderer.shadowMap.enabled = true;
renderer.shadowMap.type = THREE.PCFSoftShadowMap;
document.querySelector("#app").appendChild(renderer.domElement);
configurarSombras(renderer);

const controls = new OrbitControls(camera, renderer.domElement);
controls.target.set(0, 1.05, 0);
controls.enableDamping = true;
controls.dampingFactor = 0.07;
controls.minDistance = 2.4;
controls.maxDistance = 8.5;
controls.maxPolarAngle = Math.PI * 0.86;

adicionarIluminacaoPersonagem(scene);

// Chão simples para dar escala e receber sombra.
const floor = new THREE.Mesh(
  new THREE.CircleGeometry(3.2, 64),
  new THREE.MeshStandardMaterial({ color: 0x0d1210, roughness: 1 })
);
floor.rotation.x = -Math.PI / 2;
floor.position.y = -0.9;
floor.receiveShadow = true;
scene.add(floor);

// Aura discreta atrás do fantasma.
const aura = new THREE.Mesh(
  new THREE.CircleGeometry(1.35, 48),
  new THREE.MeshBasicMaterial({
    color: 0x263d35,
    transparent: true,
    opacity: .14,
    depthWrite: false
  })
);
aura.position.set(0, 1.2, -0.55);
scene.add(aura);

const character = criarPersonagemCompleto({
  escala: 1,
  pose: "idle",
  incluirCajado: true
});
character.position.y = -0.72;
scene.add(character);

let pose = "idle";
let time = 0;
const floatControl = document.querySelector("#float");
const speedControl = document.querySelector("#speed");
const status = document.querySelector("#status");

function setPose(next) {
  pose = next;
  aplicarPose(character, pose);

  document.querySelectorAll("button[data-pose]").forEach(btn => {
    btn.classList.toggle("active", btn.dataset.pose === pose);
  });
  status.textContent = "Pose: " + (
    pose === "idle" ? "parado" :
    pose === "staff" ? "segurando o cajado" : "ataque"
  );
}

document.querySelectorAll("button[data-pose]").forEach(btn => {
  btn.addEventListener("click", () => setPose(btn.dataset.pose));
});

// Animação fantasmagórica: flutuação, inclinação suave e pulsação dos olhos.
function animate() {
  requestAnimationFrame(animate);

  const dt = Math.min(clock.getDelta(), .05);
  time += dt * Number(speedControl.value);

  const amount = Number(floatControl.value);
  character.position.y = -0.72 + Math.sin(time * 1.7) * 0.075 * amount;
  character.rotation.z = Math.sin(time * 0.8) * 0.025 * amount;

  if (character.userData.parts.head) {
    character.userData.parts.head.rotation.y =
      Math.sin(time * 0.65) * 0.035 * amount;
  }

  // Pequena oscilação do cajado.
  if (character.userData.parts.staff) {
    character.userData.parts.staff.rotation.z =
      Math.sin(time * 0.9) * 0.018 * amount;
  }

  // Pulsação do brilho dos olhos e do orbe.
  const pulse = 1.15 + Math.sin(time * 3.0) * .35;
  for (const key of ["leftEye", "rightEye"]) {
    const eye = character.userData.parts.head?.getObjectByName(key);
    if (eye) eye.material.emissiveIntensity = pulse;
  }
  const orb = character.userData.parts.staff?.getObjectByName("StaffOrb");
  if (orb) orb.material.emissiveIntensity = 1.4 + Math.sin(time * 3.5) * .55;

  aura.material.opacity = .11 + Math.sin(time * 1.4) * .035 * amount;

  controls.update();
  renderer.render(scene, camera);
}

const clock = new THREE.Clock();

addEventListener("resize", () => {
  camera.aspect = innerWidth / innerHeight;
  camera.updateProjectionMatrix();
  renderer.setSize(innerWidth, innerHeight);
});

animate();
</script>
</body>
</html>
