<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <title>Estação Nexus — Interior</title>
  <style>
    html, body { margin: 0; width: 100%; height: 100%; overflow: hidden; background: #020508; color: #dce8e3; font-family: system-ui, sans-serif; }
    canvas { position: fixed; inset: 0; width: 100%; height: 100%; display: block; }
    #hud {
      position: fixed; z-index: 10; left: 16px; top: 16px;
      padding: 10px 13px; border: 1px solid #385044; background: #07100ddd;
      border-radius: 8px; letter-spacing: .08em; font-size: 12px; pointer-events: none;
    }
    #hint {
      position: fixed; z-index: 10; left: 50%; bottom: 18px; transform: translateX(-50%);
      padding: 8px 12px; background: #07100dcc; border: 1px solid #294437;
      border-radius: 8px; font-size: 11px; white-space: nowrap; pointer-events: none;
    }
    #cross {
      position: fixed; z-index: 10; left: 50%; top: 50%; width: 12px; height: 12px;
      transform: translate(-50%, -50%); pointer-events: none;
    }
    #cross:before, #cross:after { content: ""; position: absolute; background: #8df5c1; }
    #cross:before { left: 5px; top: 0; width: 2px; height: 12px; }
    #cross:after { left: 0; top: 5px; width: 12px; height: 2px; }
    #panel {
      display: none; position: fixed; z-index: 30; left: 50%; top: 50%;
      transform: translate(-50%, -50%); width: min(520px, 88vw); padding: 20px;
      background: #070d10f2; border: 1px solid #526c60; border-radius: 12px;
      box-shadow: 0 20px 80px #000b; color: #e4eee9;
    }
    .close {
      float: right; background: none; border: 1px solid #526c60; color: #dce8e3;
      border-radius: 6px; padding: 4px 9px; cursor: pointer;
    }
    .song {
      display: flex; justify-content: space-between; align-items: center;
      padding: 12px 8px; border-top: 1px solid #263a31;
    }
    .song button {
      background: #10251b; color: #8df5c1; border: 1px solid #3b7057;
      border-radius: 6px; padding: 7px 12px; cursor: pointer;
    }
    #voltar {
      position: fixed; z-index: 10; left: 16px; bottom: 16px;
      padding: 8px 12px; border: 1px solid #294437; background: #07100dbb;
      border-radius: 8px; font-size: 11px; color: #9ecbb8; text-decoration: none;
    }
    #voltar:hover { border-color: #5ec49a; color: #d8fff0; }
    #status-load {
      position: fixed; z-index: 12; right: 16px; top: 16px;
      padding: 8px 10px; border: 1px solid #294437; background: #07100dbb;
      border-radius: 8px; font-size: 11px; pointer-events: none;
    }
    #mobile {
      display: none; position: fixed; z-index: 15; left: 18px; bottom: 22px;
      width: 120px; height: 120px; border: 1px solid #456254; border-radius: 50%;
      background: #07100d66;
    }
    #stick {
      position: absolute; width: 48px; height: 48px; left: 36px; top: 36px;
      border-radius: 50%; background: #8df5c133; border: 1px solid #8df5c177;
    }
    @media (max-width: 700px) {
      #mobile { display: block; }
      #hint { bottom: 8px; font-size: 10px; }
      #voltar { bottom: auto; top: 60px; }
    }
  </style>
  <script type="importmap">
  {
    "imports": {
      "three": "https://cdn.jsdelivr.net/npm/three@0.180.0/build/three.module.js",
      "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.180.0/examples/jsm/"
    }
  }
  </script>
</head>
<body>
  <canvas id="c"></canvas>
  <div id="hud"><b>ESTAÇÃO NEXUS</b><br><span>INTERIOR · SALA DE COMANDO</span></div>
  <div id="status-load">carregando esferas e tripulação…</div>
  <div id="cross"></div>
  <div id="hint">WASD + mouse · clique nos painéis · ESC libera o cursor</div>
  <a id="voltar" href="estacao_nexus.html">← Exterior da nave</a>
  <div id="mobile"><div id="stick"></div></div>
  <div id="panel"></div>

<script type="module">
import * as THREE from "three";
import { GLTFLoader } from "three/addons/loaders/GLTFLoader.js";
import {
  criarPersonagemCompleto,
  aplicarPose,
  adicionarIluminacaoPersonagem
} from "./personagem_3d_completo_threejs.js";

const C = document.getElementById("c");
const P = document.getElementById("panel");
const statusLoad = document.getElementById("status-load");
const mobile = innerWidth < 700;

const R = new THREE.WebGLRenderer({ canvas: C, antialias: !mobile, powerPreference: "high-performance" });
R.setPixelRatio(Math.min(devicePixelRatio, mobile ? 1.5 : 2));
R.setSize(innerWidth, innerHeight, false);
R.shadowMap.enabled = true;
R.shadowMap.type = THREE.PCFSoftShadowMap;
R.outputColorSpace = THREE.SRGBColorSpace;

const S = new THREE.Scene();
S.background = new THREE.Color(0x020508);
S.fog = new THREE.FogExp2(0x020508, 0.045);

const cam = new THREE.PerspectiveCamera(72, innerWidth / innerHeight, 0.05, 100);
cam.position.set(0, 1.65, 4.5);

S.add(new THREE.HemisphereLight(0x9ccbc0, 0x020304, 1.2));
const L = new THREE.PointLight(0x8ab9aa, 1.8, 15);
L.position.set(0, 3.5, 0);
S.add(L);
const GL = new THREE.PointLight(0x39ff8a, 1.7, 10);
GL.position.set(-3, 1.7, -2);
S.add(GL);

const G = {
  h: new THREE.MeshStandardMaterial({ color: 0x151c21, roughness: 0.42, metalness: 0.9 }),
  d: new THREE.MeshStandardMaterial({ color: 0x070a0d, roughness: 0.55, metalness: 0.82 }),
  p: new THREE.MeshStandardMaterial({ color: 0x202a2d, roughness: 0.5, metalness: 0.8 }),
  g: new THREE.MeshStandardMaterial({ color: 0x9b742e, roughness: 0.28, metalness: 0.9, emissive: 0x302005, emissiveIntensity: 0.3 }),
  e: new THREE.MeshStandardMaterial({ color: 0x38ff8a, roughness: 0.18, metalness: 0.4, emissive: 0x13ff69, emissiveIntensity: 2.4 }),
  r: new THREE.MeshStandardMaterial({ color: 0xd72e42, roughness: 0.2, metalness: 0.45, emissive: 0x8c1020, emissiveIntensity: 1.8 }),
  glass: new THREE.MeshStandardMaterial({
    color: 0x173944, roughness: 0.08, metalness: 0.35,
    emissive: 0x06171c, emissiveIntensity: 0.5, transparent: true, opacity: 0.82
  }),
  ghost: new THREE.MeshStandardMaterial({
    color: 0x8be8ce, transparent: true, opacity: 0.24,
    emissive: 0x46e0bc, emissiveIntensity: 2
  })
};

function box(a, m, p, r = [0, 0, 0]) {
  const o = new THREE.Mesh(new THREE.BoxGeometry(...a), m);
  o.position.set(...p);
  o.rotation.set(...r);
  o.castShadow = o.receiveShadow = true;
  S.add(o);
  return o;
}
function cyl(rad, dep, m, p, r = [0, 0, 0]) {
  const o = new THREE.Mesh(new THREE.CylinderGeometry(rad, rad, dep, 24), m);
  o.position.set(...p);
  o.rotation.set(...r);
  o.castShadow = o.receiveShadow = true;
  S.add(o);
  return o;
}
function tor(rad, t, m, p, r = [0, 0, 0]) {
  const o = new THREE.Mesh(new THREE.TorusGeometry(rad, t, 10, 32), m);
  o.position.set(...p);
  o.rotation.set(...r);
  S.add(o);
  return o;
}

// Casco interior
box([10, 0.25, 10], G.d, [0, -0.15, 0]);
box([10, 4.2, 0.25], G.h, [0, 2.05, -5]);
box([0.25, 4.2, 10], G.h, [-5, 2.05, 0]);
box([0.25, 4.2, 10], G.h, [5, 2.05, 0]);
box([10, 0.25, 10], G.h, [0, 4.2, 0]);

for (let z = -4; z <= 4; z += 2) {
  box([0.18, 3.8, 0.22], G.g, [-4.78, 2.05, z]);
  box([0.18, 3.8, 0.22], G.g, [4.78, 2.05, z]);
}
for (let x = -4; x <= 4; x += 2) box([0.16, 0.18, 9.4], G.g, [x, 4.03, 0]);
box([3.6, 0.12, 7.8], G.p, [0, -0.01, 0.1]);
for (const x of [-1.9, 1.9]) box([0.08, 0.04, 8.8], G.e, [x, 0.08, 0]);

// Cockpit
box([4.8, 2.1, 0.22], G.d, [0, 2.25, -4.72]);
box([3.8, 1.45, 0.1], G.glass, [0, 2.35, -4.58], [-0.05, 0, 0]);
for (const x of [-1.4, 0, 1.4]) box([0.07, 1.35, 0.07], G.g, [x, 2.35, -4.49]);

function consolePanel(x, z) {
  box([1.25, 1.05, 0.65], G.p, [x, 0.72, z]);
  box([1, 0.48, 0.06], G.glass, [x, 1.12, z - 0.34]);
  box([0.75, 0.05, 0.04], G.e, [x, 1.16, z - 0.38]);
  tor(0.28, 0.035, G.g, [x, 1.52, z - 0.3], [Math.PI / 2, 0, 0]);
}
consolePanel(-3.7, -1);
consolePanel(3.7, -1);

// Mapa e música
const map = box([2.25, 1.55, 0.12], G.d, [-4.72, 2.25, -1], [0, Math.PI / 2, 0]);
box([1.85, 1.2, 0.05], G.glass, [-4.62, 2.25, -1], [0, Math.PI / 2, 0]);
for (let i = 0; i < 7; i++) {
  box([0.06, 0.48, 0.03], i % 2 ? G.g : G.e, [-4.55, 2.0 + i * 0.13, -1], [0, Math.PI / 2, 0]);
}
map.userData.interactive = "map";

const music = box([2.35, 1.75, 0.12], G.d, [4.72, 2.25, -1], [0, Math.PI / 2, 0]);
box([1.95, 1.25, 0.05], G.glass, [4.62, 2.25, -1], [0, Math.PI / 2, 0]);
for (let i = 0; i < 5; i++) {
  box([0.07, 0.18, 0.03], G.e, [4.55, 2.65 - i * 0.27, -1], [0, Math.PI / 2, 0]);
}
music.userData.interactive = "music";

// Mesa das esferas
box([2.8, 0.22, 2], G.g, [0, 0.72, 0.3]);
box([2.45, 0.18, 1.65], G.d, [0, 0.86, 0.3]);

const mesaOrbs = new THREE.Group();
mesaOrbs.position.set(0, 1.02, 0.3);
S.add(mesaOrbs);

const NOMES_ESFERAS = [
  "1_Estrella_0", "2_Estrellas_1", "3_Estrellas_2", "4_Estrellas_3",
  "5_Estrellas_4", "6_Estrellas_5", "7_Estrellas_6"
];

const esferasAnim = [];

function carregarEsferas() {
  return new Promise((resolve) => {
    const loader = new GLTFLoader();
    loader.load(
      "esferas_del_dragon_corrigido.glb",
      (gltf) => {
        const porNome = {};
        gltf.scene.traverse((o) => { if (o.name) porNome[o.name] = o; });

        const slots = [
          [-0.85, 0, -0.35],
          [-0.42, 0, 0.25],
          [0, 0, -0.35],
          [0.42, 0, 0.25],
          [0.85, 0, -0.35],
          [-0.28, 0, 0.55],
          [0.28, 0, 0.55]
        ];

        NOMES_ESFERAS.forEach((nome, i) => {
          const src = porNome[nome];
          if (!src) return;
          const g = src.clone(true);
          g.position.set(...slots[i]);
          // escala tipica do modelo Sketchfab — ajustar se vier grande demais
          g.scale.setScalar(0.035);
          g.traverse((o) => {
            if (o.isMesh) {
              o.castShadow = true;
              o.receiveShadow = true;
            }
          });
          mesaOrbs.add(g);
          esferasAnim.push({
            obj: g,
            baseY: g.position.y,
            phase: Math.random() * Math.PI * 2
          });
        });

        if (esferasAnim.length === 0) {
          // fallback procedural se o GLB nao trouxer os grupos nomeados
          slots.forEach((pos, i) => {
            const s = new THREE.Mesh(
              new THREE.SphereGeometry(0.18, 24, 18),
              new THREE.MeshStandardMaterial({
                color: 0xe8891a,
                roughness: 0.35,
                metalness: 0.15,
                emissive: 0x5a2a05,
                emissiveIntensity: 0.4
              })
            );
            s.position.set(...pos);
            mesaOrbs.add(s);
            esferasAnim.push({ obj: s, baseY: 0, phase: i * 0.9 });
          });
        }
        resolve(true);
      },
      undefined,
      (err) => {
        console.warn("Falha ao carregar GLB das esferas:", err);
        // fallback procedural
        const slots = [
          [-0.72, 0, 0], [0, 0, 0], [0.72, 0, 0],
          [-0.36, 0, 0.5], [0.36, 0, 0.5]
        ];
        slots.forEach((pos, i) => {
          const s = new THREE.Mesh(
            new THREE.SphereGeometry(0.2, 20, 16),
            new THREE.MeshStandardMaterial({
              color: 0xe8891a, roughness: 0.35, metalness: 0.15,
              emissive: 0x5a2a05, emissiveIntensity: 0.4
            })
          );
          s.position.set(...pos);
          mesaOrbs.add(s);
          esferasAnim.push({ obj: s, baseY: 0, phase: i });
        });
        resolve(false);
      }
    );
  });
}

// Nixie shelf
box([2.5, 0.12, 0.55], G.g, [-2.95, 2.25, 3.15]);
box([2.65, 1.35, 0.12], G.d, [-2.95, 2.75, 3.15]);
for (let i = 0; i < 4; i++) {
  cyl(0.25, 0.16, G.glass, [-3.85 + i * 0.6, 2.75, 3.05], [Math.PI / 2, 0, 0]);
  box([0.03, 0.55, 0.03], G.e, [-3.85 + i * 0.6, 2.75, 2.94]);
}

// Porta da popa
box([2.5, 2.7, 0.18], G.d, [0, 1.9, 4.72]);
box([1.75, 2.2, 0.08], G.p, [0, 1.9, 4.57]);
tor(1.05, 0.07, G.g, [0, 1.9, 4.48], [Math.PI / 2, 0, 0]);
for (const z of [-4, -2, 0, 2, 4]) box([0.5, 0.04, 0.08], G.e, [0, 3.75, z]);

// Fantasmas decorativos (menores)
const ghosts = [];
function ghost(x, z, ph) {
  const g = new THREE.Group();
  const b = new THREE.Mesh(new THREE.SphereGeometry(0.22, 16, 12), G.ghost);
  b.scale.y = 1.35;
  const t = new THREE.Mesh(new THREE.ConeGeometry(0.2, 0.45, 12), G.ghost);
  t.position.y = -0.35;
  t.rotation.x = Math.PI;
  g.add(b, t);
  for (const ex of [-0.07, 0.07]) {
    const e = new THREE.Mesh(
      new THREE.SphereGeometry(0.03, 8, 8),
      new THREE.MeshBasicMaterial({ color: 0xdffff3 })
    );
    e.position.set(ex, 0.05, 0.2);
    g.add(e);
  }
  g.position.set(x, 1.25, z);
  g.userData = { x, z, ph };
  S.add(g);
  ghosts.push(g);
}
ghost(-3.2, 1.2, 0);
ghost(3.1, 2.4, 2.3);

// Personagem 3D (fantasma / viajante)
let character = null;
function carregarPersonagem() {
  character = criarPersonagemCompleto({
    escala: 0.42,
    pose: "idle",
    incluirCajado: true
  });
  character.position.set(2.2, -0.05, 1.8);
  character.rotation.y = -0.9;
  S.add(character);
  aplicarPose(character, "staff");
}

// Interação
const ray = new THREE.Raycaster();
const N = new THREE.Vector2();

function open(type) {
  P.style.display = "block";
  if (type === "music") {
    P.innerHTML =
      '<button class="close">FECHAR</button><h2>♪ CANÇÕES APRENDIDAS</h2>' +
      '<div class="song"><span>Canção da Tempestade<br><small>● ▲ ▼ ◆</small></span><button id="play">TOCAR</button></div>' +
      '<div class="song"><span>Canção aprendida</span><button>TOCAR</button></div>';
    P.querySelector("#play").onclick = play;
  } else {
    P.innerHTML =
      '<button class="close">FECHAR</button><h2>✦ MAPA DE VALTHERIS</h2>' +
      "<p>O mapa atual será aberto aqui usando o mapa-nexus.js do projeto.</p>";
  }
  P.querySelector(".close").onclick = () => { P.style.display = "none"; };
}

function play() {
  const A = new (window.AudioContext || window.webkitAudioContext)();
  const q = [440, 523, 659, 523, 440, 392, 523, 659];
  let i = 0;
  function n() {
    if (i >= q.length) { A.close(); return; }
    const o = A.createOscillator();
    const g = A.createGain();
    o.frequency.value = q[i++];
    g.gain.setValueAtTime(0.0001, A.currentTime);
    g.gain.exponentialRampToValueAtTime(0.13, A.currentTime + 0.02);
    g.gain.exponentialRampToValueAtTime(0.0001, A.currentTime + 0.28);
    o.connect(g).connect(A.destination);
    o.start();
    o.stop(A.currentTime + 0.3);
    setTimeout(n, 300);
  }
  n();
}

let yaw = 0, pitch = 0, locked = false;
const keys = {};
addEventListener("keydown", (e) => { keys[e.code] = true; });
addEventListener("keyup", (e) => { keys[e.code] = false; });

C.onclick = (e) => {
  if (P.style.display === "block") return;
  N.x = (e.clientX / innerWidth) * 2 - 1;
  N.y = -(e.clientY / innerHeight) * 2 + 1;
  ray.setFromCamera(N, cam);
  const h = ray.intersectObjects([map, music], true);
  if (h.length) {
    open(h[0].object.userData.interactive);
    return;
  }
  if (!mobile) C.requestPointerLock?.();
};

document.addEventListener("pointerlockchange", () => {
  locked = document.pointerLockElement === C;
});
document.addEventListener("mousemove", (e) => {
  if (!locked) return;
  yaw -= e.movementX * 0.0025;
  pitch -= e.movementY * 0.0022;
  pitch = Math.max(-1, Math.min(1, pitch));
});
addEventListener("keydown", (e) => {
  if (e.code === "Escape") document.exitPointerLock?.();
});

const joy = { x: 0, y: 0 };
if (mobile) {
  const area = document.getElementById("mobile");
  const stick = document.getElementById("stick");
  let down = false;
  area.ontouchstart = (e) => { down = true; e.preventDefault(); };
  area.ontouchmove = (e) => {
    if (!down) return;
    const r = area.getBoundingClientRect();
    const t = e.touches[0];
    joy.x = Math.max(-1, Math.min(1, (t.clientX - (r.left + 60)) / 45));
    joy.y = Math.max(-1, Math.min(1, (t.clientY - (r.top + 60)) / 45));
    stick.style.transform = `translate(${joy.x * 30}px, ${joy.y * 30}px)`;
    e.preventDefault();
  };
  area.ontouchend = () => {
    down = false;
    joy.x = joy.y = 0;
    stick.style.transform = "";
  };
}

let time = 0;
let last = performance.now();

function loop(t) {
  requestAnimationFrame(loop);
  const dt = Math.min(0.05, (t - last) / 1000);
  last = t;
  time += dt;

  let fx = (keys.KeyD ? 1 : 0) - (keys.KeyA ? 1 : 0);
  let fz = (keys.KeyS ? 1 : 0) - (keys.KeyW ? 1 : 0);
  if (mobile) { fx = joy.x; fz = joy.y; }

  const f = new THREE.Vector3(Math.sin(yaw), 0, Math.cos(yaw));
  const r = new THREE.Vector3(Math.cos(yaw), 0, -Math.sin(yaw));
  cam.position.addScaledVector(r, fx * 2.5 * dt);
  cam.position.addScaledVector(f, fz * 2.5 * dt);
  cam.position.x = Math.max(-4.15, Math.min(4.15, cam.position.x));
  cam.position.z = Math.max(-4.15, Math.min(4.15, cam.position.z));
  cam.position.y = 1.65;
  cam.rotation.order = "YXZ";
  cam.rotation.y = yaw;
  cam.rotation.x = pitch;

  esferasAnim.forEach((o) => {
    o.obj.position.y = o.baseY + Math.sin(time * 2 + o.phase) * 0.04;
    o.obj.rotation.y += dt * 0.6;
  });

  ghosts.forEach((g) => {
    g.position.x = g.userData.x + Math.sin(time * 0.35 + g.userData.ph) * 0.55;
    g.position.z = g.userData.z + Math.cos(time * 0.28 + g.userData.ph) * 0.4;
    g.position.y = 1.25 + Math.sin(time * 0.9 + g.userData.ph) * 0.08;
  });

  if (character) {
    character.position.y = -0.05 + Math.sin(time * 1.5) * 0.03;
    if (character.userData.parts?.head) {
      character.userData.parts.head.rotation.y = Math.sin(time * 0.5) * 0.05;
    }
  }

  GL.intensity = 1.5 + Math.sin(time * 2.2) * 0.35;
  R.render(S, cam);
}

Promise.all([carregarEsferas()]).then((ok) => {
  carregarPersonagem();
  statusLoad.textContent = ok[0]
    ? "esferas · personagem online"
    : "personagem online · esferas (fallback)";
  setTimeout(() => { statusLoad.style.opacity = "0.55"; }, 2000);
});

requestAnimationFrame(loop);

addEventListener("resize", () => {
  R.setSize(innerWidth, innerHeight, false);
  cam.aspect = innerWidth / innerHeight;
  cam.updateProjectionMatrix();
});
</script>
</body>
</html>
