<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Irmãos fantasma</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IM+Fell+English:ital@0;1&display=swap">
<style>
  :root {
    color-scheme: light;
    --bg: #e6e3ea;
    --ink: #22181e;
    --muted: #574a53;
    --line: #a99faf;
    --on-bg: #2b1522;
    --on-ink: #f1e6cf;
    --focus: #94550f;
    --accent: #94550f;
  }
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) {
      color-scheme: dark;
      --bg: #0f090c;
      --ink: #ebe4d2;
      --muted: #ab9f96;
      --line: #46333e;
      --on-bg: #e9a24b;
      --on-ink: #1d1014;
      --focus: #e9a24b;
      --accent: #e9a24b;
    }
  }
  :root[data-theme="dark"] {
    color-scheme: dark;
    --bg: #0f090c;
    --ink: #ebe4d2;
    --muted: #ab9f96;
    --line: #46333e;
    --on-bg: #e9a24b;
    --on-ink: #1d1014;
    --focus: #e9a24b;
    --accent: #e9a24b;
  }

  * { box-sizing: border-box; }
  html { -webkit-text-size-adjust: 100%; }
  body {
    margin: 0;
    min-height: 100vh;
    min-height: 100dvh;
    display: grid;
    align-content: center;
    justify-items: center;
    padding: 16px;
    background: var(--bg);
    color: var(--ink);
    font-family: "IM Fell English", Georgia, "Times New Roman", serif;
    font-size: 17px;
    line-height: 1.5;
  }
  main { width: 100%; max-width: 1120px; }
  .sr-only {
    position: absolute; width: 1px; height: 1px; margin: -1px; padding: 0;
    overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; border: 0;
  }

  .stages { display: grid; gap: 14px; grid-template-columns: minmax(0, 1fr); }
  @media (min-width: 880px) {
    .stages { grid-template-columns: repeat(2, minmax(0, 1fr)); }
  }

  .stage {
    position: relative;
    width: 100%;
    aspect-ratio: 620 / 490;
    overflow: hidden;
    border-radius: 20px;
    background:
      radial-gradient(ellipse 46% 11% at 49% 91%, rgba(233, 162, 75, .18), rgba(233, 162, 75, 0) 72%),
      radial-gradient(ellipse 88% 78% at 50% 36%, #3b1c30 0%, #26131e 48%, #150b10 100%);
    box-shadow: inset 0 0 0 1px rgba(255, 255, 255, .06);
    isolation: isolate;
  }
  .stage canvas {
    position: absolute;
    inset: 0;
    width: 100%;
    height: 100%;
    display: block;
  }
  .stage h2 {
    position: absolute;
    z-index: 2;
    left: 18px;
    top: 14px;
    margin: 0;
    font-size: 1.15rem;
    font-weight: 400;
    font-style: italic;
    color: #e9e0cb;
    text-shadow: 0 1px 10px rgba(0, 0, 0, .65);
    pointer-events: none;
  }
  .stage .fallback {
    display: none;
    position: absolute;
    height: auto;
    transform-origin: 50% 90%;
    animation: bob 3.6s ease-in-out infinite;
  }
  .stage.no-gl canvas.gl { display: none; }
  .stage.no-gl .fallback { display: block; }
  @keyframes bob {
    0%, 100% { transform: translateY(0) rotate(-.7deg); }
    50% { transform: translateY(-2.6%) rotate(.7deg); }
  }

  .controls { margin-top: 18px; display: grid; gap: 14px; max-width: 640px; }
  .row { display: flex; flex-wrap: wrap; align-items: center; gap: 10px; }
  .chip {
    font: inherit;
    min-height: 44px;
    padding: 0 18px;
    border-radius: 999px;
    border: 1px solid var(--line);
    background: transparent;
    color: var(--ink);
    cursor: pointer;
    touch-action: manipulation;
    transition: background-color .18s, color .18s, border-color .18s;
  }
  .chip[aria-pressed="true"] {
    background: var(--on-bg);
    border-color: var(--on-bg);
    color: var(--on-ink);
  }
  .chip:focus-visible, .speed input:focus-visible {
    outline: 2px solid var(--focus);
    outline-offset: 3px;
  }
  .speed { display: flex; align-items: center; gap: 12px; flex: 1 1 200px; min-width: 180px; }
  .speed input { flex: 1; min-width: 0; accent-color: var(--accent); height: 44px; margin: 0; }
  .hint { margin: 0; font-size: .95rem; color: var(--muted); }

  @media (prefers-reduced-motion: reduce) {
    .stage .fallback { animation: none; }
    .chip { transition: none; }
  }
</style>
</head>
<body>
<main>
  <h1 class="sr-only">Irmãos fantasma, animados</h1>

  <div class="stages">
    <section class="stage" data-char="a">
      <h2>Irmão 1</h2>
      <canvas class="bg" aria-hidden="true"></canvas>
      <canvas class="gl" role="img" aria-label="Irmão fantasma 1 flutuando, regendo com uma batuta e segurando uma lanterna"></canvas>
      <img class="fallback" alt="Irmão fantasma 1 flutuando, regendo com uma batuta e segurando uma lanterna">
    </section>
    <section class="stage" data-char="b">
      <h2>Irmão 2</h2>
      <canvas class="bg" aria-hidden="true"></canvas>
      <canvas class="gl" role="img" aria-label="Irmão fantasma 2 flutuando, regendo com uma batuta e segurando uma lanterna"></canvas>
      <img class="fallback" alt="Irmão fantasma 2 flutuando, regendo com uma batuta e segurando uma lanterna">
    </section>
  </div>

  <div class="controls">
    <div class="row">
      <button class="chip" id="play" type="button">Pausar</button>
      <label class="speed"><span>Ritmo</span><input id="speed" type="range" min="0.4" max="2" step="0.05" value="1"></label>
    </div>
    <div class="row" role="group" aria-label="Movimentos">
      <button class="chip" type="button" data-key="float" aria-pressed="true">Flutuar</button>
      <button class="chip" type="button" data-key="cape" aria-pressed="true">Capa</button>
      <button class="chip" type="button" data-key="baton" aria-pressed="true">Batuta</button>
      <button class="chip" type="button" data-key="lantern" aria-pressed="true">Lanterna</button>
      <button class="chip" type="button" data-key="eyes" aria-pressed="true">Olhos</button>
    </div>
    <p class="hint">Liga ou desliga cada movimento, nos dois.</p>
  </div>
</main>

  /* ---------- geração do GLSL a partir do rig ---------- */
  const f = (n) => { const s = String(n); return /[.e]/.test(s) ? s : s + '.0'; };
  const v2 = (a) => 'vec2(' + f(a[0]) + ', ' + f(a[1]) + ')';
  const v4 = (a) => 'vec4(' + f(a[0]) + ', ' + f(a[1]) + ', ' + f(a[2]) + ', ' + f(a[3]) + ')';

  function regionExpr(r, pv) {
    const xr = r.xr || [NEG, NEG + 1], xf = r.xf || [POS - 1, POS];
    const yr = r.yr || [NEG, NEG + 1], yf = r.yf || [POS - 1, POS];
    const hp = r.hp || [0, 0, -10, 1];
    return 'region(' + pv + ', ' + v4([xr[0], xr[1], xf[0], xf[1]]) + ', ' +
      v4([yr[0], yr[1], yf[0], yf[1]]) + ', ' + v4(hp) + ')';
  }
  const maxOf = (regions, pv) => regions.map((r) => regionExpr(r, pv)).reduce((a, b) => 'max(' + a + ', ' + b + ')');

  function warpGLSL(c) {
    const R = c.rig, B = R.baton;
    const perp = [-B.dir[1], B.dir[0]];
    return `
uniform float uTime;
uniform vec3  uBob;
uniform vec4  uAmt;
uniform vec4  uStage;

float region(vec2 p, vec4 rx, vec4 ry, vec4 hp) {
  float wx = smoothstep(rx.x, rx.y, p.x) * (1.0 - smoothstep(rx.z, rx.w, p.x));
  float wy = smoothstep(ry.x, ry.y, p.y) * (1.0 - smoothstep(ry.z, ry.w, p.y));
  float wh = smoothstep(-hp.w, hp.w, dot(p, hp.xy) - hp.z);
  return wx * wy * wh;
}

vec2 rotAbout(vec2 p, vec2 c, float a) {
  float s = sin(a);
  float k = cos(a);
  vec2 r = p - c;
  return c + vec2(k * r.x - s * r.y, s * r.x + k * r.y);
}

vec2 warp(vec2 p) {
  float t = uTime;
  vec2 d = vec2(0.0);

  // chapeu e cabeca balancam de leve
  float wHead = ${regionExpr(R.head, 'p')};
  d += (rotAbout(p, ${v2(R.neck)}, ${f(R.head.tilt)} * sin(t * 1.5 + 1.1) * uAmt.x) - p) * wHead;
  d.y += ${f(R.head.bob)} * sin(t * 1.5 + 0.6) * wHead * uAmt.x;

  // capa ondula, mais forte na barra
  float wCape = ${regionExpr(R.cape, 'p')} * smoothstep(${f(R.cape.yr[0])}, ${f(R.cape.yr[1])}, p.y);
  d.x += (${f(R.cape.sway[0])} * sin(t * 2.6 + p.y * 0.04) + ${f(R.cape.sway[1])} * sin(t * 4.1 + p.y * 0.09 + p.x * 0.03)) * wCape * uAmt.y;
  d.y += ${f(R.cape.lift)} * sin(t * 3.0 + p.x * 0.05) * wCape * uAmt.y;

  // braco gira no ombro; a batuta ainda da um golpe no pulso
  float wArm = ${maxOf(R.arm.regions, 'p')};
  d += (rotAbout(p, ${v2(R.arm.pivot)}, ${f(R.arm.ang)} * sin(t * 2.4) * uAmt.z) - p) * wArm;
  vec2 rb = p - ${v2(B.pivot)};
  float wBat = smoothstep(${f(B.s[0])}, ${f(B.s[1])}, dot(rb, ${v2(B.dir)})) *
               (1.0 - smoothstep(${f(B.u[0])}, ${f(B.u[1])}, abs(dot(rb, ${v2(perp)}))));
  d += (rotAbout(p, ${v2(B.pivot)}, ${f(B.ang)} * sin(t * 4.8 + 0.7) * uAmt.z) - p) * wBat;

  // lanterna balanca como pendulo a partir da mao
  float wLan = ${maxOf(R.lantern.regions, 'p')};
  d += (rotAbout(p, ${v2(R.lantern.pivot)}, ${f(R.lantern.ang)} * sin(t * 1.9 + 0.4) * uAmt.w) - p) * wLan;

  // corpo inteiro: flutuar
  vec2 q = rotAbout(p + d, ${v2(R.center)}, uBob.z);
  return q + uBob.xy;
}

vec4 toClip(vec2 p) {
  vec2 s = (p * ${f(c.sc)} + uStage.zw) / uStage.xy;
  return vec4(s.x * 2.0 - 1.0, 1.0 - s.y * 2.0, 0.0, 1.0);
}
`;

  function meshVS(c) {
    return `
attribute vec2 aPos;
varying vec2 vUV;
${warpGLSL(c)}
void main() {
  vUV = aPos / vec2(${f(c.w)}, ${f(c.h)});
  gl_Position = toClip(warp(aPos));

  function meshFS(c) {
    // piscada: uma elipse de abertura encolhe na vertical; so o verde e o branco do olho somem (o resto nao muda)
    const eyes = c.rig.eyes.map((e) => `
  {
    vec2 e = (q - ${v2([e[0], e[1]])}) / ${v2([e[2], e[3]])};
    float win = (1.0 - smoothstep(1.0, 2.2, abs(e.x))) * (1.0 - smoothstep(1.0, 2.2, abs(e.y)));
    float ell = (e.x * e.x) / 1.21 + (e.y * e.y) / (lidOpen * lidOpen);
    cover = max(cover, win * smoothstep(0.85, 1.0, ell));

#ifdef GL_FRAGMENT_PRECISION_HIGH
precision highp float;
#else
precision mediump float;
#endif
uniform sampler2D uTex;
uniform float uBlink;
varying vec2 vUV;
void main() {
  vec4 c = texture2D(uTex, vUV);
  vec2 q = vUV * vec2(${f(c.w)}, ${f(c.h)});
  float lidOpen = 1.0 - 0.93 * uBlink;
  float cover = 0.0;
  ${eyes}
  float gEx = smoothstep(0.0, 0.04, c.g - max(c.r, c.b * 0.8));
  float gBr = smoothstep(0.5, 0.75, min(min(c.r, c.g), c.b));
  c.rgb *= 1.0 - cover * max(gEx, gBr) * smoothstep(0.0, 0.03, uBlink);
  gl_FragColor = c;
}`;

attribute vec2 aCenter;
attribute vec2 aCorner;
attribute vec4 aColor;
attribute vec4 aParams;
uniform float uEyes;
uniform float uBlink;
varying vec2 vC;
varying vec4 vCol;
${warpGLSL(c)}
void main() {

  vec2 p = aCenter + aCorner * aParams.x + shift;
  float grp = aParams.w;
  float amount = mix(mix(uEyes, uAmt.w, step(0.5, grp)), 1.0, step(1.5, grp));
  float dim = 1.0 - uBlink * (1.0 - step(0.5, grp));
  float ph = aParams.z;
  float pulse = 0.78 + 0.22 * (0.6 * sin(uTime * aParams.y + ph) + 0.4 * sin(uTime * aParams.y * 1.73 + ph * 2.1));
  vC = aCorner;
  vCol = vec4(aColor.rgb, aColor.a * pulse * amount * dim);
  gl_Position = toClip(p);
}`;

varying vec2 vC;

void main() {

  function mulberry(a) {

      a |= 0; a = (a + 0x6D2B79F5) | 0;

    const p = t % per[0];
    if (p < 0.18) b = Math.sin((p / 0.18) * Math.PI);
    const q = t % per[1];
    if (q > 0.36 && q < 0.54) b = Math.max(b, Math.sin(((q - 0.36) / 0.18) * Math.PI));
    return b;
  }

  /* ---------- um palco por personagem ---------- */
  function createStage(cfg, el) {
    const glCanvas = el.querySelector('canvas.gl');
    const bgCanvas = el.querySelector('canvas.bg');
    const fb = el.querySelector('img.fallback');
    const bg = bgCanvas.getContext('2d');
    let gl = null, G = null;

    fb.src = cfg.src;
    fb.style.left = (cfg.ox / SW * 100) + '%';
    fb.style.top = (cfg.oy / SH * 100) + '%';
    fb.style.width = (cfg.w * cfg.sc / SW * 100) + '%';

    const rnd = mulberry(cfg.seed);
    const wisps = Array.from({ length: 18 }, () => ({
      x: rnd() * SW, y: rnd() * SH, v: 5 + rnd() * 9, r: 1.2 + rnd() * 2.2,
      amp: 6 + rnd() * 14, f: 0.3 + rnd() * 0.6, p: rnd() * 6.283, a: 0.28 + rnd() * 0.4,
      warm: rnd() < 0.25
    }));

    function useFallback() { el.classList.add('no-gl'); gl = null; }

    function initGL(img) {
      gl = glCanvas.getContext('webgl', { alpha: true, premultipliedAlpha: true, antialias: false });
      if (!gl) { useFallback(); return; }
      try {
        const compile = (type, src) => {
          const s = gl.createShader(type);
          gl.shaderSource(s, src); gl.compileShader(s);
          if (!gl.getShaderParameter(s, gl.COMPILE_STATUS)) throw new Error(gl.getShaderInfoLog(s));
          return s;
        };
        const program = (vs, fs, binds) => {
          const p = gl.createProgram();
          gl.attachShader(p, compile(gl.VERTEX_SHADER, vs));
          gl.attachShader(p, compile(gl.FRAGMENT_SHADER, fs));
          binds.forEach((name, i) => gl.bindAttribLocation(p, i, name));
          gl.linkProgram(p);
          if (!gl.getProgramParameter(p, gl.LINK_STATUS)) throw new Error(gl.getProgramInfoLog(p));
          const u = {};
          ['uTime', 'uBob', 'uAmt', 'uBlink', 'uStage', 'uTex', 'uEyes'].forEach((n) => { u[n] = gl.getUniformLocation(p, n); });
          return { p, u };
        };
        const pm = program(meshVS(cfg), meshFS(cfg), ['aPos']);
        const pg = program(glowVS(cfg), GLOW_FS, ['aCenter', 'aCorner', 'aColor', 'aParams']);

        // malha do sprite
        const CELL = 8;
        const cols = Math.ceil(cfg.w / CELL), rows = Math.ceil(cfg.h / CELL);
        const verts = new Float32Array((cols + 1) * (rows + 1) * 2);
        let n = 0;
        for (let j = 0; j <= rows; j++) for (let i = 0; i <= cols; i++) {
          verts[n++] = Math.min(i * CELL, cfg.w);
          verts[n++] = Math.min(j * CELL, cfg.h);
        }
        const idx = new Uint16Array(cols * rows * 6);
        n = 0;
        for (let j = 0; j < rows; j++) for (let i = 0; i < cols; i++) {
          const a = j * (cols + 1) + i, b = a + 1, c = a + cols + 1, d = c + 1;
          idx[n++] = a; idx[n++] = b; idx[n++] = c;
          idx[n++] = b; idx[n++] = d; idx[n++] = c;
        }
        const meshVB = gl.createBuffer();
        gl.bindBuffer(gl.ARRAY_BUFFER, meshVB); gl.bufferData(gl.ARRAY_BUFFER, verts, gl.STATIC_DRAW);
        const meshIB = gl.createBuffer();
        gl.bindBuffer(gl.ELEMENT_ARRAY_BUFFER, meshIB); gl.bufferData(gl.ELEMENT_ARRAY_BUFFER, idx, gl.STATIC_DRAW);

        // brilhos (quads que seguem a mesma deformação)
        const glows = cfg.rig.glows;
        const corners = [[-1, -1], [1, -1], [1, 1], [-1, 1]];
        const gd = new Float32Array(glows.length * 4 * 12);
        const gi = new Uint16Array(glows.length * 6);
        glows.forEach((g, k) => {
          corners.forEach((c, m) => {
            gd.set([g[0], g[1], c[0], c[1], g[3], g[4], g[5], g[6], g[2], g[7], g[8], g[9]], (k * 4 + m) * 12);
          });
          gi.set([0, 1, 2, 0, 2, 3].map((v) => v + k * 4), k * 6);
        });
        const glowVB = gl.createBuffer();
        gl.bindBuffer(gl.ARRAY_BUFFER, glowVB); gl.bufferData(gl.ARRAY_BUFFER, gd, gl.STATIC_DRAW);
        const glowIB = gl.createBuffer();
        gl.bindBuffer(gl.ELEMENT_ARRAY_BUFFER, glowIB); gl.bufferData(gl.ELEMENT_ARRAY_BUFFER, gi, gl.STATIC_DRAW);

        // textura (alfa pré-multiplicado, sem mipmap por causa de NPOT)
        const tex = gl.createTexture();
        gl.bindTexture(gl.TEXTURE_2D, tex);
        gl.pixelStorei(gl.UNPACK_PREMULTIPLY_ALPHA_WEBGL, true);
        gl.texImage2D(gl.TEXTURE_2D, 0, gl.RGBA, gl.RGBA, gl.UNSIGNED_BYTE, img);
        gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_MIN_FILTER, gl.LINEAR);
        gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_MAG_FILTER, gl.LINEAR);
        gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_WRAP_S, gl.CLAMP_TO_EDGE);
        gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_WRAP_T, gl.CLAMP_TO_EDGE);

        gl.enable(gl.BLEND);
        G = { pm, pg, meshVB, meshIB, glowVB, glowIB, meshCount: idx.length, glowCount: gi.length, tex };
      } catch (err) {
        console.error('WebGL (' + cfg.id + '):', err);
        useFallback();
      }
    }

    glCanvas.addEventListener('webglcontextlost', (e) => { e.preventDefault(); useFallback(); });

    function common(u, tt, bob, blink) {
      gl.uniform1f(u.uTime, tt);
      gl.uniform3f(u.uBob, bob[0], bob[1], bob[2]);
      gl.uniform4f(u.uAmt, amt.float, amt.cape, amt.baton, amt.lantern);
      gl.uniform1f(u.uBlink, blink);
      gl.uniform4f(u.uStage, SW, SH, cfg.ox, cfg.oy);
    }

    function drawGL(tt, bob, blink) {
      gl.viewport(0, 0, glCanvas.width, glCanvas.height);
      gl.clearColor(0, 0, 0, 0);
      gl.clear(gl.COLOR_BUFFER_BIT);

      // sprite
      gl.useProgram(G.pm.p);
      common(G.pm.u, tt, bob, blink);
      gl.activeTexture(gl.TEXTURE0);
      gl.bindTexture(gl.TEXTURE_2D, G.tex);
      gl.uniform1i(G.pm.u.uTex, 0);
      gl.blendFunc(gl.ONE, gl.ONE_MINUS_SRC_ALPHA);
      gl.bindBuffer(gl.ARRAY_BUFFER, G.meshVB);
      gl.bindBuffer(gl.ELEMENT_ARRAY_BUFFER, G.meshIB);
      for (let i = 1; i < 4; i++) gl.disableVertexAttribArray(i);
      gl.enableVertexAttribArray(0);
      gl.vertexAttribPointer(0, 2, gl.FLOAT, false, 8, 0);
      gl.drawElements(gl.TRIANGLES, G.meshCount, gl.UNSIGNED_SHORT, 0);

      // brilhos (mistura "screen")
      gl.useProgram(G.pg.p);
      common(G.pg.u, tt, bob, blink);
      gl.uniform1f(G.pg.u.uEyes, amt.eyes);
      gl.blendFunc(gl.ONE, gl.ONE_MINUS_SRC_COLOR);
      gl.bindBuffer(gl.ARRAY_BUFFER, G.glowVB);
      gl.bindBuffer(gl.ELEMENT_ARRAY_BUFFER, G.glowIB);
      for (let i = 0; i < 4; i++) gl.enableVertexAttribArray(i);
      gl.vertexAttribPointer(0, 2, gl.FLOAT, false, 48, 0);
      gl.vertexAttribPointer(1, 2, gl.FLOAT, false, 48, 8);
      gl.vertexAttribPointer(2, 4, gl.FLOAT, false, 48, 16);
      gl.vertexAttribPointer(3, 4, gl.FLOAT, false, 48, 32);
      gl.drawElements(gl.TRIANGLES, G.glowCount, gl.UNSIGNED_SHORT, 0);
    }

    function drawBack(bobY) {
      const k = bgCanvas.width / SW;
      bg.setTransform(k, 0, 0, k, 0, 0);
      bg.clearRect(0, 0, SW, SH);

      const sh = cfg.shadow;
      const lift = -bobY / 7;                       // 1 no ponto mais alto
      const rx = sh.rx * (1 - 0.10 * lift), ry = sh.ry * (1 - 0.10 * lift);
      const a = 0.78 * (1 - 0.25 * lift);
      bg.save();
      bg.translate(sh.x, sh.y); bg.scale(1, ry / rx);
      const g = bg.createRadialGradient(0, 0, 0, 0, 0, rx);
      g.addColorStop(0, 'rgba(0,0,0,' + a.toFixed(3) + ')');
      g.addColorStop(0.55, 'rgba(0,0,0,' + (a * 0.5).toFixed(3) + ')');
      g.addColorStop(1, 'rgba(0,0,0,0)');
      bg.fillStyle = g;
      bg.beginPath(); bg.arc(0, 0, rx, 0, Math.PI * 2); bg.fill();
      bg.restore();

      const span = SH + 40;
      for (const w of wisps) {
        const y = (((w.y - w.v * S.t) % span) + span) % span - 20;
        const x = w.x + Math.sin(S.t * w.f + w.p) * w.amp;
        const edge = Math.max(0, Math.min(1, y / 70, (SH - y) / 70));
        const al = w.a * (0.55 + 0.45 * Math.sin(S.t * 0.9 + w.p)) * edge;
        if (al <= 0.005) continue;
        const rgb = w.warm ? '240,178,96' : '188,232,204';
        bg.fillStyle = 'rgba(' + rgb + ',' + (al * 0.16).toFixed(3) + ')';
        bg.beginPath(); bg.arc(x, y, w.r * 3.4, 0, Math.PI * 2); bg.fill();
        bg.fillStyle = 'rgba(' + rgb + ',' + al.toFixed(3) + ')';
        bg.beginPath(); bg.arc(x, y, w.r, 0, Math.PI * 2); bg.fill();
      }
    }

    function render() {
      const A = amt.float, tt = cfg.t0 + S.t * cfg.ts;
      const bob = [2.4 * Math.sin(tt * 0.75 + 0.6) * A, -7 * Math.sin(tt * 1.5) * A, 0.012 * Math.sin(tt * 0.75 + 2.0) * A];
      drawBack(bob[1]);
      if (gl && G) drawGL(tt, bob, blinkAt(tt, cfg.blink) * amt.eyes);
    }

    function resize() {
      const r = el.getBoundingClientRect();
      const dpr = Math.min(window.devicePixelRatio || 1, 3);
      const w = Math.max(2, Math.round(r.width * dpr));
      const h = Math.max(2, Math.round(r.height * dpr));
      [glCanvas, bgCanvas].forEach((c) => {
        if (c.width !== w) c.width = w;
        if (c.height !== h) c.height = h;
      });
    }
    new ResizeObserver(resize).observe(el);
    resize();

    const img = new Image();
    img.onload = () => initGL(img);
    img.onerror = useFallback;
    img.src = cfg.src;

    return { render };
  }

  const stages = CHARS.map((cfg) => createStage(cfg, document.querySelector('.stage[data-char="' + cfg.id + '"]')));

  /* ---------- laço principal ---------- */
  let last = performance.now();
  function frame(now) {
    const dt = Math.min(0.05, Math.max(0, (now - last) / 1000));
    last = now;
    if (S.playing) S.t += dt * S.speed;
    const k = 1 - Math.exp(-dt * 9);
    for (const key in amt) amt[key] += (target[key] - amt[key]) * k;
    stages.forEach((s) => s.render());
    requestAnimationFrame(frame);
  }
  requestAnimationFrame((now) => { last = now; frame(now); });
})();
</script>
</body>
</html>
