<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <title>Estação Nexus — Exterior</title>
  <style>
    html, body { margin: 0; width: 100%; height: 100%; overflow: hidden; background: #04050c; color: #cfd6ff; font-family: system-ui, sans-serif; }
    #c { position: fixed; inset: 0; width: 100%; height: 100%; display: block; cursor: grab; touch-action: none; }
    .caixa { position: fixed; z-index: 5; border: 1px solid #3a4380; background: #0a0c1add; border-radius: 8px; pointer-events: none; }
    #hud { left: 16px; top: 16px; padding: 10px 13px; letter-spacing: .08em; font-size: 12px; }
    #hud span { color: #8fa4ff; font-size: 11px; }
    #hud i { display: block; height: 2px; margin-top: 8px; background: linear-gradient(90deg,#D4AA40,#CC4060,#E8B86D,#8EB5D8,#D2691E,#D9B776,#9B7FD4,#5EC4BB,#5FA88A); }
    #status { right: 16px; top: 16px; padding: 8px 10px; font-size: 11px; color: #8fa4ff; }
    #hint { bottom: 16px; left: 50%; transform: translateX(-50%); padding: 8px 12px; font-size: 11px; white-space: nowrap; }
    #entrar {
      position: fixed; z-index: 6; left: 50%; top: 50%; transform: translate(-50%, -50%);
      display: none; flex-direction: column; align-items: center; gap: 10px;
      padding: 18px 22px; background: rgba(10, 12, 26, .94); border: 1px solid #6a7cff;
      border-radius: 12px; box-shadow: 0 16px 48px #000a; text-align: center; pointer-events: auto;
    }
    #entrar h2 { margin: 0; font-size: 15px; letter-spacing: .12em; color: #ffb35a; }
    #entrar p { margin: 0; font-size: 12px; opacity: .8; max-width: 250px; line-height: 1.4; }
    #entrar .acoes { display: flex; gap: 8px; margin-top: 4px; }
    #entrar button { appearance: none; cursor: pointer; border-radius: 8px; padding: 9px 14px; font-size: 12px; letter-spacing: .06em; border: 1px solid #3a4380; background: #12162e; color: #8fa4ff; }
    #entrar button.primario { background: #232a5c; border-color: #8fa4ff; color: #fff; }
    #entrar button:hover { filter: brightness(1.15); }
    #voltar { position: fixed; z-index: 5; left: 16px; bottom: 16px; padding: 8px 12px; border: 1px solid #3a4380; background: #0a0c1add; border-radius: 8px; font-size: 11px; color: #8fa4ff; text-decoration: none; }
    #voltar:hover { border-color: #8fa4ff; color: #fff; }
    #err { display: none; position: fixed; inset: 0; z-index: 20; place-items: center; text-align: center; padding: 30px; background: #04050c; color: #fff; }
  </style>
</head>
<body>
  <canvas id="c"></canvas>
  <div id="hud" class="caixa"><b>ESTAÇÃO NEXUS</b><br><span>EXTERIOR · PEQUENA POR FORA, INFINITA POR DENTRO</span><i></i></div>
  <div id="status" class="caixa">SISTEMA ONLINE</div>
  <div id="hint" class="caixa">Arraste para girar · roda/pinça para aproximar · clique na nave para entrar</div>
  <a id="voltar" href="../nexus.html">← Voltar ao Nexus</a>
  <div id="entrar">
    <h2>ECLUSA DA PROA</h2>
    <p>A eclusa está aberta. Deseja entrar na Estação Nexus?</p>
    <div class="acoes">
      <button type="button" class="primario" id="btn-entrar">Entrar</button>
      <button type="button" id="btn-cancelar">Cancelar</button>
    </div>
  </div>
  <div id="err"></div>

  <!-- three.min.js mora em Lib/, ao lado de Nexus.html e da pasta Nave -->
  <script src="../Lib/three.min.js"></script>
  <script>
(function () {
  'use strict';
  var DESTINO = 'mirante_da_proa.html';          // primeira sala do interior (o viajante aparece no corredor)
  var H = [0xD4AA40, 0xCC4060, 0xE8B86D, 0x8EB5D8, 0xD2691E, 0xD9B776, 0x9B7FD4, 0x5EC4BB, 0x5FA88A]; // cores dos 9 universos
  var BEAT = 60 / 92;
  var err = document.getElementById('err');
  var status = document.getElementById('status');
  var canvas = document.getElementById('c');
  var painelEntrar = document.getElementById('entrar');

  try {
    if (!window.THREE) throw new Error('Three.js não foi inicializado. Verifique ../Lib/three.min.js');

    var mobile = innerWidth < 700;
    var renderer = new THREE.WebGLRenderer({ canvas: canvas, antialias: !mobile, powerPreference: 'high-performance' });
    renderer.setPixelRatio(Math.min(devicePixelRatio, mobile ? 1.5 : 2));
    renderer.setSize(innerWidth, innerHeight, false);
    renderer.setClearColor(0x04050c, 1);

    var scene = new THREE.Scene();
    scene.fog = new THREE.FogExp2(0x04050c, .009);

    var camera = new THREE.PerspectiveCamera(38, innerWidth / innerHeight, .1, 300);
    var dist = 17, az = .55, el = .14;
    function cam() {
      var ce = Math.cos(el);
      camera.position.set(Math.sin(az) * ce * dist, Math.sin(el) * dist + .6, Math.cos(az) * ce * dist);
      camera.lookAt(0, .1, 0);
    }
    cam();

    scene.add(new THREE.HemisphereLight(0x6a7cff, 0x050609, 1.5));
    var key = new THREE.DirectionalLight(0xffd9a0, 2.2);
    key.position.set(6, 8, 12);
    scene.add(key);
    var rim = new THREE.DirectionalLight(0x8a6aff, 2);
    rim.position.set(-9, 4, -12);
    scene.add(rim);
    var motorLuz = new THREE.PointLight(0xff8a3a, 3, 16);
    motorLuz.position.set(0, 0, -7);
    scene.add(motorLuz);

    // pseudo-aleatório determinístico: a nave é sempre a mesma
    var sd = 11;
    function rnd() { sd = (sd * 16807) % 2147483647; return (sd - 1) / 2147483646; }

    var ship = new THREE.Group();
    ship.position.y = -.2;
    scene.add(ship);

    function mat(c, r, m, e, ei) {
      return new THREE.MeshStandardMaterial({ color: c, roughness: r == null ? .5 : r, metalness: m == null ? .85 : m, emissive: e || 0, emissiveIntensity: ei || 0 });
    }
    var hull = mat(0x1a1d27, .45, .85);
    var dark = mat(0x08090f, .6, .8);
    var steel = mat(0x3a4150, .4, .9);
    var brass = mat(0x6b4f22, .35, .92, 0x2a1a06, .25);
    var rust = mat(0x4a2a1c, .65, .7);
    var teal = mat(0x1c3a3c, .5, .8);
    var glass = mat(0x10305a, .1, .5, 0x2a6aff, 1.1);
    var amber = mat(0x2a1a06, .5, .2, 0xffb35a, 2);
    var chapas = [brass, rust, teal, steel, dark];

    function box(x, y, z, sx, sy, sz, ma, rx, ry, rz) {
      var o = new THREE.Mesh(new THREE.BoxGeometry(sx, sy, sz), ma);
      o.position.set(x, y, z);
      o.rotation.set(rx || 0, ry || 0, rz || 0);
      ship.add(o);
      return o;
    }
    function cyl(x, y, z, r, dep, ma, rx, ry, rz, seg) {
      var o = new THREE.Mesh(new THREE.CylinderGeometry(r, r, dep, seg || 28), ma);
      o.position.set(x, y, z);
      o.rotation.set(rx || 0, ry || 0, rz || 0);
      ship.add(o);
      return o;
    }
    var PI2 = Math.PI / 2;

    // Casco: corpo longo, dorso, quilha e proa afunilada
    box(0, 0, 0, 2.5, 1.5, 9, hull);
    box(0, .95, -.6, 1.5, .45, 6, steel);
    box(0, -.95, -.4, 1.7, .4, 7, dark);
    var nariz = new THREE.Mesh(new THREE.CylinderGeometry(.5, 1.75, 3.2, 4), hull);
    nariz.rotation.set(PI2, Math.PI / 4, 0);
    nariz.scale.set(1, 1, .6);
    nariz.position.set(0, 0, 6.1);
    ship.add(nariz);
    box(0, .62, 5.2, 1.3, .14, 1.9, glass, -.12, 0, 0);
    box(0, .4, 6.5, .7, .1, 1.1, glass, -.22, 0, 0);
    box(-.9, .78, -.5, .06, .04, 7, glass);
    box(.9, .78, -.5, .06, .04, 7, glass);

    // Janelas âmbar nos flancos (dois conveses), algumas apagadas
    var janelas = [];
    for (var s = -1; s <= 1; s += 2) {
      [.3, -.12].forEach(function (y) {
        for (var z = -3.7; z <= 3.9; z += .62) {
          if (rnd() < .18) continue;
          var noSpon = z > -3.05 && z < .65, noPod = z > 1.1 && z < 2.9 && y < .25;
          if (noPod) continue;            // escondidas atrás do pod do flanco
          janelas.push(box(s * (noSpon ? 2.045 : 1.27), noSpon ? y - .05 : y, z, .04, .15, .3, amber)); // sobre a face do sponson
        }
      });
      box(s * 1.65, -.1, -1.2, .75, .95, 3.6, steel);
      box(s * 1.65, .42, -1.2, .8, .08, 3.7, brass);
      box(s * 1.6, -.15, 2, .6, .7, 1.8, hull);
    }

    // Chapas remendadas: pedaços de metais diferentes recolhidos dos universos
    for (var g = 0; g < 46; g++) {
      var ma = chapas[Math.floor(rnd() * chapas.length)], h = .04 + rnd() * .06, sd2 = rnd() < .5 ? -1 : 1;
      if (rnd() < .5) box(sd2 * (.8 + rnd() * .35), .75 + h / 2, -4 + rnd() * 8, .2 + rnd() * .5, h, .25 + rnd() * .7, ma);
      else {
        var zs = rnd() < .5 ? -4.3 + rnd() * 1.1 : 3 + rnd() * 1.3;   // só onde o casco está exposto
        box(sd2 * (1.25 + h / 2), -.4 + rnd() * .7, zs, h, .2 + rnd() * .4, .25 + rnd() * .5, ma);
      }
    }

    // Costuras de kintsugi: uma por universo, brilhando na cor dele
    var costuras = [];
    for (var u = 0; u < 9; u++) {
      var sm = mat(0x111111, .3, .5, H[u], 2), z0 = -3.6 + u * .9;
      costuras.push(sm);
      for (var j = 0; j < 3; j++) {
        var px = -.9 + j * .9 + (rnd() - .5) * .25, pz = z0 + (rnd() - .5) * .2;
        var noDorso = Math.abs(px) < .72 && pz > -3.5 && pz < 2.3;   // sobre o dorso (y 1.19) ou sobre o casco (y .765)
        box(px, noDorso ? 1.19 : .765, pz, .55, .03, .06, sm, 0, (rnd() - .5) * .9, 0);
      }
      var emSpon = z0 > -3.05 && z0 < .65, emPod = z0 > 1.1 && z0 < 2.9;
      for (var sx = -1; sx <= 1; sx += 2) for (var k = 0; k < 2; k++) {
        if (emPod && k === 0) continue;
        box(sx * (emSpon ? 2.04 : 1.265), emPod ? .45 : (k ? .12 : -.25), z0 + (rnd() - .5) * .2, .03, emSpon ? .45 : .5, .06, sm, 0, 0, (rnd() - .5) * .8);
      }
    }

    // Motores: três bocais grandes com chama laranja
    var chamas = [];
    [-.85, 0, .85].forEach(function (x, i) {
      cyl(x, -.05, -5, .5, 1.4, dark, PI2, 0, 0);
      var anel = new THREE.Mesh(new THREE.TorusGeometry(.5, .07, 8, 28), brass);
      anel.position.set(x, -.05, -5.7);
      ship.add(anel);
      cyl(x, -.05, -5.72, .38, .08, mat(0xff8a3a, .2, .3, 0xff8a3a, 3), PI2, 0, 0);
      var ch = new THREE.Mesh(new THREE.ConeGeometry(.36, 1.8, 16), new THREE.MeshBasicMaterial({ color: 0xff8a3a, transparent: true, opacity: .55, blending: THREE.AdditiveBlending, depthWrite: false }));
      ch.rotation.x = -PI2;
      ch.position.set(x, -.05, -6.7);
      ship.add(ch);
      chamas.push(ch);
    });
    [-1.65, 1.65].forEach(function (x) {
      cyl(x, -.1, -3.1, .3, 1, dark, PI2, 0, 0);
      var c2 = new THREE.Mesh(new THREE.ConeGeometry(.22, 1.1, 12), new THREE.MeshBasicMaterial({ color: 0xff8a3a, transparent: true, opacity: .5, blending: THREE.AdditiveBlending, depthWrite: false }));
      c2.rotation.x = -PI2;
      c2.position.set(x, -.1, -4);
      ship.add(c2);
      chamas.push(c2);
    });

    // Prato de comunicação, antenas e luzes de navegação
    var prato = new THREE.Mesh(new THREE.TorusGeometry(.9, .05, 8, 32), brass);
    prato.position.set(0, 1.75, -2.2);
    prato.rotation.set(-.5, 0, 0);
    ship.add(prato);
    cyl(0, 1.45, -2.2, .06, .6, steel);
    [-.55, .5].forEach(function (x, i) { cyl(x, 1.8, 1.2 + i, .02, 1.3, steel); });

    // Bandeira da Brigada Gurren: mastro na popa do dorso, pano ondulando.
    // Bandeira da Brigada Gurren, igual à capa do Super Tengen Toppa Gurren Lagann: campo vermelho + o crânio em chamas
    // com os óculos (emblema recortado da textura da capa, embutido abaixo). Pra usar outra arte, aponte BANDEIRA_IMG pra um arquivo.
    var BANDEIRA_IMG = '';           // ex.: '../Assets/bandeira-gurren.png'

      mb(-.5, 4.3, .95, .85, .38, .1, glass, 0, 0, .28); mb(.5, 4.3, .95, .85, .38, .1, glass, 0, 0, -.28);
      for (var k = -2; k <= 2; k++) { var fl = new THREE.Mesh(new THREE.ConeGeometry(.2, 1.1 - Math.abs(k) * .18, 6), mat(0xff8a1a, .3, .2, 0xff8a1a, 2)); fl.position.set(k * .3, 5.1 - Math.abs(k) * .08, .1); M.add(fl); }
      mb(-3.0, 1.6, 0, 1.1, 2.4, 1.3, hull); mb(-3.1, -.6, .4, 1.2, 2.4, 1.4, dark); mb(-3.1, -2.1, .7, 1.1, 1.1, 1.3, steel);
      mb(3.0, 1.6, 0, 1.1, 2.4, 1.3, hull); mb(3.1, -.6, .4, 1.2, 2.4, 1.4, dark);
      var broca = new THREE.Group(); broca.position.set(3.1, -2.2, 1.0); M.add(broca);
      var bc = new THREE.Mesh(new THREE.ConeGeometry(.75, 3.4, 16), mat(0x9aa0a8, .3, .9, 0x22ff55, 1.4)); bc.rotation.x = PI2; bc.position.z = 1.9; broca.add(bc);
      for (var q = 0; q < 6; q++) { var an = new THREE.Mesh(new THREE.TorusGeometry(.7 - q * .1, .06, 6, 16), verde); an.position.z = .5 + q * .5; broca.add(an); }
      [-1, 0, 1].forEach(function (x) {
        mc(x, 2.6, -1.6, .45, .55, 1.4, dark, PI2, 0, 0);
        var f2 = new THREE.Mesh(new THREE.ConeGeometry(.34, 1.8, 14), new THREE.MeshBasicMaterial({ color: 0xff8a3a, transparent: true, opacity: .55, blending: THREE.AdditiveBlending, depthWrite: false }));
        f2.rotation.x = -PI2; f2.position.set(x, 2.6, -3.1); M.add(f2); chamas.push(f2);
      });
      M.userData = { broca: broca, nucleo: nucleo };
      M.position.y = 1.4;
      return M;
    }
    if (MODO_MECHA) {
      ship.visible = false;
      mecha = construirMecha(); scene.add(mecha);
      mecha.add(FG); FG.position.set(0, .9, 1.9);        // a bandeira passa pras costas do mecha
      dist = 26; cam();
      document.querySelector('#hud span').textContent = 'MECHA · PEQUENO POR FORA, INFINITO POR DENTRO';
    }

    // Clique na nave → painel de entrada para o interior
    var ray = new THREE.Raycaster();
    var pointer = new THREE.Vector2();
    var drag = false, moved = false, lx = 0, ly = 0;
    function sobreNave(e) {
      pointer.x = (e.clientX / innerWidth) * 2 - 1;
      pointer.y = -(e.clientY / innerHeight) * 2 + 1;
      ray.setFromCamera(pointer, camera);
      return ray.intersectObject(mecha || ship, true).length > 0;
    }

    canvas.addEventListener('pointerdown', function (e) {
      drag = true; moved = false; lx = e.clientX; ly = e.clientY;
      canvas.style.cursor = 'grabbing';
      if (canvas.setPointerCapture) canvas.setPointerCapture(e.pointerId);
    });
    canvas.addEventListener('pointermove', function (e) {
      if (!drag) { canvas.style.cursor = sobreNave(e) ? 'pointer' : 'grab'; return; }
      var dx = e.clientX - lx, dy = e.clientY - ly;
      if (Math.abs(dx) + Math.abs(dy) > 4) moved = true;
      az -= dx * .006;
      el = Math.max(-.65, Math.min(.65, el + dy * .004));
      lx = e.clientX; ly = e.clientY;
      cam();
    });
    function aoSoltar(e) {
      if (!drag) return;
      drag = false;
      canvas.style.cursor = 'grab';
      if (moved || !e) return;
      if (sobreNave(e)) painelEntrar.style.display = 'flex';
    }
    canvas.addEventListener('pointerup', aoSoltar);
    canvas.addEventListener('pointercancel', function () { drag = false; });

    canvas.addEventListener('wheel', function (e) {
      e.preventDefault();
      dist = Math.max(9, Math.min(30, dist * Math.exp(e.deltaY * .001)));
      cam();
    }, { passive: false });

    document.getElementById('btn-entrar').addEventListener('click', function () {
      window.location.href = DESTINO;
    });
    document.getElementById('btn-cancelar').addEventListener('click', function () {
      painelEntrar.style.display = 'none';
    });

    var last = performance.now();
    function loop(t) {
      requestAnimationFrame(loop);
      var dt = Math.min(.05, (t - last) / 1000);
      last = t;
      var s = t / 1000, batida = .5 + .5 * Math.sin(s * Math.PI * 2 / BEAT);
      ship.rotation.y += dt * .035;
      if (mecha) {
        mecha.rotation.y += dt * .035;
        mecha.position.y = 1.4 + Math.sin(s * 1.2) * .08;
        mecha.userData.broca.rotation.z += dt * 6;
        mecha.userData.nucleo.material.emissiveIntensity = 2.2 + .8 * batida;
      }
      chamas.forEach(function (o, i) {
        o.scale.set(1, .85 + .22 * Math.sin(t * .02 + i * 1.7), 1);
      });
      motorLuz.intensity = 2.6 + .6 * Math.sin(t * .02);
      costuras.forEach(function (m, i) { m.emissiveIntensity = 1.5 + .9 * batida * (i % 2 ? 1 : .6); });
      glass.emissiveIntensity = .9 + .5 * batida;
      amber.emissiveIntensity = 1.8 + .5 * batida;
      estrelaHalo.scale.setScalar(60 * (1 + .04 * Math.sin(s * Math.PI * 2 / BEAT)));
      estrelaCore.scale.setScalar(10 * (1 + .04 * Math.sin(s * Math.PI * 2 / BEAT)));
      lampL.material.emissiveIntensity = lampR.material.emissiveIntensity = (Math.floor(s * 1.2) % 2) ? 2.8 : .5;
      var pa = panoGeo.attributes.position.array;
      for (var q = 0; q < pa.length; q += 3) {
        var u = (panoBase[q] + 1.05) / 2.1;
        pa[q + 2] = Math.sin(panoBase[q] * 3.2 - s * 4.2 + panoBase[q + 1] * 1.2) * .1 * u;   // presa no mastro, solta na ponta
      }
      panoGeo.attributes.position.needsUpdate = true;
      panoGeo.computeVertexNormals();
      ilhas.forEach(function (gp, i) {
        gp.position.y = gp.userData.y0 + Math.sin(s * .5 + i) * .45;
        gp.rotation.y += dt * .02;
      });
      renderer.render(scene, camera);
    }
    requestAnimationFrame(loop);

    addEventListener('resize', function () {
      renderer.setSize(innerWidth, innerHeight, false);
      camera.aspect = innerWidth / innerHeight;
      camera.updateProjectionMatrix();
    });

    status.textContent = 'NAVE ONLINE';
  } catch (e) {
    console.error(e);
    status.style.display = 'none';
    err.style.display = 'grid';
    err.innerHTML = '<div><h2>Erro ao iniciar a nave 3D</h2><p>' + String(e && e.message || e) + '</p></div>';
  }
})();
  </script>
</body>
</html>
