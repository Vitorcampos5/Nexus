<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <title>Estação Nexus — Exterior</title>
  <style>
    html, body { margin: 0; width: 100%; height: 100%; overflow: hidden; background: #030508; color: #dbe8e2; font-family: system-ui, sans-serif; }
    #c { position: fixed; inset: 0; width: 100%; height: 100%; display: block; }
    #hud {
      position: fixed; z-index: 5; left: 16px; top: 16px;
      padding: 10px 13px; border: 1px solid #385044; background: #07100ddd;
      border-radius: 8px; letter-spacing: .08em; font-size: 12px; pointer-events: none;
    }
    #status {
      position: fixed; z-index: 5; right: 16px; top: 16px;
      padding: 8px 10px; border: 1px solid #294437; background: #07100dbb;
      border-radius: 8px; font-size: 11px; pointer-events: none;
    }
    #hint {
      position: fixed; z-index: 5; bottom: 16px; left: 50%; transform: translateX(-50%);
      padding: 8px 12px; background: #07100dbb; border: 1px solid #294437;
      border-radius: 8px; font-size: 11px; white-space: nowrap; pointer-events: none;
    }
    #entrar {
      position: fixed; z-index: 6; left: 50%; top: 50%; transform: translate(-50%, -50%);
      display: none; flex-direction: column; align-items: center; gap: 10px;
      padding: 18px 22px; background: rgba(7, 16, 13, .92); border: 1px solid #3b7057;
      border-radius: 12px; box-shadow: 0 16px 48px #000a; text-align: center;
      pointer-events: auto;
    }
    #entrar h2 { margin: 0; font-size: 15px; letter-spacing: .12em; color: #8df5c1; }
    #entrar p { margin: 0; font-size: 12px; opacity: .75; max-width: 240px; line-height: 1.4; }
    #entrar .acoes { display: flex; gap: 8px; margin-top: 4px; }
    #entrar button {
      appearance: none; cursor: pointer; border-radius: 8px; padding: 9px 14px;
      font-size: 12px; letter-spacing: .06em; border: 1px solid #3b7057;
      background: #10251b; color: #8df5c1;
    }
    #entrar button.primario { background: #1a3d2c; border-color: #5ec49a; color: #d8fff0; }
    #entrar button:hover { filter: brightness(1.12); }
    #voltar {
      position: fixed; z-index: 5; left: 16px; bottom: 16px;
      padding: 8px 12px; border: 1px solid #294437; background: #07100dbb;
      border-radius: 8px; font-size: 11px; color: #9ecbb8; text-decoration: none;
    }
    #voltar:hover { border-color: #5ec49a; color: #d8fff0; }
    #err {
      display: none; position: fixed; inset: 0; z-index: 20; place-items: center;
      text-align: center; padding: 30px; background: #030508; color: #fff;
    }
  </style>
</head>
<body>
  <canvas id="c"></canvas>
  <div id="hud"><b>ESTAÇÃO NEXUS</b><br><span>NAVE EXTERIOR · 3D</span></div>
  <div id="status">SISTEMA ONLINE</div>
  <div id="hint">Arraste para girar · roda/pinça para aproximar · clique na nave para entrar</div>
  <a id="voltar" href="../nexus.html">← Voltar ao Nexus</a>
  <div id="entrar">
    <h2>SALA DE COMANDO</h2>
    <p>A eclusa está aberta. Deseja entrar no interior da Estação Nexus?</p>
    <div class="acoes">
      <button type="button" class="primario" id="btn-entrar">Entrar</button>
      <button type="button" id="btn-cancelar">Cancelar</button>
    </div>
  </div>
  <div id="err"></div>

  <!-- three.min.js mora em Lib/, ao lado de Nexus.html e da pasta Nave -->
  <script src="../Lib/three.min.js"></script>
  <script>
(function () {
  'use strict';
  var err = document.getElementById('err');
  var status = document.getElementById('status');
  var canvas = document.getElementById('c');
  var painelEntrar = document.getElementById('entrar');

  try {
    if (!window.THREE) throw new Error('Three.js não foi inicializado. Verifique ../Lib/three.min.js');

    var mobile = innerWidth < 700;
    var renderer = new THREE.WebGLRenderer({ canvas: canvas, antialias: !mobile, powerPreference: 'high-performance' });
    renderer.setPixelRatio(Math.min(devicePixelRatio, mobile ? 1.5 : 2));
    renderer.setSize(innerWidth, innerHeight, false);
    renderer.setClearColor(0x030508, 1);

    var scene = new THREE.Scene();
    scene.fog = new THREE.FogExp2(0x030508, .014);

    var camera = new THREE.PerspectiveCamera(38, innerWidth / innerHeight, .1, 250);
    var dist = 12, az = .35, el = .16;
    function cam() {
      var ce = Math.cos(el);
      camera.position.set(Math.sin(az) * ce * dist, Math.sin(el) * dist + .55, Math.cos(az) * ce * dist);
      camera.lookAt(0, .1, 0);
    }
    cam();

    scene.add(new THREE.HemisphereLight(0xb9d2d0, 0x050609, 1.8));
    var key = new THREE.DirectionalLight(0xffffff, 2.4);
    key.position.set(5, 8, 10);
    scene.add(key);
    var rim = new THREE.DirectionalLight(0x39ff8a, 1.5);
    rim.position.set(-8, 3, -10);
    scene.add(rim);
    var red = new THREE.PointLight(0xff3045, 1.1, 20);
    red.position.set(0, 1, -5);
    scene.add(red);

    var ship = new THREE.Group();
    ship.position.y = -.25;
    scene.add(ship);

    function mat(c, r, m, e, ei) {
      return new THREE.MeshStandardMaterial({
        color: c,
        roughness: r == null ? .4 : r,
        metalness: m == null ? .8 : m,
        emissive: e || 0,
        emissiveIntensity: ei || 0
      });
    }
    var hull = mat(0x1b222b, .32, .92);
    var dark = mat(0x070a0e, .55, .86);
    var edge = mat(0x56616b, .28, .95);
    var glass = mat(0x163a46, .08, .45, 0x06151a, .35);
    var gold = mat(0x8c6a28, .25, .92, 0x3a2604, .2);
    var green = mat(0x37ff8a, .18, .5, 0x12ff68, 2.2);
    var redm = mat(0xd52b3b, .2, .55, 0x8a1018, 1.5);

    function box(x, y, z, sx, sy, sz, ma, rx, ry, rz) {
      var o = new THREE.Mesh(new THREE.BoxGeometry(sx, sy, sz), ma);
      o.position.set(x, y, z);
      o.rotation.set(rx || 0, ry || 0, rz || 0);
      ship.add(o);
      return o;
    }
    function cyl(x, y, z, r, dep, ma, rx, ry, rz) {
      var o = new THREE.Mesh(new THREE.CylinderGeometry(r, r, dep, 32), ma);
      o.position.set(x, y, z);
      o.rotation.set(rx || 0, ry || 0, rz || 0);
      ship.add(o);
      return o;
    }

    // Fuselagem
    box(0, 0, 1.0, 3.5, 1.45, 7.4, hull);
    box(0, .05, 4.55, 2.35, 1.12, 2.1, hull);
    box(0, .08, 5.55, 1.25, .72, 1.1, dark);
    box(0, .46, 4.9, 1.55, .12, 1.75, glass, -.18, 0, 0);
    box(0, .52, 5.48, .9, .10, .7, glass, -.1, 0, 0);
    box(0, 0, 6.75, 1.7, .95, 1.0, hull);
    box(0, 0, 7.55, .95, .58, .72, edge);
    cyl(0, 0, 7.98, .42, .8, dark, Math.PI / 2, 0, 0);
    box(0, -.92, .2, 1.0, .45, 5.2, dark);
    box(0, -1.15, 2.2, .65, .35, 2.5, gold);

    // Asas
    box(-2.15, -.02, .2, 3.9, .28, 3.9, hull, 0, .28, -.08);
    box(2.15, -.02, .2, 3.9, .28, 3.9, hull, 0, -.28, .08);
    box(-3.55, -.05, -.2, 2.0, .22, 1.25, edge, 0, .5, -.08);
    box(3.55, -.05, -.2, 2.0, .22, 1.25, edge, 0, -.5, .08);

    // Estabilizadores
    box(-1.45, 1.25, -2.25, .42, 1.9, 1.9, hull, 0, .22, -.08);
    box(1.45, 1.25, -2.25, .42, 1.9, 1.9, hull, 0, -.22, .08);

    // Motores
    var cores = [];
    [-1.15, 0, 1.15].forEach(function (x) {
      cyl(x, 0, -3.05, .62, 1.45, dark, Math.PI / 2, 0, 0);
      var core = cyl(x, 0, -3.82, .38, .16, green, Math.PI / 2, 0, 0);
      cores.push(core);
      cyl(x, 0, -3.91, .22, .12, glass, Math.PI / 2, 0, 0);
    });
    [-3.05, 3.05].forEach(function (x) {
      cyl(x, -.18, -1.05, .38, 1.25, dark, Math.PI / 2, 0, 0);
      var cc = cyl(x, -.18, -1.72, .2, .12, green, Math.PI / 2, 0, 0);
      cores.push(cc);
    });

    cyl(0, .76, -.9, 1.15, .08, gold, 0, 0, 0);
    box(-.82, .74, .3, .12, .12, 4.7, green);
    box(.82, .74, .3, .12, .12, 4.7, green);
    box(-1.0, -.68, 1.0, .08, .08, 4.2, gold);
    box(1.0, -.68, 1.0, .08, .08, 4.2, gold);

    for (var side = -1; side <= 1; side += 2) {
      box(side * 1.65, .2, 1.3, .35, .7, 1.5, dark);
      box(side * 1.86, .2, 1.3, .08, .3, .9, green);
      box(side * 1.55, -.25, -1.1, .5, .35, 1.1, edge);
    }

    var navL = new THREE.PointLight(0xff2038, 2, 8);
    navL.position.set(-3.7, .1, .2);
    ship.add(navL);
    var navR = new THREE.PointLight(0x35ff8a, 2, 8);
    navR.position.set(3.7, .1, .2);
    ship.add(navR);
    box(-3.72, .08, .25, .1, .1, .35, redm);
    box(3.72, .08, .25, .1, .1, .35, green);

    // Estrelas de fundo
    var geo = new THREE.BufferGeometry();
    var arr = new Float32Array(1500 * 3);
    for (var i = 0; i < 1500; i++) {
      var rr = 55 + Math.random() * 100;
      var a = Math.random() * Math.PI * 2;
      var b = (Math.random() - .5) * 1.6;
      arr[i * 3] = Math.cos(a) * Math.cos(b) * rr;
      arr[i * 3 + 1] = Math.sin(b) * rr;
      arr[i * 3 + 2] = Math.sin(a) * Math.cos(b) * rr;
    }
    geo.setAttribute('position', new THREE.BufferAttribute(arr, 3));
    scene.add(new THREE.Points(geo, new THREE.PointsMaterial({ color: 0xbfd7d0, size: .18, sizeAttenuation: true })));

    // Clique na nave → painel de entrada para o interior
    var ray = new THREE.Raycaster();
    var pointer = new THREE.Vector2();
    var drag = false, moved = false, lx = 0, ly = 0;

    canvas.addEventListener('pointerdown', function (e) {
      drag = true;
      moved = false;
      lx = e.clientX;
      ly = e.clientY;
      if (canvas.setPointerCapture) canvas.setPointerCapture(e.pointerId);
    });
    canvas.addEventListener('pointermove', function (e) {
      if (!drag) return;
      var dx = e.clientX - lx, dy = e.clientY - ly;
      if (Math.abs(dx) + Math.abs(dy) > 4) moved = true;
      az -= dx * .006;
      el += dy * .004;
      el = Math.max(-.65, Math.min(.65, el));
      lx = e.clientX;
      ly = e.clientY;
      cam();
    });
    function aoSoltar(e) {
      if (!drag) return;
      drag = false;
      if (moved || !e) return;
      pointer.x = (e.clientX / innerWidth) * 2 - 1;
      pointer.y = -(e.clientY / innerHeight) * 2 + 1;
      ray.setFromCamera(pointer, camera);
      var hits = ray.intersectObject(ship, true);
      if (hits.length) {
        painelEntrar.style.display = 'flex';
      }
    }
    canvas.addEventListener('pointerup', aoSoltar);
    canvas.addEventListener('pointercancel', function () { drag = false; });

    canvas.addEventListener('wheel', function (e) {
      e.preventDefault();
      dist = Math.max(7, Math.min(22, dist * Math.exp(e.deltaY * .001)));
      cam();
    }, { passive: false });

    document.getElementById('btn-entrar').addEventListener('click', function () {
      window.location.href = 'estacao_interior.html';
    });
    document.getElementById('btn-cancelar').addEventListener('click', function () {
      painelEntrar.style.display = 'none';
    });

    var last = performance.now();
    function loop(t) {
      requestAnimationFrame(loop);
      var dt = Math.min(.05, (t - last) / 1000);
      last = t;
      ship.rotation.y += dt * .035;
      cores.forEach(function (o, i) {
        var q = .75 + .25 * Math.sin(t * .006 + i);
        o.scale.set(1, q, 1);
      });
      renderer.render(scene, camera);
    }
    requestAnimationFrame(loop);

    addEventListener('resize', function () {
      renderer.setSize(innerWidth, innerHeight, false);
      camera.aspect = innerWidth / innerHeight;
      camera.updateProjectionMatrix();
    });

    status.textContent = 'NAVE ONLINE';
  } catch (e) {
    console.error(e);
    status.style.display = 'none';
    err.style.display = 'grid';
    err.innerHTML = '<div><h2>Erro ao iniciar a nave 3D</h2><p>' + String(e && e.message || e) + '</p></div>';
  }
})();
  </script>
</body>
</html>
