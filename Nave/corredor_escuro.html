(function(){

{const o=new THREE.Mesh(new THREE.PlaneGeometry(2*HW,14),new THREE.MeshStandardMaterial({map:chao.t,roughness:.12,metalness:.85}));o.rotation.x=-P/2;o.position.y=.012;RM.add(o)}

corona.position.set(0,3.5,-6.96);disco.position.set(0,3.5,-6.95);RM.add(corona,disco);
const NPO=450,pp=new Float32Array(NPO*3);for(let i=0;i<NPO;i++)pp.set([rn(-HW+.3,HW-.3),rn(.1,4.4),rn(-6.5,6.5)],i*3);

const clk=new THREE.Clock();

const f=(K.KeyW||K.ArrowUp?1:0)-(K.KeyS||K.ArrowDown?1:0),s=(K.KeyD||K.ArrowRight?1:0)-(K.KeyA||K.ArrowLeft?1:0),sp=2.6*dt;
if(sentado){pos.lerp(sentado,1-Math.exp(-3*dt));if(sitK>0&&yawAlvo!==undefined){sitK-=dt;yaw+=Math.atan2(Math.sin(yawAlvo-yaw),Math.cos(yawAlvo-yaw))*(1-Math.exp(-3*dt))}if(f||s)sentado=null}

{const c=MS.travado(),o=c?pickObj(innerWidth/2,innerHeight/2):((!drag&&mx>=0)?pickObj():null);
