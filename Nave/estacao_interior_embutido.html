<!doctype html><html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>Estação Nexus — Interior</title><style>html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#020508;color:#dce8e3;font-family:system-ui,sans-serif}canvas{position:fixed;inset:0;width:100%;height:100%;display:block}#hud{position:fixed;z-index:10;left:16px;top:16px;padding:10px 13px;border:1px solid #385044;background:#07100ddd;border-radius:8px;letter-spacing:.08em;font-size:12px;pointer-events:none}#hint{position:fixed;z-index:10;left:50%;bottom:18px;transform:translateX(-50%);padding:8px 12px;background:#07100dcc;border:1px solid #294437;border-radius:8px;font-size:11px;white-space:nowrap;pointer-events:none}#cross{position:fixed;z-index:10;left:50%;top:50%;width:12px;height:12px;transform:translate(-50%,-50%);pointer-events:none}#cross:before,#cross:after{content:"";position:absolute;background:#8df5c1}#cross:before{left:5px;top:0;width:2px;height:12px}#cross:after{left:0;top:5px;width:12px;height:2px}#panel{display:none;position:fixed;z-index:30;left:50%;top:50%;transform:translate(-50%,-50%);width:min(520px,88vw);padding:20px;background:#070d10f2;border:1px solid #526c60;border-radius:12px;box-shadow:0 20px 80px #000b;color:#e4eee9}.close{float:right;background:none;border:1px solid #526c60;color:#dce8e3;border-radius:6px;padding:4px 9px}.song{display:flex;justify-content:space-between;align-items:center;padding:12px 8px;border-top:1px solid #263a31}.song button{background:#10251b;color:#8df5c1;border:1px solid #3b7057;border-radius:6px;padding:7px 12px}#mobile{display:none;position:fixed;z-index:15;left:18px;bottom:22px;width:120px;height:120px;border:1px solid #456254;border-radius:50%;background:#07100d66}#stick{position:absolute;width:48px;height:48px;left:36px;top:36px;border-radius:50%;background:#8df5c133;border:1px solid #8df5c177}@media(max-width:700px){#mobile{display:block}#hint{bottom:8px;font-size:10px}}</style></head><body><canvas id="c"></canvas><div id="hud"><b>ESTAÇÃO NEXUS</b><br><span>INTERIOR · SALA DE COMANDO</span></div><div id="cross"></div><div id="hint">WASD + mouse · clique nos painéis · ESC libera o cursor</div><div id="mobile"><div id="stick"></div></div><div id="panel"></div><script src="three.min.js"></script>
<script>
(()=>{if(!window.THREE){document.body.innerHTML='<h2 style="padding:30px">three.min.js não encontrado. Coloque-o na mesma pasta.</h2>';return}const C=document.getElementById('c'),P=document.getElementById('panel'),mobile=innerWidth<700,R=new THREE.WebGLRenderer({canvas:C,antialias:!mobile,powerPreference:'high-performance'});R.setPixelRatio(Math.min(devicePixelRatio,mobile?1.5:2));R.setSize(innerWidth,innerHeight,false);R.shadowMap.enabled=true;const S=new THREE.Scene();S.background=new THREE.Color(0x020508);S.fog=new THREE.FogExp2(0x020508,.045);const cam=new THREE.PerspectiveCamera(72,innerWidth/innerHeight,.05,100);cam.position.set(0,1.65,4.5);S.add(new THREE.HemisphereLight(0x9ccbc0,0x020304,1.2));const L=new THREE.PointLight(0x8ab9aa,1.8,15);L.position.set(0,3.5,0);S.add(L);const GL=new THREE.PointLight(0x39ff8a,1.7,10);GL.position.set(-3,1.7,-2);S.add(GL);const G={h:new THREE.MeshStandardMaterial({color:0x151c21,roughness:.42,metalness:.9}),d:new THREE.MeshStandardMaterial({color:0x070a0d,roughness:.55,metalness:.82}),p:new THREE.MeshStandardMaterial({color:0x202a2d,roughness:.5,metalness:.8}),g:new THREE.MeshStandardMaterial({color:0x9b742e,roughness:.28,metalness:.9,emissive:0x302005,emissiveIntensity:.3}),e:new THREE.MeshStandardMaterial({color:0x38ff8a,roughness:.18,metalness:.4,emissive:0x13ff69,emissiveIntensity:2.4}),r:new THREE.MeshStandardMaterial({color:0xd72e42,roughness:.2,metalness:.45,emissive:0x8c1020,emissiveIntensity:1.8}),glass:new THREE.MeshStandardMaterial({color:0x173944,roughness:.08,metalness:.35,emissive:0x06171c,emissiveIntensity:.5,transparent:true,opacity:.82}),ghost:new THREE.MeshStandardMaterial({color:0x8be8ce,transparent:true,opacity:.24,emissive:0x46e0bc,emissiveIntensity:2})};
function box(a,m,p,r=[0,0,0]){let o=new THREE.Mesh(new THREE.BoxGeometry(...a),m);o.position.set(...p);o.rotation.set(...r);o.castShadow=o.receiveShadow=true;S.add(o);return o}function cyl(rad,dep,m,p,r=[0,0,0]){let o=new THREE.Mesh(new THREE.CylinderGeometry(rad,rad,dep,24),m);o.position.set(...p);o.rotation.set(...r);o.castShadow=o.receiveShadow=true;S.add(o);return o}function tor(rad,t,m,p,r=[0,0,0]){let o=new THREE.Mesh(new THREE.TorusGeometry(rad,t,10,32),m);o.position.set(...p);o.rotation.set(...r);S.add(o);return o}
// Casco interior
box([10,.25,10],G.d,[0,-.15,0]);box([10,4.2,.25],G.h,[0,2.05,-5]);box([.25,4.2,10],G.h,[-5,2.05,0]);box([.25,4.2,10],G.h,[5,2.05,0]);box([10,.25,10],G.h,[0,4.2,0]);
for(let z=-4;z<=4;z+=2){box([.18,3.8,.22],G.g,[-4.78,2.05,z]);box([.18,3.8,.22],G.g,[4.78,2.05,z])}for(let x=-4;x<=4;x+=2)box([.16,.18,9.4],G.g,[x,4.03,0]);box([3.6,.12,7.8],G.p,[0,-.01,.1]);for(let x of [-1.9,1.9])box([.08,.04,8.8],G.e,[x,.08,0]);
// Cockpit / proa
box([4.8,2.1,.22],G.d,[0,2.25,-4.72]);box([3.8,1.45,.1],G.glass,[0,2.35,-4.58],[-.05,0,0]);for(let x of [-1.4,0,1.4])box([.07,1.35,.07],G.g,[x,2.35,-4.49]);
// consoles + displays
function console(x,z){box([1.25,1.05,.65],G.p,[x,.72,z]);box([1,.48,.06],G.glass,[x,1.12,z-.34]);box([.75,.05,.04],G.e,[x,1.16,z-.38]);tor(.28,.035,G.g,[x,1.52,z-.3],[Math.PI/2,0,0])}console(-3.7,-1);console(3.7,-1);
// mapa e painel de músicas físicos
const map=box([2.25,1.55,.12],G.d,[-4.72,2.25,-1],[0,Math.PI/2,0]);box([1.85,1.2,.05],G.glass,[-4.62,2.25,-1],[0,Math.PI/2,0]);for(let i=0;i<7;i++)box([.06,.48,.03],i%2?G.g:G.e,[-4.55,2.0+i*.13,-1],[0,Math.PI/2,0]);map.userData.interactive='map';const music=box([2.35,1.75,.12],G.d,[4.72,2.25,-1],[0,Math.PI/2,0]);box([1.95,1.25,.05],G.glass,[4.62,2.25,-1],[0,Math.PI/2,0]);for(let i=0;i<5;i++)box([.07,.18,.03],G.e,[4.55,2.65-i*.27,-1],[0,Math.PI/2,0]);music.userData.interactive='music';
// Mesa e esferas
box([2.8,.22,2],G.g,[0,.72,.3]);box([2.45,.18,1.65],G.d,[0,.86,.3]);const orbs=[];for(const x of [-.72,0,.72])for(const z of [0,.62]){let s=new THREE.Mesh(new THREE.SphereGeometry(.22,20,16),G.g);s.position.set(x,1.05,z+.3);S.add(s);s.userData={orb:1,base:1.05,phase:Math.random()*6.28};orbs.push(s)}
// Nixie shelf
box([2.5,.12,.55],G.g,[-2.95,2.25,3.15]);box([2.65,1.35,.12],G.d,[-2.95,2.75,3.15]);for(let i=0;i<4;i++){cyl(.25,.16,G.glass,[-3.85+i*.6,2.75,3.05],[Math.PI/2,0,0]);box([.03,.55,.03],G.e,[-3.85+i*.6,2.75,2.94])}
// porta da popa
box([2.5,2.7,.18],G.d,[0,1.9,4.72]);box([1.75,2.2,.08],G.p,[0,1.9,4.57]);tor(1.05,.07,G.g,[0,1.9,4.48],[Math.PI/2,0,0]);
for(let z of [-4,-2,0,2,4])box([.5,.04,.08],G.e,[0,3.75,z]);
// Fantasmas
const ghosts=[];function ghost(x,z,ph){let g=new THREE.Group(),b=new THREE.Mesh(new THREE.SphereGeometry(.32,16,12),G.ghost),t=new THREE.Mesh(new THREE.ConeGeometry(.28,.65,12),G.ghost);b.scale.y=1.35;t.position.y=-.48;t.rotation.x=Math.PI;g.add(b,t);for(let ex of [-.09,.09]){let e=new THREE.Mesh(new THREE.SphereGeometry(.035,8,8),new THREE.MeshBasicMaterial({color:0xdffff3}));e.position.set(ex,.06,.29);g.add(e)}g.position.set(x,1.35,z);g.userData={x,z,ph};S.add(g);ghosts.push(g)}ghost(-3,.2,0);ghost(2.7,2,2.3);ghost(-1.7,-2.8,4.2);
// interação
const ray=new THREE.Raycaster(),N=new THREE.Vector2();function open(type){P.style.display='block';P.innerHTML=type==='music'?'<button class="close">FECHAR</button><h2>♪ CANÇÕES APRENDIDAS</h2><div class="song"><span>Canção da Tempestade<br><small>● ▲ ▼ ◆</small></span><button id="play">TOCAR</button></div><div class="song"><span>Canção aprendida</span><button>TOCAR</button></div>':'<button class="close">FECHAR</button><h2>✦ MAPA DE VALTHERIS</h2><p>O mapa atual será aberto aqui usando o mapa-nexus.js do projeto.</p>';P.querySelector('.close').onclick=()=>P.style.display='none';if(type==='music')P.querySelector('#play').onclick=play}function play(){let A=new(window.AudioContext||window.webkitAudioContext)(),q=[440,523,659,523,440,392,523,659],i=0;function n(){if(i>=q.length){A.close();return}let o=A.createOscillator(),g=A.createGain();o.frequency.value=q[i++];g.gain.setValueAtTime(.0001,A.currentTime);g.gain.exponentialRampToValueAtTime(.13,A.currentTime+.02);g.gain.exponentialRampToValueAtTime(.0001,A.currentTime+.28);o.connect(g).connect(A.destination);o.start();o.stop(A.currentTime+.3);setTimeout(n,300)}n()}
let yaw=0,pitch=0,locked=false;const keys={};addEventListener('keydown',e=>keys[e.code]=true);addEventListener('keyup',e=>keys[e.code]=false);C.onclick=e=>{if(P.style.display==='block')return;N.x=e.clientX/innerWidth*2-1;N.y=-(e.clientY/innerHeight)*2+1;ray.setFromCamera(N,cam);let h=ray.intersectObjects([map,music],true);if(h.length){open(h[0].object.userData.interactive);return}if(!mobile)C.requestPointerLock?.()};document.addEventListener('pointerlockchange',()=>locked=document.pointerLockElement===C);document.addEventListener('mousemove',e=>{if(!locked)return;yaw-=e.movementX*.0025;pitch-=e.movementY*.0022;pitch=Math.max(-1,Math.min(1,pitch))});
let joy={x:0,y:0};if(mobile){let area=document.getElementById('mobile'),stick=document.getElementById('stick'),down=false;area.ontouchstart=e=>{down=true;e.preventDefault()};area.ontouchmove=e=>{if(!down)return;let r=area.getBoundingClientRect(),t=e.touches[0];joy.x=Math.max(-1,Math.min(1,(t.clientX-(r.left+60))/45));joy.y=Math.max(-1,Math.min(1,(t.clientY-(r.top+60))/45));stick.style.transform=`translate(${joy.x*30}px,${joy.y*30}px)`;e.preventDefault()};area.ontouchend=()=>{down=false;joy.x=joy.y=0;stick.style.transform=''};C.ontouchmove=e=>{if(e.touches.length===1&&e.target===C){yaw-=e.touches[0].clientX/innerWidth*.0}}}
let last=performance.now();function loop(t){requestAnimationFrame(loop);let dt=Math.min(.05,(t-last)/1000);last=t;let fx=(keys.KeyD?1:0)-(keys.KeyA?1:0),fz=(keys.KeyS?1:0)-(keys.KeyW?1:0);if(mobile){fx=joy.x;fz=joy.y}let f=new THREE.Vector3(Math.sin(yaw),0,Math.cos(yaw)),r=new THREE.Vector3(Math.cos(yaw),0,-Math.sin(yaw));cam.position.addScaledVector(r,fx*2.5*dt);cam.position.addScaledVector(f,fz*2.5*dt);cam.position.x=Math.max(-4.15,Math.min(4.15,cam.position.x));cam.position.z=Math.max(-4.15,Math.min(4.15,cam.position.z));cam.position.y=1.65;cam.rotation.order='YXZ';cam.rotation.y=yaw;cam.rotation.x=pitch;orbs.forEach(o=>{o.position.y=o.userData.base+Math.sin(t*.002*2+o.userData.phase)*.07;o.scale.setScalar(.92+Math.sin(t*.0025+o.userData.phase)*.08)});ghosts.forEach(g=>{g.position.x=g.userData.x+Math.sin(t*.00025+g.userData.ph)*1.15;g.position.z=g.userData.z+Math.cos(t*.00021+g.userData.ph)*.9;g.position.y=1.35+Math.sin(t*.0008+g.userData.ph)*.12});GL.intensity=1.5+Math.sin(t*.0022)*.35;R.render(S,cam)}requestAnimationFrame(loop);addEventListener('resize',()=>{R.setSize(innerWidth,innerHeight,false);cam.aspect=innerWidth/innerHeight;cam.updateProjectionMatrix()})})();</script></body></html>
