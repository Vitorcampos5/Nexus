<svg viewBox="0 0 64 64" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bladeGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#f4e2bb"/>
      <stop offset="45%" stop-color="#d9ab5f"/>
      <stop offset="100%" stop-color="#8a6529"/>
    </linearGradient>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#111019"/>
      <stop offset="100%" stop-color="#090814"/>
    </linearGradient>
  </defs>

  <rect width="64" height="64" rx="12" fill="url(#bgGrad)"/>
  <rect x="0.75" y="0.75" width="62.5" height="62.5" rx="11.5" fill="none" stroke="#b8873e" stroke-width="0.6" opacity="0.35"/>

  <!-- ponta da lâmina / haste da pena -->
  <path d="M 32 7
           C 33.6 12, 34.4 17, 33 22
           L 32 25
           L 31 22
           C 29.6 17, 30.4 12, 32 7 Z"
        fill="url(#bladeGrad)"/>

  <!-- barbas da pena, decrescendo -->
  <path d="M 32 11 C 27 12.5, 24.5 15, 23.5 18.5" stroke="url(#bladeGrad)" stroke-width="1" fill="none" stroke-linecap="round" opacity="0.9"/>
  <path d="M 32 11 C 37 12.5, 39.5 15, 40.5 18.5" stroke="url(#bladeGrad)" stroke-width="1" fill="none" stroke-linecap="round" opacity="0.9"/>
  <path d="M 32 15.5 C 28.2 16.6, 26.3 18.6, 25.5 21.4" stroke="url(#bladeGrad)" stroke-width="0.85" fill="none" stroke-linecap="round" opacity="0.75"/>
  <path d="M 32 15.5 C 35.8 16.6, 37.7 18.6, 38.5 21.4" stroke="url(#bladeGrad)" stroke-width="0.85" fill="none" stroke-linecap="round" opacity="0.75"/>
  <path d="M 32 20 C 29.4 20.8, 28 22.2, 27.4 24.2" stroke="url(#bladeGrad)" stroke-width="0.7" fill="none" stroke-linecap="round" opacity="0.6"/>
  <path d="M 32 20 C 34.6 20.8, 36 22.2, 36.6 24.2" stroke="url(#bladeGrad)" stroke-width="0.7" fill="none" stroke-linecap="round" opacity="0.6"/>

  <!-- lâmina -->
  <path d="M 32 25 L 35 29 L 34 42 L 32 45 L 30 42 L 29 29 Z"
        fill="url(#bladeGrad)"/>
  <line x1="32" y1="27" x2="32" y2="42" stroke="#5c3d16" stroke-width="0.5" opacity="0.55"/>

  <!-- guarda -->
  <path d="M 21 45 C 25 43.3, 28.5 43, 32 44 C 35.5 43, 39 43.3, 43 45
           C 39.5 46.6, 35.8 47.2, 32 46.4 C 28.2 47.2, 24.5 46.6, 21 45 Z"
        fill="url(#bladeGrad)"/>

  <!-- cabo, com enrolado -->
  <rect x="29.4" y="47" width="5.2" height="8.5" rx="1.6" fill="url(#bladeGrad)"/>
  <line x1="29.4" y1="49.2" x2="34.6" y2="49.2" stroke="#5c3d16" stroke-width="0.5" opacity="0.6"/>
  <line x1="29.4" y1="51.4" x2="34.6" y2="51.4" stroke="#5c3d16" stroke-width="0.5" opacity="0.6"/>
  <line x1="29.4" y1="53.6" x2="34.6" y2="53.6" stroke="#5c3d16" stroke-width="0.5" opacity="0.6"/>

  <!-- bico da pena / pomo, com fenda de tinta -->
  <path d="M 29.4 55.5 L 34.6 55.5 L 32 60.5 Z" fill="url(#bladeGrad)"/>
  <line x1="32" y1="55.5" x2="32" y2="59.6" stroke="#5c3d16" stroke-width="0.55" opacity="0.75"/>
</svg>
