<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64">
  <defs>
    <linearGradient id="bgGradFS" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#101613"/>
      <stop offset="100%" stop-color="#0A0E0D"/>
    </linearGradient>
    <linearGradient id="clapGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#8FCBB0"/>
      <stop offset="100%" stop-color="#5FA88A"/>
    </linearGradient>
  </defs>

  <rect width="64" height="64" rx="12" fill="url(#bgGradFS)"/>
  <rect x="0.75" y="0.75" width="62.5" height="62.5" rx="11.5" fill="none" stroke="#5FA88A" stroke-width="0.6" opacity="0.35"/>

  <!-- corpo da claquete -->
  <rect x="13" y="26" width="38" height="24" rx="2.5" fill="url(#clapGrad)" opacity="0.16" stroke="#8FCBB0" stroke-width="0.8"/>

  <!-- tampa superior da claquete, levemente aberta -->
  <path d="M 12.5 26 L 15 17 L 51.5 21 L 50 27 Z" fill="url(#clapGrad)" opacity="0.85" stroke="#8FCBB0" stroke-width="0.6"/>

  <!-- listras diagonais da claquete -->
  <path d="M 20 17.9 L 17 26.6" stroke="#0A0E0D" stroke-width="2.4" opacity="0.55"/>
  <path d="M 28 18.8 L 25 27.5" stroke="#0A0E0D" stroke-width="2.4" opacity="0.55"/>
  <path d="M 36 19.7 L 33 28.4" stroke="#0A0E0D" stroke-width="2.4" opacity="0.55"/>
  <path d="M 44 20.6 L 41 29.3" stroke="#0A0E0D" stroke-width="2.4" opacity="0.55"/>

  <!-- linha divisoria entre tampa e corpo -->
  <line x1="13" y1="26.4" x2="51" y2="26.4" stroke="#0A0E0D" stroke-width="0.6" opacity="0.4"/>

  <!-- brilho sutil -->
  <path d="M 15 17 L 51.5 21" fill="none" stroke="#FFFFFF" stroke-width="0.6" opacity="0.35"/>
</svg>
