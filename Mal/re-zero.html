<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="description" content="Página dedicada a Re:Zero kara Hajimeru Isekai Seikatsu — Nexus.">
<title>Re:Zero — Nexus</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@400&family=Cinzel+Decorative:wght@700&family=EB+Garamond:ital,wght@0,400;1,400&family=Share+Tech+Mono&display=swap" rel="stylesheet">
<style>
  :root{
    --bg:#0A0E0D;
    --bg2:#0F1613;
    --panel:#121A16;
    --panel-line: rgba(95,168,138,0.16);
    --accent:#5FA88A;
    --accent-soft: rgba(95,168,138,0.14);
    --accent-dim: rgba(95,168,138,0.42);
    --text:#E7E7DE;
    --dim: rgba(231,231,222,0.52);
    --dimmer: rgba(231,231,222,0.28);
  }

  *{ margin:0; padding:0; box-sizing:border-box; }

  html,body{
    background:
      linear-gradient(180deg, rgba(10,14,13,.55) 0%, rgba(10,14,13,.8) 45%, var(--bg) 85%),
      url('animes-bg.jpg');
    background-attachment: fixed;
    background-position: center top;
    background-repeat: no-repeat;
    color:var(--text);
    min-height:100vh;
    font-family:'EB Garamond', Georgia, serif;
  }

  body{ padding-bottom:6rem; }

  .nexus-return{
    display:inline-block; position:absolute; top:0; left:0; z-index:10;
    font-family:'Cinzel',serif; font-size:.58rem; letter-spacing:.28em; text-transform:uppercase;
    text-decoration:none; color:var(--dim); padding:1rem 1.2rem; background:transparent; backdrop-filter:blur(6px);
  }
  .nexus-return:hover{ color:var(--accent); }

  .anime-return{
    display:inline-block; position:absolute; top:0; right:0; z-index:10;
    font-family:'Cinzel',serif; font-size:.58rem; letter-spacing:.28em; text-transform:uppercase;
    text-decoration:none; color:var(--dim); padding:1rem 1.2rem; background:transparent; backdrop-filter:blur(6px);
  }
  .anime-return:hover{ color:var(--accent); }

  .wrap{ max-width:900px; margin:0 auto; padding:5rem 1.5rem 0; }

  .hero{ text-align:center; margin-bottom:2.4rem; }
  .hero-eyebrow{
    font-family:'Cinzel',serif; font-size:.66rem; letter-spacing:.32em; text-transform:uppercase;
    color:var(--accent-dim); margin-bottom:.9rem;
  }
  .hero h1{
    font-family:'Cinzel Decorative', serif; font-weight:700;
    font-size:clamp(2.1rem, 6vw, 3.2rem); letter-spacing:.05em; color:var(--text);
    text-shadow:0 0 40px rgba(95,168,138,.18);
  }
  .hero-tagline{ font-style:italic; color:var(--dim); font-size:1.02rem; margin-top:.7rem; }

  .panel{
    background:linear-gradient(180deg, var(--panel), var(--bg2));
    border:1px solid var(--panel-line); border-radius:4px;
    padding:1.6rem; margin-top:2.6rem;
  }
  .panel-title{
    font-family:'Cinzel',serif; font-size:.7rem; letter-spacing:.2em; text-transform:uppercase;
    color:var(--accent-dim); margin-bottom:1rem; text-align:center;
  }

  .video-container{
    position:relative; width:100%; aspect-ratio:16/9;
    background:#000; border-radius:3px; overflow:hidden;
    border:1px solid var(--panel-line);
  }
  .video-container iframe{
    position:absolute; top:0; left:0; width:100%; height:100%; border:0;
  }

  footer{
    margin-top:5rem; text-align:center; font-family:'Cinzel',serif; font-size:.68rem;
    letter-spacing:.14em; color:var(--dimmer); text-transform:uppercase;
  }

  @media (max-width: 560px){
    .wrap{ padding:4.2rem 1.1rem 0; }
    .panel{ padding:1.1rem; margin-top:2rem; }
  }

  @media (max-width: 400px){
    .wrap{ padding:3.8rem .9rem 0; }
    .panel{ padding:.9rem; }
    .hero-tagline{ font-size:.92rem; }
  }
</style>
</head>
<body>
<!-- avisa o mapa do Nexus (se estiver por perto) que esta página foi visitada -->
<script>try{ if (window.top !== window) window.top.postMessage({ tipo:'nexus-visita', id:'mal_animes_rezero' }, '*'); }catch(e){}</script>

<a class="nexus-return" href="../nexus.html">◆ Nexus</a>
<a class="anime-return" href="animes.html">◆ Animes</a>

<div class="wrap">

  <header class="hero">
    <div class="hero-eyebrow">Página dedicada</div>
    <h1>Re:Zero</h1>
    <p class="hero-tagline">kara Hajimeru Isekai Seikatsu — Starting Life in Another World</p>
  </header>

  <section class="panel">
    <div class="panel-title">Vídeo</div>
    <div class="video-container">
      <iframe id="driveVideo" allow="autoplay; fullscreen" allowfullscreen loading="lazy"></iframe>
    </div>
  </section>

</div>

<footer>◆ &nbsp; Re:Zero — Nexus &nbsp; ◆</footer>

<script>
(function(){
  // Cole aqui o link de compartilhamento (Google Drive ou Mega, os dois funcionam).
  // Drive precisa estar com acesso "Qualquer pessoa com o link".
  const VIDEO_LINK = "https://mega.nz/file/LFoGSARK#kWlNv9hHt1VHGwW2maVu9liKsrkRvAeufknvn8sVREo";

  function linkToEmbed(link){
    // Google Drive: .../file/d/ID/view?...resourcekey=KEY
    let m = link.match(/drive\.google\.com\/file\/d\/([^/]+)/);
    if(m){
      const keyMatch = link.match(/resourcekey=([^&]+)/);
      let embed = 'https://drive.google.com/file/d/' + m[1] + '/preview';
      if(keyMatch) embed += '?resourcekey=' + keyMatch[1];
      return embed;
    }
    // Mega: .../file/ID#KEY
    m = link.match(/mega\.nz\/file\/([^#]+)#(.+)/);
    if(m){
      return 'https://mega.nz/embed/' + m[1] + '#' + m[2];
    }
    return null;
  }

  const embedUrl = linkToEmbed(VIDEO_LINK);
  const iframe = document.getElementById('driveVideo');
  if(embedUrl){
    iframe.src = embedUrl;
  }
})();
</script>

</body>
</html>
