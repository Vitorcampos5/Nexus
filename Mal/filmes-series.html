<style>
  :root{
    --bg:#0A0E0D;
    --bg2:#0F1613;
    --panel:#121A16;
    --panel-line: rgba(95,168,138,0.16);
    --accent:#5FA88A;
    --accent-soft: rgba(95,168,138,0.14);
    --accent-dim: rgba(95,168,138,0.42);
    --text:#E7E7DE;
    --dim: rgba(231,231,222,0.52);
    --dimmer: rgba(231,231,222,0.28);
  }

  *{ margin:0; padding:0; box-sizing:border-box; }

  html,body{
    background:
      radial-gradient(ellipse 70% 40% at 50% -10%, rgba(95,168,138,0.08), transparent 60%),
      var(--bg);
    color:var(--text);
    min-height:100vh;
    font-family:'EB Garamond', Georgia, serif;
  }

  body{ padding-bottom:6rem; }

  .nexus-return{
    display:inline-block; position:absolute; top:0; left:0; z-index:10;
    font-family:'Cinzel',serif; font-size:.58rem; letter-spacing:.28em; text-transform:uppercase;
    text-decoration:none; color:var(--dim); padding:1rem 1.2rem; background:transparent; backdrop-filter:blur(6px);
  }
  .nexus-return:hover{ color:var(--accent); }

  .mal-return{
    display:inline-block; position:absolute; top:0; right:0; z-index:10;
    font-family:'Cinzel',serif; font-size:.58rem; letter-spacing:.28em; text-transform:uppercase;
    text-decoration:none; color:var(--dim); padding:1rem 1.2rem; background:transparent; backdrop-filter:blur(6px);
  }
  .mal-return:hover{ color:var(--accent); }

  .wrap{ max-width:1180px; margin:0 auto; padding:5rem 1.5rem 0; }

  .hero{ text-align:center; margin-bottom:2.4rem; }
  .hero-eyebrow{
    font-family:'Cinzel',serif; font-size:.66rem; letter-spacing:.32em; text-transform:uppercase;
    color:var(--accent-dim); margin-bottom:.9rem;
  }
  .hero h1{
    font-family:'Cinzel Decorative', serif; font-weight:700;
    font-size:clamp(2.1rem, 6vw, 3.1rem); letter-spacing:.05em; color:var(--text);
    text-shadow:0 0 40px rgba(95,168,138,.18);
  }
  .hero-tagline{ font-style:italic; color:var(--dim); font-size:1.02rem; margin-top:.7rem; }

  .ledger-mini{
    display:flex; flex-wrap:wrap; justify-content:center; gap:1.6rem;
    margin:1.8rem auto 0; max-width:760px; font-family:'Share Tech Mono', monospace;
    font-size:.8rem; color:var(--dim);
    border-top:1px solid var(--panel-line); border-bottom:1px solid var(--panel-line);
    padding:1rem 0;
  }
  .ledger-mini span b{ color:var(--accent); font-weight:400; }

  .controls{
    display:flex; flex-wrap:wrap; align-items:center; gap:.9rem;
    margin:2.8rem 0 .6rem;
  }
  .search-input{
    flex:1 1 220px; background:var(--panel); border:1px solid var(--panel-line); border-radius:3px;
    padding:.65rem .9rem; color:var(--text); font-family:'EB Garamond', serif; font-size:1rem;
  }
  .search-input::placeholder{ color:var(--dimmer); }
  .search-input:focus{ outline:none; border-color:var(--accent-dim); }

  .filters{ display:flex; flex-wrap:wrap; gap:.5rem; }
  .filter-pill{
    font-family:'Cinzel',serif; font-size:.62rem; letter-spacing:.1em; text-transform:uppercase;
    color:var(--dim); background:transparent; border:1px solid var(--panel-line); border-radius:20px;
    padding:.45rem .9rem; cursor:pointer; transition:color .2s ease, border-color .2s ease, background .2s ease;
  }
  .filter-pill:hover{ color:var(--text); border-color:var(--accent-dim); }
  .filter-pill.active{ color:var(--bg); background:var(--accent); border-color:var(--accent); }
  .filter-pill:focus-visible{ outline:2px solid var(--accent); outline-offset:2px; }

  .filter-divider{ width:1px; align-self:stretch; background:var(--panel-line); margin:0 .2rem; }

  .result-count{
    font-family:'Share Tech Mono', monospace; font-size:.72rem; color:var(--dimmer);
    width:100%; margin-top:.2rem;
  }

  .grid{
    display:grid; grid-template-columns:repeat(auto-fill, minmax(190px, 1fr));
    gap:1.2rem; margin-top:1.6rem;
  }

  .card{
    position:relative; background:linear-gradient(180deg, var(--panel), var(--bg2));
    border:1px solid var(--panel-line); border-left:3px solid var(--accent-dim);
    border-radius:3px; overflow:hidden; display:flex; flex-direction:column;
    transition:border-color .3s ease, transform .2s ease;
  }
  .card:hover{ transform:translateY(-2px); border-color:var(--accent-dim); }
  .card.st-completed{ border-left-color:var(--accent); }
  .card.st-plan{ border-left:3px solid var(--panel-line); }

  .card-cover{
    width:100%; aspect-ratio:192/272; background:var(--bg2); overflow:hidden;
    display:flex; align-items:center; justify-content:center;
  }
  .card-cover img{ width:100%; height:100%; object-fit:contain; display:block; }
  .card-cover.placeholder{
    font-family:'Cinzel Decorative', serif; font-size:2.6rem; color:var(--panel-line);
  }

  .card-type{
    position:absolute; top:.6rem; left:.6rem;
    font-family:'Cinzel',serif; font-size:.5rem; letter-spacing:.08em; text-transform:uppercase;
    padding:.26rem .5rem; border-radius:12px; background:rgba(10,14,13,.78); backdrop-filter:blur(3px);
    color:var(--accent-dim);
  }
  .card-status{
    position:absolute; top:.6rem; right:.6rem;
    font-family:'Cinzel',serif; font-size:.52rem; letter-spacing:.08em; text-transform:uppercase;
    padding:.28rem .55rem; border-radius:12px; background:rgba(10,14,13,.78); backdrop-filter:blur(3px);
    color:var(--dim);
  }
  .card.st-watching .card-status, .card.st-completed .card-status{ color:var(--accent); }

  .card-body{ padding:.8rem .9rem 1rem; display:flex; flex-direction:column; flex:1; }
  .card-title{
    font-family:'Cinzel Decorative', serif; font-weight:700; font-size:.9rem;
    line-height:1.35; color:var(--text);
  }
  .card-progress{
    font-family:'Share Tech Mono', monospace; font-size:.7rem; color:var(--accent);
    margin-top:.5rem;
  }
  .card-progress.none{ color:var(--dimmer); }

  .empty-state{
    text-align:center; padding:3.5rem 1rem; color:var(--dimmer); font-style:italic; grid-column:1/-1;
  }

  footer{
    margin-top:5rem; text-align:center; font-family:'Cinzel',serif; font-size:.68rem;
    letter-spacing:.14em; color:var(--dimmer); text-transform:uppercase;
  }

  @media (max-width: 560px){
    .wrap{ padding-top:4.2rem; }
  }
</style>
</head>

  const grid = document.getElementById('grid');
  const searchInput = document.getElementById('searchInput');
  const resultCount = document.getElementById('resultCount');

  function escapeHtml(s){
    const d = document.createElement('div');
    d.textContent = s == null ? '' : String(s);
    return d.innerHTML;
  }

  function initial(title){
    return title.trim().charAt(0).toUpperCase();
  }

  function slug(title){
    return title.toLowerCase()
      .replace(/['’]/g, '')
      .replace(/[^\p{L}\p{N}_\s-]/gu, '')
      .trim()
      .replace(/\s+/g, '-');
  }

  window.handleImgError = function(img){
    const cover = img.parentElement;
    cover.classList.add('placeholder');
    cover.textContent = cover.dataset.initial || '';
  };

  function matchesFilters(item){
    if(currentType !== 'all' && item.ty !== currentType) return false;
    if(currentStatus !== 'all' && item.s !== currentStatus) return false;
    if(currentSearch && !item.t.toLowerCase().includes(currentSearch.toLowerCase())) return false;
    return true;
  }

  function progressHtml(item){
    if(item.ty === 'serie'){
      if(item.seasonAtual){
        const total = item.seasons ? (' de ' + item.seasons) : '';
        return '<div class="card-progress">temporada ' + escapeHtml(item.seasonAtual) + escapeHtml(total) + '</div>';
      }
      if(item.seasons || item.ep){
        const parts = [];
        if(item.seasons) parts.push(item.seasons + (item.seasons > 1 ? ' temporadas' : ' temporada'));
        if(item.ep) parts.push(item.ep + ' ep.');
        return '<div class="card-progress">' + escapeHtml(parts.join(' · ')) + '</div>';
      }
      return '<div class="card-progress none">sem progresso</div>';
    }
    return '<div class="card-progress none">' + (item.s === 'completed' ? 'assistido' : '&nbsp;') + '</div>';
  }

  function cardHtml(item){
    const initialLetter = escapeHtml(initial(item.t));
    const coverHtml = '<div class="card-cover" data-initial="' + initialLetter + '">' +
      '<img src="capas-filmes-series/' + slug(item.t) + '.jpg" alt="" loading="lazy" onerror="handleImgError(this)">' +
    '</div>';

    return (
      '<article class="card st-' + item.s + '">' +
        coverHtml +
        '<div class="card-type">' + TYPE_LABELS[item.ty] + '</div>' +
        '<div class="card-status">' + STATUS_LABELS[item.s] + '</div>' +
        '<div class="card-body">' +
          '<div class="card-title">' + escapeHtml(item.t) + '</div>' +
          progressHtml(item) +
        '</div>' +
      '</article>'
    );
  }

  function render(){
    const filtered = DATA.filter(matchesFilters);
    filtered.sort((a, b) => a.t.localeCompare(b.t));

    if(filtered.length === 0){
      grid.innerHTML = '<p class="empty-state">Nada encontrado por aqui.</p>';
    } else {
      grid.innerHTML = filtered.map(cardHtml).join('');
    }
    resultCount.textContent = filtered.length + ' de ' + DATA.length;
  }

  searchInput.addEventListener('input', (e) => {
    currentSearch = e.target.value;
    render();
  });

  document.querySelectorAll('#filtersType .filter-pill').forEach((pill) => {
    pill.addEventListener('click', () => {
      document.querySelectorAll('#filtersType .filter-pill').forEach((p) => p.classList.remove('active'));
      pill.classList.add('active');
      currentType = pill.dataset.type;
      render();
    });
  });

  document.querySelectorAll('#filtersStatus .filter-pill').forEach((pill) => {
    pill.addEventListener('click', () => {
      document.querySelectorAll('#filtersStatus .filter-pill').forEach((p) => p.classList.remove('active'));
      pill.classList.add('active');
      currentStatus = pill.dataset.status;
      render();
    });
  });

  const filmes = DATA.filter(d => d.ty === 'filme').length;
  const series = DATA.filter(d => d.ty === 'serie').length;
  document.getElementById('ledgerMini').innerHTML =
    '<span>Total <b>' + DATA.length + '</b></span>' +
    '<span>Filmes <b>' + filmes + '</b></span>' +
    '<span>Séries <b>' + series + '</b></span>';

  render();
})();
</script>

</body>
</html>
