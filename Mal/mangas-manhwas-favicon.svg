<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64">
  <defs>
    <linearGradient id="bgGradW" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#101613"/>
      <stop offset="100%" stop-color="#0A0E0D"/>
    </linearGradient>
    <linearGradient id="scrollGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#5FA88A"/>
      <stop offset="100%" stop-color="#8FCBB0"/>
    </linearGradient>
  </defs>

  <rect width="64" height="64" rx="12" fill="url(#bgGradW)"/>
  <rect x="0.75" y="0.75" width="62.5" height="62.5" rx="11.5" fill="none" stroke="#5FA88A" stroke-width="0.6" opacity="0.35"/>

  <!-- rolo de leitura vertical (webtoon scroll) -->
  <rect x="21" y="10" width="22" height="44" rx="4" fill="url(#scrollGrad)" opacity="0.14"/>
  <rect x="21" y="10" width="22" height="44" rx="4" fill="none" stroke="#8FCBB0" stroke-width="0.8" opacity="0.6"/>

  <!-- linhas de painel, sugerindo quadros de leitura -->
  <line x1="24.5" y1="18" x2="39.5" y2="18" stroke="#8FCBB0" stroke-width="0.8" opacity="0.55"/>
  <line x1="24.5" y1="26" x2="39.5" y2="26" stroke="#8FCBB0" stroke-width="0.8" opacity="0.45"/>
  <line x1="24.5" y1="34" x2="35" y2="34" stroke="#8FCBB0" stroke-width="0.8" opacity="0.45"/>
  <line x1="24.5" y1="42" x2="39.5" y2="42" stroke="#8FCBB0" stroke-width="0.8" opacity="0.35"/>

  <!-- rolinhos nas pontas, dando a ideia de scroll -->
  <ellipse cx="32" cy="9" rx="12.5" ry="2.6" fill="#5FA88A" opacity="0.85"/>
  <ellipse cx="32" cy="55" rx="12.5" ry="2.6" fill="#5FA88A" opacity="0.85"/>
</svg>
