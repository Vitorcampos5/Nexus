<style>
  :root{
    --bg:#0A0E0D;
    --bg2:#0F1613;
    --panel:#121A16;
    --panel-line: rgba(95,168,138,0.16);
    --accent:#5FA88A;
    --accent-soft: rgba(95,168,138,0.14);
    --accent-dim: rgba(95,168,138,0.42);
    --text:#E7E7DE;
    --dim: rgba(231,231,222,0.52);
    --dimmer: rgba(231,231,222,0.28);
  }

  *{ margin:0; padding:0; box-sizing:border-box; }

  html,body{
    background:
      radial-gradient(ellipse 70% 40% at 50% -10%, rgba(95,168,138,0.08), transparent 60%),
      var(--bg);
    color:var(--text);
    min-height:100vh;
    font-family:'EB Garamond', Georgia, serif;
  }

  body{ padding-bottom:5rem; }

  .nexus-return{
    display:inline-block; position:absolute; top:0; left:0; z-index:10;
    font-family:'Cinzel',serif; font-size:.58rem; letter-spacing:.28em; text-transform:uppercase;
    text-decoration:none; color:var(--dim); padding:1rem 1.2rem; background:transparent; backdrop-filter:blur(6px);
  }
  .nexus-return:hover{ color:var(--accent); }

  .wrap{ max-width:1100px; margin:0 auto; padding:5rem 1.5rem 0; }

  /* ===== Hero ===== */
  .hero{ display:flex; flex-direction:column; align-items:center; text-align:center; }
  .avatar{
    width:104px; height:104px; border-radius:50%; overflow:hidden;
    border:1px solid var(--accent-dim); box-shadow:0 0 40px rgba(95,168,138,.15);
    margin-bottom:1.2rem;
  }
  .avatar img{ width:100%; height:100%; object-fit:cover; display:block; }

  .hero-eyebrow{
    font-family:'Cinzel',serif; font-size:.62rem; letter-spacing:.32em; text-transform:uppercase;
    color:var(--accent-dim); margin-bottom:.7rem;
  }
  .hero h1{
    font-family:'Cinzel Decorative', serif; font-weight:700;
    font-size:clamp(2.2rem, 6vw, 3.2rem); letter-spacing:.05em; color:var(--text);
    text-shadow:0 0 40px rgba(95,168,138,.18);
  }
  .hero-tagline{ font-style:italic; color:var(--dim); font-size:1rem; margin-top:.6rem; }

  .about-block{
    display:flex; flex-direction:column; gap:.9rem; margin:2.6rem auto 0; max-width:900px;
  }
  .about-block img{
    width:100%; height:auto; display:block; border-radius:4px;
    border:1px solid var(--panel-line);
  }

  /* ===== Ledger ===== */
  .ledger{
    display:flex; flex-wrap:wrap; justify-content:center;
    margin:2.4rem auto 0; max-width:820px;
    border-top:1px solid var(--panel-line); border-bottom:1px solid var(--panel-line);
  }
  .ledger-stat{ flex:1 1 110px; text-align:center; padding:1rem .6rem; border-left:1px solid var(--panel-line); }
  .ledger-stat:first-child{ border-left:none; }
  .ledger-value{ font-family:'Share Tech Mono', monospace; font-size:1.35rem; color:var(--accent); }
  .ledger-label{ font-family:'Cinzel',serif; font-size:.56rem; letter-spacing:.14em; text-transform:uppercase; color:var(--dimmer); margin-top:.3rem; }

  .ledger-mini{
    display:flex; flex-wrap:wrap; justify-content:center; gap:1.6rem;
    margin:1.3rem auto 0; max-width:820px; font-family:'Share Tech Mono', monospace;
    font-size:.74rem; color:var(--dim);
  }
  .ledger-mini span b{ color:var(--accent); font-weight:400; }

  .btn-group{ display:flex; flex-wrap:wrap; justify-content:center; gap:.7rem; margin:1.8rem auto 0; }
  .btn-fulllist{
    display:inline-block; width:fit-content;
    font-family:'Cinzel',serif; font-size:.68rem; letter-spacing:.16em; text-transform:uppercase;
    color:var(--bg); background:var(--accent); border:1px solid var(--accent);
    padding:.75rem 1.6rem; border-radius:20px; text-decoration:none;
    transition:background .2s ease, color .2s ease, transform .15s ease;
  }
  .btn-fulllist:hover{ background:transparent; color:var(--accent); }
  .btn-fulllist:active{ transform:scale(.97); }

  .section-divider{
    display:flex; align-items:center; gap:1rem; margin:3.6rem 0 1.4rem; color:var(--accent-dim);
  }
  .section-divider .rule{ flex:1; height:1px; background:linear-gradient(90deg, transparent, var(--panel-line)); }
  .section-divider .rule.right{ background:linear-gradient(90deg, var(--panel-line), transparent); }
  .section-title{
    font-family:'Cinzel',serif; font-size:.72rem; letter-spacing:.24em; text-transform:uppercase; color:var(--dim);
    white-space:nowrap;
  }
  .section-note{ font-size:.78rem; color:var(--dimmer); font-style:italic; margin:-.8rem 0 1.2rem; }

  /* ===== Shelves (favoritos com imagem) ===== */
  .shelf{
    display:flex; gap:1rem; overflow-x:auto; padding-bottom:.8rem; scroll-snap-type:x proximity;
  }
  .shelf::-webkit-scrollbar{ height:6px; }
  .shelf::-webkit-scrollbar-thumb{ background:var(--panel-line); border-radius:4px; }

  .fav-card{
    flex:0 0 auto; width:130px; scroll-snap-align:start;
    background:linear-gradient(180deg, var(--panel), var(--bg2));
    border:1px solid var(--panel-line); border-left:3px solid var(--accent-dim); border-radius:3px;
    overflow:hidden; text-decoration:none; color:var(--text); display:block;
    transition:border-color .25s ease, transform .2s ease;
  }
  .fav-card:hover{ border-color:var(--accent-dim); transform:translateY(-2px); }
  .fav-cover{ width:100%; aspect-ratio:140/220; background:var(--bg2); }
  .fav-cover img{ width:100%; height:100%; object-fit:cover; display:block; }
  .fav-body{ padding:.55rem .6rem .7rem; }
  .fav-title{ font-family:'Cinzel Decorative', serif; font-weight:700; font-size:.72rem; line-height:1.35; }
  .fav-meta{ font-family:'Cinzel',serif; font-size:.5rem; letter-spacing:.05em; text-transform:uppercase; color:var(--dimmer); margin-top:.35rem; }

  /* ===== Atividade recente ===== */
  .recent-list{ display:flex; flex-direction:column; gap:.7rem; }
  .recent-row{
    display:flex; align-items:center; gap:.9rem;
    background:linear-gradient(180deg, var(--panel), var(--bg2));
    border:1px solid var(--panel-line); border-radius:3px; padding:.6rem .9rem;
  }
  .recent-cover{ width:34px; height:48px; flex:0 0 auto; background:var(--bg2); border-radius:2px; overflow:hidden; }
  .recent-cover img{ width:100%; height:100%; object-fit:cover; display:block; }
  .recent-info{ flex:1; min-width:0; }
  .recent-title{ font-size:.88rem; color:var(--text); overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
  .recent-meta{ font-family:'Share Tech Mono', monospace; font-size:.66rem; color:var(--dimmer); margin-top:.2rem; }
  .recent-date{ font-family:'Share Tech Mono', monospace; font-size:.64rem; color:var(--dimmer); flex:0 0 auto; text-align:right; }

  footer{
    margin-top:4.5rem; text-align:center; font-family:'Cinzel',serif; font-size:.68rem;
    letter-spacing:.14em; color:var(--dimmer); text-transform:uppercase;
  }

  @media (max-width: 560px){
    .wrap{ padding-top:4.2rem; }
    .ledger-stat{ flex-basis:45%; border-left:none !important; border-top:1px solid var(--panel-line); }
    .ledger-stat:nth-child(-n+2){ border-top:none; }
    .section-divider{ margin-top:2.6rem; }
    /* a data completa ("Jun 22, 2024 12:26 PM") não cabe ao lado do
       título numa tela estreita — quebra pra linha própria, à direita */
    .recent-row{ flex-wrap:wrap; row-gap:.15rem; }
    .recent-date{ flex-basis:100%; text-align:right; }
  }

  @media (max-width: 400px){
    .wrap{ padding-left:1.1rem; padding-right:1.1rem; }
    .fav-card{ width:112px; }
  }

  /* ── Esfera do Dragão (easter egg secreto) ── */
  #dragonball-sphere{ display:none; position:fixed; right:1.2rem; bottom:1.2rem; z-index:999999; cursor:pointer; animation:dbFloat 3.4s ease-in-out infinite; }
  @keyframes dbFloat{ 0%,100%{transform:translateY(0)} 50%{transform:translateY(-8px)} }
  .db-sphere-orb{ position:relative; width:64px; height:64px; border-radius:50%;
    background:radial-gradient(circle at 32% 28%, #FFE9B0 0%, #FFC24D 18%, #E8891A 55%, #A34E08 85%, #6B3204 100%);
    box-shadow:0 0 22px rgba(232,137,26,.55), inset -6px -6px 14px rgba(0,0,0,.35), inset 4px 6px 10px rgba(255,255,255,.25);
    animation:dbSpin 9s linear infinite; }
  @keyframes dbSpin{ to{ transform:rotate(360deg); } }
  #dragonball-sphere:hover .db-sphere-orb{ box-shadow:0 0 32px rgba(232,137,26,.8), inset -6px -6px 14px rgba(0,0,0,.35), inset 4px 6px 10px rgba(255,255,255,.35); }
  .db-sphere-orb .estrela{ position:absolute; width:9px; height:9px; background:#C21818; clip-path:polygon(50% 0%, 61% 35%, 98% 35%, 68% 56%, 79% 91%, 50% 69%, 21% 91%, 32% 56%, 2% 35%, 39% 35%); filter:drop-shadow(0 1px 1px rgba(0,0,0,.55)); }
</style>

(function(){
  const DATA = JSON.parse(document.getElementById('malData').textContent);

  function escapeHtml(s){
    const d = document.createElement('div');
    d.textContent = s == null ? '' : String(s);
    return d.innerHTML;
  }

  function favCard(item){
    return '<a class="fav-card" href="' + escapeHtml(item.u) + '" target="_blank" rel="noopener">' +
      '<div class="fav-cover"><img src="images/' + escapeHtml(item.img) + '" alt="" loading="lazy" width="140" height="220"></div>' +
      '<div class="fav-body"><div class="fav-title">' + escapeHtml(item.t) + '</div>' +
      (item.m ? '<div class="fav-meta">' + escapeHtml(item.m) + '</div>' : '') +
      '</div></a>';
  }

  document.getElementById('shelfAnime').innerHTML = DATA.anime.map(favCard).join('');
  document.getElementById('shelfChar').innerHTML = DATA.char.map(favCard).join('');
  document.getElementById('shelfManga').innerHTML = DATA.manga.map(favCard).join('');
  document.getElementById('shelfPerson').innerHTML = DATA.person.map(favCard).join('');

  function recentRow(item){
    return '<div class="recent-row">' +
      '<div class="recent-cover"><img src="images/' + escapeHtml(item.img) + '" alt="" loading="lazy" width="34" height="48"></div>' +
      '<div class="recent-info"><div class="recent-title">' + escapeHtml(item.t) + '</div>' +
      '<div class="recent-meta">' + escapeHtml(item.s) + '</div></div>' +
      '<div class="recent-date">' + escapeHtml(item.d) + '</div>' +
    '</div>';
  }

  document.getElementById('recentList').innerHTML =
    DATA.recentAnime.map(recentRow).join('') + DATA.recentManga.map(recentRow).join('');

  const ledgerAnime = [
    ['114,8','Dias'], ['7,37','Nota Média'], ['6.941','Episódios'], ['372','Títulos']

})();

<script>
(function () {
  if (!window.NexusEsferas) return;
  var meuId = 'mal';
  var n = NexusEsferas.esferaDestaPagina(meuId);
  if (n === null) return;

  var POSICOES_ESTRELA = {
    1:[[0,0]], 2:[[-11,-8],[11,8]], 3:[[0,-16],[-13,10],[13,10]],
    4:[[-13,-13],[13,-13],[-13,13],[13,13]],
    5:[[0,-18],[-15,-3],[15,-3],[-10,16],[10,16]],
    6:[[-13,-15],[13,-15],[-13,0],[13,0],[-13,15],[13,15]],
    7:[[0,-18],[-15,-10],[15,-10],[-15,9],[15,9],[-8,18],[8,18]]
  };

  var wrap = document.getElementById('dragonball-sphere');
  var orb  = wrap.querySelector('.db-sphere-orb');
  POSICOES_ESTRELA[n].forEach(function (p) {
    var e = document.createElement('span');
    e.className = 'estrela';
    e.style.left = (32 + p[0] - 4.5) + 'px';
      e.style.top  = (32 + p[1] - 4.5) + 'px';
    orb.appendChild(e);
  });
  wrap.style.display = 'block';
  wrap.setAttribute('aria-label', 'Esfera do Dragão de ' + n + ' estrela' + (n > 1 ? 's' : ''));

  wrap.addEventListener('click', function () {
    NexusEsferas.encontrar(meuId);
    wrap.style.transition = 'opacity .5s ease, transform .5s ease';
    wrap.style.opacity = '0';
    wrap.style.transform = 'scale(.3)';
    setTimeout(function () { wrap.style.display = 'none'; }, 550);
  });
})();
</script>
