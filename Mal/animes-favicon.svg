<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64">
  <defs>
    <linearGradient id="bgGradA" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#101613"/>
      <stop offset="100%" stop-color="#0A0E0D"/>
    </linearGradient>
    <linearGradient id="pageGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#8FCBB0"/>
      <stop offset="100%" stop-color="#5FA88A"/>
    </linearGradient>
  </defs>

  <rect width="64" height="64" rx="12" fill="url(#bgGradA)"/>
  <rect x="0.75" y="0.75" width="62.5" height="62.5" rx="11.5" fill="none" stroke="#5FA88A" stroke-width="0.6" opacity="0.35"/>

  <!-- lombada central do livro -->
  <line x1="32" y1="16" x2="32" y2="48" stroke="#3d7a63" stroke-width="1" opacity="0.7"/>

  <!-- página esquerda -->
  <path d="M 32 18 C 26 16, 18 16, 14 18.5 L 14 45 C 18 42.5, 26 42.5, 32 44.5 Z"
        fill="url(#pageGrad)" opacity="0.92"/>
  <!-- linhas de texto, página esquerda -->
  <line x1="17.5" y1="23" x2="27.5" y2="21.8" stroke="#0A0E0D" stroke-width="0.8" opacity="0.35"/>
  <line x1="17.5" y1="27.5" x2="27.5" y2="26.6" stroke="#0A0E0D" stroke-width="0.8" opacity="0.35"/>
  <line x1="17.5" y1="32" x2="25" y2="31.4" stroke="#0A0E0D" stroke-width="0.8" opacity="0.35"/>

  <!-- página direita -->
  <path d="M 32 18 C 38 16, 46 16, 50 18.5 L 50 45 C 46 42.5, 38 42.5, 32 44.5 Z"
        fill="url(#pageGrad)" opacity="0.75"/>
  <!-- linhas de texto, página direita -->
  <line x1="36.5" y1="21.8" x2="46.5" y2="23" stroke="#0A0E0D" stroke-width="0.8" opacity="0.3"/>
  <line x1="36.5" y1="26.6" x2="46.5" y2="27.5" stroke="#0A0E0D" stroke-width="0.8" opacity="0.3"/>
  <line x1="39" y1="31.4" x2="46.5" y2="32" stroke="#0A0E0D" stroke-width="0.8" opacity="0.3"/>

  <!-- brilho sutil na borda de cima -->
  <path d="M 14 18.5 C 18 16, 26 16, 32 18 C 38 16, 46 16, 50 18.5"
        fill="none" stroke="#FFFFFF" stroke-width="0.6" opacity="0.35"/>

  <!-- marcador de página, discreto -->
  <rect x="30.6" y="12" width="2.8" height="10" rx="0.5" fill="#8FCBB0" opacity="0.85"/>
</svg>
