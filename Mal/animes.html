<style>
  :root{
    --bg:#0A0E0D;
    --bg2:#0F1613;
    --panel:#121A16;
    --panel-line: rgba(95,168,138,0.16);
    --accent:#5FA88A;
    --accent-soft: rgba(95,168,138,0.14);
    --accent-dim: rgba(95,168,138,0.42);
    --text:#E7E7DE;
    --dim: rgba(231,231,222,0.52);
    --dimmer: rgba(231,231,222,0.28);
    --dropped:#8a5a5a;
  }

  *{ margin:0; padding:0; box-sizing:border-box; }

  html,body{
    background:
      linear-gradient(180deg, rgba(10,14,13,.55) 0%, rgba(10,14,13,.8) 45%, var(--bg) 85%),
      url('animes-bg.jpg');
    background-attachment: fixed;
    background-position: center top;
    background-repeat: no-repeat;
    color:var(--text);
    min-height:100vh;
    font-family:'EB Garamond', Georgia, serif;
  }

  body{ padding-bottom:6rem; }

  .nexus-return{
    display:inline-block; position:absolute; top:0; left:0; z-index:10;
    font-family:'Cinzel',serif; font-size:.58rem; letter-spacing:.28em; text-transform:uppercase;
    text-decoration:none; color:var(--dim); padding:1rem 1.2rem; background:transparent; backdrop-filter:blur(6px);
  }
  .nexus-return:hover{ color:var(--accent); }

  .mal-return{
    display:inline-block; position:absolute; top:0; right:0; z-index:10;
    font-family:'Cinzel',serif; font-size:.58rem; letter-spacing:.28em; text-transform:uppercase;
    text-decoration:none; color:var(--dim); padding:1rem 1.2rem; background:transparent; backdrop-filter:blur(6px);
  }
  .mal-return:hover{ color:var(--accent); }

  .wrap{ max-width:1180px; margin:0 auto; padding:5rem 1.5rem 0; }

  .hero{ text-align:center; margin-bottom:2.4rem; }
  .hero-eyebrow{
    font-family:'Cinzel',serif; font-size:.66rem; letter-spacing:.32em; text-transform:uppercase;
    color:var(--accent-dim); margin-bottom:.9rem;
  }
  .hero h1{
    font-family:'Cinzel Decorative', serif; font-weight:700;
    font-size:clamp(2.3rem, 6vw, 3.4rem); letter-spacing:.06em; color:var(--text);
    text-shadow:0 0 40px rgba(95,168,138,.18);
  }
  .hero-tagline{
    font-style:italic; color:var(--dim); font-size:1.05rem; margin-top:.7rem;
  }

  .ledger{
    display:flex; flex-wrap:wrap; justify-content:center; gap:0;
    margin:2.6rem auto 0; max-width:760px;
    border-top:1px solid var(--panel-line); border-bottom:1px solid var(--panel-line);
  }
  .ledger-stat{
    flex:1 1 140px; text-align:center; padding:1.1rem .8rem;
    border-left:1px solid var(--panel-line);
  }
  .ledger-stat:first-child{ border-left:none; }
  .ledger-value{
    font-family:'Share Tech Mono', monospace; font-size:1.5rem; color:var(--accent);
    letter-spacing:.02em;
  }
  .ledger-label{
    font-family:'Cinzel',serif; font-size:.6rem; letter-spacing:.16em; text-transform:uppercase;
    color:var(--dimmer); margin-top:.35rem;
  }

  .controls{
    display:flex; flex-wrap:wrap; align-items:center; gap:.9rem;
    margin:2.8rem 0 .6rem;
  }
  .search-input{
    flex:1 1 220px; background:var(--panel); border:1px solid var(--panel-line); border-radius:3px;
    padding:.65rem .9rem; color:var(--text); font-family:'EB Garamond', serif; font-size:1rem;
  }
  .search-input::placeholder{ color:var(--dimmer); }
  .search-input:focus{ outline:none; border-color:var(--accent-dim); }

  .filters{ display:flex; flex-wrap:wrap; gap:.5rem; }
  .filter-pill{
    font-family:'Cinzel',serif; font-size:.62rem; letter-spacing:.1em; text-transform:uppercase;
    color:var(--dim); background:transparent; border:1px solid var(--panel-line); border-radius:20px;
    padding:.45rem .9rem; cursor:pointer; transition:color .2s ease, border-color .2s ease, background .2s ease;
  }
  .filter-pill:hover{ color:var(--text); border-color:var(--accent-dim); }
  .filter-pill.active{ color:var(--bg); background:var(--accent); border-color:var(--accent); }
  .filter-pill:focus-visible{ outline:2px solid var(--accent); outline-offset:2px; }

  .result-count{
    font-family:'Share Tech Mono', monospace; font-size:.72rem; color:var(--dimmer);
    width:100%; margin-top:.2rem;
  }
  .grid{
    display:grid; grid-template-columns:repeat(auto-fill, minmax(210px, 1fr));
    gap:1.3rem; margin-top:1.6rem;
  }

  .card{
    position:relative; background:linear-gradient(180deg, var(--panel), var(--bg2));
    border:1px solid var(--panel-line); border-left:3px solid var(--accent-dim);
    border-radius:3px; overflow:hidden; display:flex; flex-direction:column;
    transition:border-color .3s ease, transform .2s ease;
  }
  .card:hover{ transform:translateY(-2px); border-color:var(--accent-dim); }
  .card.st-onhold{ border-left-color:rgba(95,168,138,.22); }
  .card.st-dropped{ border-left-color:var(--dropped); opacity:.72; }
  .card.st-plan{ border-left-color:transparent; box-shadow:inset 3px 0 0 0 transparent, inset 0 0 0 1px var(--panel-line); }
  .card.st-plan{ border-left:3px solid var(--panel-line); }

  .card-cover{
    display:block; width:100%; aspect-ratio:192/272; background:var(--bg2); overflow:hidden;
  }
  .card-cover img{ width:100%; height:100%; object-fit:cover; display:block; }

  .card-status{
    position:absolute; top:.6rem; right:.6rem;
    font-family:'Cinzel',serif; font-size:.52rem; letter-spacing:.08em; text-transform:uppercase;
    padding:.28rem .55rem; border-radius:12px; background:rgba(10,14,13,.78); backdrop-filter:blur(3px);
    color:var(--dim);
  }
  .card.st-watching .card-status, .card.st-completed .card-status{ color:var(--accent); }

  .card-body{ padding:.9rem 1rem 1.1rem; display:flex; flex-direction:column; flex:1; }
  .card-title{
    font-family:'Cinzel Decorative', serif; font-weight:700; font-size:.98rem;
    line-height:1.3; color:var(--text);
  }
  .card-title-en{ font-style:italic; color:var(--dim); font-size:.82rem; margin-top:.15rem; }

  .card-meta{
    font-family:'Cinzel',serif; font-size:.58rem; letter-spacing:.06em; text-transform:uppercase;
    color:var(--dimmer); margin-top:.55rem; line-height:1.6;
  }

  .card-score{
    font-family:'Share Tech Mono', monospace; font-size:.78rem; color:var(--accent);
    margin-top:.5rem;
  }
  .card-score.unscored{ color:var(--dimmer); }

  .card-review{
    font-style:italic; color:var(--dim); font-size:.86rem; line-height:1.55;
    margin-top:.7rem; padding-top:.65rem; border-top:1px solid var(--panel-line);
  }
  .card-review::before{ content:'"'; color:var(--accent-dim); font-family:'Cinzel Decorative',serif; }
  .card-review::after{ content:'"'; color:var(--accent-dim); font-family:'Cinzel Decorative',serif; }

  .card-link{
    margin-top:auto; padding-top:.7rem; font-family:'Cinzel',serif; font-size:.56rem;
    letter-spacing:.12em; text-transform:uppercase; color:var(--dimmer); text-decoration:none;
  }
  .card-link:hover{ color:var(--accent); }

  .empty-state{
    text-align:center; padding:3.5rem 1rem; color:var(--dimmer); font-style:italic; grid-column:1/-1;
  }

  footer{
    margin-top:5rem; text-align:center; font-family:'Cinzel',serif; font-size:.68rem;
    letter-spacing:.14em; color:var(--dimmer); text-transform:uppercase;
  }

  @media (max-width: 560px){
    .wrap{ padding-top:4.2rem; }
    .ledger-stat{ flex-basis:45%; border-left:none !important; border-top:1px solid var(--panel-line); }
    .ledger-stat:nth-child(-n+2){ border-top:none; }
  }

  @media (prefers-reduced-motion: reduce){
    .card{ transition:none; }
  }
</style>
</head>

<script>
(function(){
  const DATA = JSON.parse(document.getElementById('animeData').textContent);
  const STATUS_LABELS = { watching:'Assistindo', completed:'Concluído', onhold:'Em Pausa', dropped:'Abandonado', plan:'Pretendo Assistir' };

  let currentFilter = 'all';
  let currentSearch = '';

  const grid = document.getElementById('grid');
  const searchInput = document.getElementById('searchInput');
  const resultCount = document.getElementById('resultCount');
  const filterPills = document.querySelectorAll('.filter-pill');

  function escapeHtml(s){
    const d = document.createElement('div');
    d.textContent = s == null ? '' : String(s);
    return d.innerHTML;
  }

  function matchesFilters(item){
    if(currentFilter !== 'all' && item.s !== currentFilter) return false;
    if(currentSearch){
      const q = currentSearch.toLowerCase();
      const inTitle = item.t.toLowerCase().includes(q);
      const inEng = item.te ? item.te.toLowerCase().includes(q) : false;
      if(!inTitle && !inEng) return false;
    }
    return true;
  }

  function cardHtml(item){
    const scoreHtml = item.sc > 0
      ? '<div class="card-score">' + item.sc + '/10</div>'
      : '<div class="card-score unscored">sem nota</div>';

    const engHtml = item.te ? '<div class="card-title-en">' + escapeHtml(item.te) + '</div>' : '';

    const metaParts = [];
    if(item.ty) metaParts.push(escapeHtml(item.ty));
    metaParts.push(item.ep + ' / ' + (item.epT || '?') + ' ep');
    if(item.st) metaParts.push(escapeHtml(item.st));
    const metaHtml = metaParts.join(' &middot; ');

    const reviewHtml = item.tag ? '<div class="card-review">' + escapeHtml(item.tag) + '</div>' : '';
    const linkHtml = item.url ? '<a class="card-link" href="' + escapeHtml(item.url) + '" target="_blank" rel="noopener">Ver no MAL &rarr;</a>' : '';

    const coverInner = '<img src="capas/' + escapeHtml(item.img) + '" alt="" loading="lazy" width="192" height="272">';
    const coverHtml = item.custom
      ? '<a class="card-cover" href="' + escapeHtml(item.custom) + '">' + coverInner + '</a>'
      : '<div class="card-cover">' + coverInner + '</div>';

    return (
      '<article class="card st-' + item.s + '">' +
        coverHtml +
        '<div class="card-status">' + STATUS_LABELS[item.s] + '</div>' +
        '<div class="card-body">' +
          '<div class="card-title">' + escapeHtml(item.t) + '</div>' +
          engHtml +
          '<div class="card-meta">' + metaHtml + '</div>' +
          scoreHtml +
          reviewHtml +
          linkHtml +
        '</div>' +
      '</article>'
    );
  }

  function render(){
    const filtered = DATA.filter(matchesFilters);
    const ORDEM_STATUS = { watching:0, completed:1, onhold:2, dropped:3, plan:4 };
    filtered.sort((a, b) => (ORDEM_STATUS[a.s] - ORDEM_STATUS[b.s]) || a.t.localeCompare(b.t));

    if(filtered.length === 0){
      grid.innerHTML = '<p class="empty-state">Nada encontrado por aqui.</p>';
    } else {
      grid.innerHTML = filtered.map(cardHtml).join('');
    }
    resultCount.textContent = filtered.length + ' de ' + DATA.length;
  }

  searchInput.addEventListener('input', (e) => {
    currentSearch = e.target.value;
    render();
  });

  filterPills.forEach((pill) => {
    pill.addEventListener('click', () => {
      filterPills.forEach((p) => p.classList.remove('active'));
      pill.classList.add('active');
      currentFilter = pill.dataset.filter;
      render();
    });
  });

  render();
})();
</script>
