<svg viewBox="0 0 64 64" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bookGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#7d5a3c"/>
      <stop offset="100%" stop-color="#5c3d26"/>
    </linearGradient>
  </defs>

  <!-- fundo -->
  <rect width="64" height="64" rx="14" fill="#fdfaf4"/>

  <!-- capa do livro -->
  <path d="M 10 16 
           Q 32 10, 54 16 
           L 54 50 
           Q 32 44, 10 50 
           Z" 
        fill="url(#bookGrad)" stroke="#a67c52" stroke-width="1.5"/>

  <!-- lombada central -->
  <line x1="32" y1="12" x2="32" y2="47" stroke="#fdfaf4" stroke-width="1.2" opacity="0.5"/>

  <!-- páginas internas (mais claras) -->
  <path d="M 13 19 
           Q 32 14, 51 19 
           L 51 47 
           Q 32 42, 13 47 
           Z" 
        fill="#fffbf7" opacity="0.9"/>

  <!-- linha do caminho / timeline atravessando as páginas -->
  <path d="M 17 39 
           C 22 33, 26 41, 30 34 
           C 34 28, 40 36, 47 27" 
        fill="none" stroke="#b07340" stroke-width="1.8" stroke-linecap="round"/>

  <!-- pontos da timeline (mesmo estilo dos marcadores do diário) -->
  <circle cx="17" cy="39" r="2.3" fill="#b07340" stroke="#fffbf7" stroke-width="1"/>
  <circle cx="30" cy="34" r="2.3" fill="#b07340" stroke="#fffbf7" stroke-width="1"/>
  <circle cx="47" cy="27" r="2.6" fill="#7d5a3c" stroke="#fffbf7" stroke-width="1"/>
</svg>
