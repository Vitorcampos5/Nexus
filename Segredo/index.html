<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<title>Segredo do Nexus</title>
<style>
  @import url('https://fonts.googleapis.com/css2?family=Cinzel:wght@400;600&family=EB+Garamond:ital@0;1&display=swap');

  :root {
    --bg: #0a0a0f;
    --jade: #2E7D5B;
    --jade-claro: #4FAE82;
    --ouro: #C4A35A;
    --ouro-claro: #FFD98A;
    --texto: #E8E0D0;
  }

  * { box-sizing: border-box; }
  html, body {
    width: 100%; min-height: 100%; margin: 0; padding: 0;
    background: var(--bg); color: var(--texto);
    font-family: 'EB Garamond', Georgia, serif;
    overflow-x: hidden; overflow-y: auto;
  }

  #palco {
    position: relative; width: 100%; min-height: 100vh;
    display: flex; align-items: center; justify-content: flex-start;
    flex-direction: column; padding: 30px 0;
    /* Âncora a partir do topo (não justify-content:center) de propósito:
       como os blocos de texto abaixo do dragão agora entram/saem do
       fluxo de verdade (display:none real, ver comentário mais abaixo),
       a altura total do conteúdo muda entre fases. Se o palco inteiro
       ficasse centralizado verticalmente, o dragão "pularia" de posição
       toda vez que um bloco de texto aparecesse/sumisse. Com âncora no
       topo + este padding, a imagem fica sempre na mesma altura. */
    padding-top: min(12vh, 90px);
  }

  /* ── Névoa jade ao fundo ── */
  .nevoa {
    position: absolute; width: 220px; height: 220px; border-radius: 50%;
    background: radial-gradient(circle, rgba(46,125,91,.45), transparent 70%);
    opacity: 0; pointer-events: none;
    animation: nevoaFlutuar 6s ease-in-out infinite;
  }
  @keyframes nevoaFlutuar {
    0%, 100% { transform: translate(0,0) scale(1); }
    50%      { transform: translate(20px,-15px) scale(1.15); }
  }
  #palco.fase-nevoa .nevoa,
  #palco.fase-fala .nevoa { opacity: 1; transition: opacity 2s ease; }
  #palco.fase-opcoes .nevoa,
  #palco.fase-resultado .nevoa { opacity: .25; transition: opacity 1.5s ease; }

  /* ── Sprite do dragão ── */
  #shenlong-container {
    position: relative; width: min(58vw, 420px); height: min(36vh, 320px);
    display: flex; align-items: center; justify-content: center;
    opacity: 0; transition: opacity 1s ease;
  }
  #shenlong-container.visivel { opacity: 1; }
  #shenlong-sprite {
    width: 100%; height: 100%; object-fit: contain; object-position: center;
    filter: drop-shadow(0 0 18px rgba(196,163,90,.35));
  }

  /* ── Texto de fala ──
     Todos os blocos abaixo (fala, opções, formulário, resultado, voltar)
     começam com display:none via atributo inline no HTML — não só
     opacity:0 — porque um bloco com opacity:0 ainda ocupa espaço no
     layout. Empilhados os cinco ao mesmo tempo (mesmo invisíveis) é
     exatamente o que forçava rolagem antes. O JS troca display e classe
     "visivel" juntos (ver mostrar()/esconder() no script). ── */
  #fala {
    font-style: italic; font-size: clamp(1rem, 2.2vw, 1.4rem);
    color: var(--texto); text-align: center; max-width: 640px;
    margin-top: 1rem; opacity: 0; transition: opacity 1s ease;
    padding: 0 20px;
  }
  #fala.visivel { opacity: 1; }

  /* ── Opções de desejo ── */
  #opcoes { margin-top: 1.4rem; display: flex; flex-direction: column; gap: .3rem; align-items: center; }
  .opcao {
    font-family: 'Cinzel', serif; font-size: .95rem; letter-spacing: .04em;
    color: var(--ouro); cursor: pointer; opacity: 0; transform: translateY(6px);
    transition: opacity .5s ease, transform .5s ease, color .2s ease;
    pointer-events: none;
    padding: .55rem 1rem;
  }
  .opcao.visivel { opacity: 1; transform: translateY(0); pointer-events: auto; }
  .opcao:hover { color: var(--ouro-claro); }

  /* ── Formulário do primeiro nome (opção 2) ── */
  #form-nome {
    display: flex; flex-direction: column; align-items: center; gap: .8rem;
    margin-top: 1rem; opacity: 0; transition: opacity .6s ease;
    pointer-events: none;
  }
  #form-nome.visivel { opacity: 1; pointer-events: all; }
  #pedido-nome {
    font-style: italic; font-size: clamp(1rem, 2.2vw, 1.3rem);
    color: var(--texto); text-align: center; max-width: 600px; padding: 0 20px;
  }
  #input-nome {
    font-family: 'EB Garamond', Georgia, serif; font-size: 1rem;
    background: rgba(255,255,255,.04); border: 1px solid var(--ouro);
    color: var(--texto); padding: .5rem .9rem; border-radius: 3px;
    text-align: center; width: 220px; outline: none;
  }
  #input-nome:focus { border-color: var(--ouro-claro); background: rgba(255,255,255,.07); }
  #confirmar-nome {
    font-family: 'Cinzel', serif; font-size: .85rem; letter-spacing: .06em;
    background: none; border: 1px solid var(--ouro); color: var(--ouro);
    padding: .4rem 1.1rem; border-radius: 3px; cursor: pointer;
    transition: color .2s ease, border-color .2s ease;
  }
  #confirmar-nome:hover { color: var(--ouro-claro); border-color: var(--ouro-claro); }

  /* ── Resultado ── */
  #resultado {
    max-width: 640px; text-align: center; font-size: 1.05rem;
    color: var(--texto); opacity: 0; transition: opacity .6s ease;
    padding: 0 20px; margin-top: 1rem; white-space: pre-line;
  }
  #resultado.visivel { opacity: 1; }
  #voltar {
    font-style: italic; font-size: .85rem; color: var(--ouro); cursor: pointer;
    margin-top: 1.2rem; opacity: 0; transition: opacity .6s ease;
    padding: .5rem 1rem;
  }
  #voltar.visivel { opacity: 1; }
  #voltar:hover { color: var(--ouro-claro); }

  /* ── "Isso não existe" — trava de acesso: só dá pra ver o Shen Long
     enquanto as 7 esferas estiverem reunidas no Nexus. Depois que se
     dispersam (o desejo já foi feito), a página finge não existir. ── */
  #inexistente {
    font-style: italic; font-size: 1.05rem; color: var(--texto);
    text-align: center; max-width: 480px; padding: 0 20px;
    opacity: 0; transition: opacity 1.4s ease;
  }
  #inexistente.visivel { opacity: .68; }
  #inexistente-voltar {
    display: inline-block; margin-top: 1.4rem; font-size: .8rem; color: var(--ouro);
    cursor: pointer; opacity: 0; transition: opacity 1s ease;
    padding: .5rem 1rem;
  }
  #inexistente-voltar.visivel { opacity: .55; }
  #inexistente-voltar:hover { opacity: 1 !important; color: var(--ouro-claro); }

  @media (max-width: 380px) {
    #palco { padding-top: min(8vh, 60px); }
    #input-nome { width: min(220px, 78vw); }
  }

  @media (prefers-reduced-motion: reduce) {
    .nevoa { animation: none; }
    #shenlong-container, #fala, .opcao, #form-nome, #resultado, #voltar,
    #inexistente, #inexistente-voltar { transition: opacity .3s linear !important; transform: none !important; }
  }
</style>
</head>
<body>
<!-- avisa o mapa do Nexus (se estiver por perto) que esta página foi visitada -->
<script>try{ if (window.top !== window) window.top.postMessage({ tipo:'nexus-visita', id:'segredo' }, '*'); }catch(e){}</script>

<div id="palco" class="fase-nevoa">
  <div class="nevoa" style="left:20%; top:30%;"></div>
  <div class="nevoa" style="left:65%; top:20%; animation-delay:-2s;"></div>
  <div class="nevoa" style="left:75%; top:60%; animation-delay:-4s;"></div>
  <div class="nevoa" style="left:30%; top:65%; animation-delay:-1s;"></div>

  <div id="shenlong-container">
    <img id="shenlong-sprite" src="" alt="Shen Long">
  </div>

  <p id="fala" style="display:none;"></p>

  <div id="opcoes" style="display:none;">
    <div class="opcao" data-indice="0">1. Saber sobre os outros easter eggs</div>
    <div class="opcao" data-indice="1">2. Saber o que o autor do site acha do meu nome</div>
    <div class="opcao" data-indice="2">3. Ir para outro universo</div>
  </div>

  <div id="form-nome" style="display:none;">
    <p id="pedido-nome">"Diz-me o teu nome, viajante — apenas o primeiro, nada além disso."</p>
    <input type="text" id="input-nome" maxlength="30" autocomplete="off" placeholder="Seu primeiro nome">
    <button id="confirmar-nome" type="button">✦ Dizer ao dragão</button>
  </div>

  <p id="resultado" style="display:none;"></p>
  <p id="voltar" style="display:none;">‹ voltar ao Nexus</p>

  <p id="inexistente" style="display:none;">Não há nada aqui.<br>Talvez, um dia, as sete se alinhem de novo.</p>
  <span id="inexistente-voltar" style="display:none;">‹ Nexus</span>
</div>

<script src="../Lib/dragonball.js"></script>
<script>
(function () {
  // ── PONTOS PRA EDITAR DEPOIS (procure por "EDITE AQUI") ──
  var MENSAGEM_EASTER_EGGS = "Quando o pergaminho arde e as cinzas se assentam, olhos despertam do nada — e um entre eles, raramente, sangra o que os outros só observam.\n\nMas há uma chance ainda menor, quase um sussurro: no lugar dos olhos, é Ele quem vem — a Calamidade que só aparece para testemunhar suas próprias cinzas.";
  var MENSAGEM_NOME = "[ TODO: o que você, autor do site, acha do nome {nome} ]";
  // EDITE AQUI — quando o site da visual novel (histórias próprias, 2D
  // interativo) estiver pronto, preencha o caminho aqui (relativo à
  // pasta Segredo/, ex.: '../VisualNovel/index.html') pra opção 3
  // navegar de verdade pra lá. Enquanto estiver vazio, mostra só um
  // texto de espera e segue o fluxo normal (resultado + voltar).
  // Assumindo que o arquivo fica na raiz do Nexus (irmã do nexus.html,
  // mesmo nível que Segredo/) — se o lugar real for outro, ajuste aqui.
  var URL_OUTRO_UNIVERSO = '../Jogos/Coletânea Owarana Distopia.html';

  // Quanto tempo o resultado fica na tela antes de voltar sozinho pro
  // Nexus — o link manual continua funcionando pra quem quiser ir antes.
  var SEGUNDOS_ATE_REDIRECIONAR = 15;

  // Uma vez escolhido um desejo, essa escolha fica registrada aqui —
  // sobrevive a reload E a navegar pra fora e voltar com o botão do
  // navegador (sessionStorage é por aba, some só quando a aba fecha).
  // NÃO é limpa aqui no Segredo de propósito — ver comentário em
  // voltarAoNexus() sobre por que isso importa. Quem limpa isso é o
  // nexus.html, e só quando um NOVO ciclo de conclusão acontece de
  // verdade (ver celebrarSePrimeiraVez() lá).
  var CHAVE_ESCOLHA = 'segredo_escolha_feita';

  var palco = document.getElementById('palco');
  var container = document.getElementById('shenlong-container');
  var sprite = document.getElementById('shenlong-sprite');
  var fala = document.getElementById('fala');
  var opcoesWrap = document.getElementById('opcoes');
  var opcoes = document.querySelectorAll('.opcao');
  var formNome = document.getElementById('form-nome');
  var inputNome = document.getElementById('input-nome');
  var confirmarNome = document.getElementById('confirmar-nome');
  var resultado = document.getElementById('resultado');
  var voltar = document.getElementById('voltar');
  var inexistente = document.getElementById('inexistente');
  var inexistenteVoltar = document.getElementById('inexistente-voltar');

  var reduzMovimento = window.matchMedia && window.matchMedia('(prefers-reduced-motion: reduce)').matches;
  var timerRedirecionamento = null;

  sprite.src = 'shenlong.png';
  // EDITE AQUI — se quiser animar o Shen Long (CSS @keyframes numa classe,
  // ou manipulando estilo/transform via JS), o elemento #shenlong-sprite
  // é o ponto de partida. Ele só recebe a classe "visivel" no momento
  // certo da cena (ver iniciar() abaixo) — dá pra disparar sua animação
  // a partir daí, ou numa classe própria adicional.

  // Mostra um bloco (tira do display:none e, no quadro seguinte, liga a
  // transição de opacity) ou esconde (opacity primeiro, display:none só
  // depois que a transição termina) — assim nenhum bloco ocupa espaço
  // no layout enquanto não está em uso, o que é o que evita a rolagem.
  function mostrar(el, tipoDisplay) {
    el.style.display = tipoDisplay || 'block';
    void el.offsetHeight; // força reflow antes de animar
    el.classList.add('visivel');
  }
  function esconder(el) {
    el.classList.remove('visivel');
    setTimeout(function () {
      if (!el.classList.contains('visivel')) el.style.display = 'none';
    }, 650);
  }

  function lerEscolhaSalva() {
    try { return JSON.parse(sessionStorage.getItem(CHAVE_ESCOLHA)); } catch (e) { return null; }
  }

  function salvarEscolha(indice, nome) {
    try { sessionStorage.setItem(CHAVE_ESCOLHA, JSON.stringify({ indice: indice, nome: nome || null })); } catch (e) {}
  }

  // EDITE AQUI — outros trocadilhos/piadas com nomes específicos podem
  // ser adicionados seguindo o mesmo padrão desta função.
  function ehNomeAlexia(nome) {
    return (nome || '').trim().toLowerCase() === 'alexia';
  }

  // Verdadeiro se o nome tiver números/símbolos "demais" — kanji e
  // outras letras de idiomas diferentes (acentos, cirílico, etc.) NÃO
  // contam contra, só o que realmente não é letra nenhuma (\p{L} do
  // Unicode cobre letra de qualquer idioma, incluindo kanji). Hífen e
  // apóstrofo também não contam, por causa de nomes tipo "Anne-Marie"
  // ou "O'Brien". "Demais" = pelo menos 2 caracteres estranhos, ou mais
  // de 30% do nome pra nomes curtos.
  function temCaracteresEstranhosDemais(nome) {
    var texto = (nome || '').trim().replace(/[-'’]/g, '');
    if (!texto) return false;
    var letras = (texto.match(/\p{L}/gu) || []).length;
    var naoLetras = texto.length - letras;
    return naoLetras >= 2 || naoLetras / texto.length > 0.3;
  }

  // EDITE AQUI — respostas fixas de uma linha só pra nomes específicos
  // (sem efeito temporizado como o de "Alexia" acima). Chave sempre em
  // minúsculas; é só adicionar mais entradas seguindo o mesmo padrão.
  var RESPOSTAS_NOME_FIXO = {
    'matheus': 'É um nome que combina com a raça saiyajin'
  };

  function textoParaEscolha(indice, nome) {
    if (indice === 0) return MENSAGEM_EASTER_EGGS;
    if (indice === 1) {
      // Recuperação (reload/voltar no meio da piada) mostra o desfecho
      // direto, já que replay do tempo da piada não faz sentido aqui —
      // ver a sequência ao vivo em confirmarNomeSubmetido().
      if (temCaracteresEstranhosDemais(nome)) return 'Você deve ser um android, não é?';
      if (ehNomeAlexia(nome)) return 'Brincadeira, mó nome de tonga';
      var respostaFixa = RESPOSTAS_NOME_FIXO[(nome || '').trim().toLowerCase()];
      if (respostaFixa) return respostaFixa;
      return MENSAGEM_NOME.replace('{nome}', nome || '');
    }
    // Só é usado enquanto URL_OUTRO_UNIVERSO ainda estiver vazio (site da
    // visual novel em preparação) — depois de preenchida, escolher()
    // navega direto pra lá em vez de mostrar este texto.
    return '[ TODO: site da visual novel ainda em preparação — ver URL_OUTRO_UNIVERSO no código ]';
  }

  // ── Sequência da cena ──
  var FALA_PADRAO = '"Fala teu desejo, viajante. Concederei um, e apenas um."';
  // EDITE AQUI — a fala de reconhecimento quando entram pelo botão
  // mestre (ver nexus.html). Mesma ideia do momento em que o Shen Long
  // reconhece o Bills no anime — a postura dele muda na hora.
  var FALA_CRIADOR = '"...Espera. Essa presença não é de quem pede um desejo — é de quem decidiu que eu poderia conceder um. Perdão pela hesitação. Não é todo dia que a criatura reconhece quem a desenhou."';

  function iniciar() {
    // Modo criador: entrada via o botão mestre escondido no Nexus, só
    // pra testar sem precisar juntar as 7 esferas de verdade. É um
    // sinal de uso único — lido e apagado na hora, então só vale pra
    // essa carga da página (clicar no botão mestre de novo reativa).
    var modoCriador = false;
    try {
      modoCriador = localStorage.getItem('nexus_modo_criador') === '1';
      if (modoCriador) localStorage.removeItem('nexus_modo_criador');
    } catch (e) {}

    if (modoCriador) {
      fala.textContent = FALA_CRIADOR;
      if (reduzMovimento) {
        mostrar(container);
        palco.className = 'fase-fala';
        setTimeout(function () { mostrar(fala); }, 300);
        setTimeout(mostrarOpcoes, 1200);
        return;
      }
      palco.className = 'fase-nevoa';
      setTimeout(function () {
        palco.className = 'fase-fala';
        mostrar(container);
        setTimeout(function () { mostrar(fala); }, 600);
        setTimeout(mostrarOpcoes, 2400);
      }, 1800);
      return;
    }

    fala.textContent = FALA_PADRAO;
    var escolhaSalva = lerEscolhaSalva();

    // "completo" aqui é o sinal que realmente importa: se as 7 esferas
    // ainda estão reunidas, o ciclo do desejo atual ainda está "aberto"
    // (mesmo que o usuário já tenha escolhido e voltado com o botão do
    // navegador). Assim que a dispersão rodar no Nexus e resetar os
    // dados, completo vira false — e a partir daí, mesmo com uma
    // escolhaSalva ainda pendurada no sessionStorage (que só é limpa
    // numa conclusão nova, não no reset em si — ver nexus.html), o
    // ciclo já se encerrou de verdade, então a página deve fingir não
    // existir, não mostrar o resultado antigo de novo.
    var completo = false;
    try { completo = !!window.NexusEsferas && NexusEsferas.getEncontradas().length === NexusEsferas.TOTAL; } catch (e) {}

    if (escolhaSalva && completo) {
      // já tinha escolhido antes (reload, ou voltou com o botão do
      // navegador) E o reset no Nexus ainda não rolou — pula direto
      // pro resultado, sem deixar escolher de novo
      mostrar(container);
      mostrarResultado(textoParaEscolha(escolhaSalva.indice, escolhaSalva.nome), true);
      return;
    }

    if (!completo) {
      mostrarInexistente();
      return;
    }

    if (reduzMovimento) {
      mostrar(container);
      palco.className = 'fase-fala';
      setTimeout(function () { mostrar(fala); }, 300);
      setTimeout(mostrarOpcoes, 1200);
      return;
    }

    palco.className = 'fase-nevoa';
    setTimeout(function () {
      palco.className = 'fase-fala';
      mostrar(container);
      setTimeout(function () { mostrar(fala); }, 600);
      setTimeout(mostrarOpcoes, 2400);
    }, 1800);
  }

  function mostrarInexistente() {
    palco.className = 'fase-inexistente';
    setTimeout(function () {
      mostrar(inexistente);
      mostrar(inexistenteVoltar, 'block');
    }, 400);
  }
  inexistenteVoltar.addEventListener('click', function () {
    window.location.href = '../nexus.html';
  });

  function mostrarOpcoes() {
    palco.className = 'fase-opcoes';
    mostrar(opcoesWrap, 'flex');
    opcoes.forEach(function (op, i) {
      setTimeout(function () { op.classList.add('visivel'); }, i * 250);
    });
  }

  opcoes.forEach(function (op) {
    op.addEventListener('click', function () {
      escolher(parseInt(op.getAttribute('data-indice'), 10));
    });
  });

  // Uma vez escolhido um desejo, não há volta pra escolher outro — só
  // segue em frente até "voltar ao Nexus" (manual ou automático, ver
  // mostrarResultado()).
  function escolher(indice) {
    opcoes.forEach(function (op) { op.classList.remove('visivel'); });
    esconder(opcoesWrap);
    esconder(fala);

    if (indice === 1) {
      mostrarFormNome();
    } else if (indice === 2 && URL_OUTRO_UNIVERSO) {
      irParaOutroUniverso();
    } else {
      salvarEscolha(indice);
      mostrarResultado(textoParaEscolha(indice));
    }
  }

  // O desejo "ir para outro universo" ainda conta como um desejo
  // concedido — as esferas devem se dispersar do mesmo jeito — só que
  // em vez de voltar pro Nexus, o destino é o site da visual novel
  // direto. Como o reset/bloqueio de verdade só roda dentro do
  // nexus.html (ver o comentário em voltarAoNexus()), só marcamos o
  // aviso aqui; ele será processado na próxima vez que o Nexus for
  // carregado, mesmo que isso demore (a pessoa foi direto pra outro
  // site, não passou pelo Nexus agora).
  function irParaOutroUniverso() {
    salvarEscolha(2);
    try { localStorage.setItem('nexus_esferas_dispersar', '1'); } catch (e) {}
    window.location.href = URL_OUTRO_UNIVERSO;
  }

  function mostrarFormNome() {
    palco.className = 'fase-opcoes';
    setTimeout(function () {
      mostrar(formNome, 'flex');
      inputNome.focus();
    }, 300);
  }

  function confirmarNomeSubmetido() {
    var digitado = inputNome.value.trim();
    if (!digitado) { inputNome.focus(); return; }
    // reforça "só o primeiro nome" mesmo que o usuário digite mais de uma
    // palavra — o Shen Long já avisou, isso é só uma rede de segurança
    var primeiroNome = digitado.split(/\s+/)[0];

    esconder(formNome);
    salvarEscolha(1, primeiroNome);

    if (ehNomeAlexia(primeiroNome)) {
      mostrarResultado('Você quis dizer Alexa?');
      setTimeout(function () {
        resultado.textContent = 'Brincadeira, mó nome de tonga';
      }, 6000);
      return;
    }

    mostrarResultado(textoParaEscolha(1, primeiroNome));
  }

  confirmarNome.addEventListener('click', confirmarNomeSubmetido);
  inputNome.addEventListener('keydown', function (e) {
    if (e.key === 'Enter') confirmarNomeSubmetido();
  });

  function mostrarResultado(texto, imediato) {
    resultado.textContent = texto;
    palco.className = 'fase-resultado';
    if (imediato) {
      mostrar(resultado);
      mostrar(voltar);
    } else {
      setTimeout(function () {
        mostrar(resultado);
        mostrar(voltar);
      }, 400);
    }

    if (timerRedirecionamento) clearTimeout(timerRedirecionamento);
    timerRedirecionamento = setTimeout(voltarAoNexus, SEGUNDOS_ATE_REDIRECIONAR * 1000);
  }

  // Ao voltar (manual ou automático, depois de SEGUNDOS_ATE_REDIRECIONAR),
  // NÃO reseta as esferas aqui — só avisa o Nexus (via localStorage) que
  // um desejo foi concedido. É o nexus.html quem detecta esse aviso,
  // toca a animação das esferas se dispersando, e SÓ DEPOIS reseta de
  // verdade (novo sorteio, progresso zerado, cutscene liberada de novo).
  // Isso importa porque se resetássemos aqui, quando o Nexus carregasse
  // não sobraria mais nada "cheio" pra animar saindo — a dispersão
  // precisa acontecer visualmente ANTES do reset de dados.
  //
  // Também não limpa CHAVE_ESCOLHA (sessionStorage) por um motivo
  // parecido: quem limpa isso é o nexus.html, e só quando um NOVO ciclo
  // de conclusão de verdade acontece (ver celebrarSePrimeiraVez() lá) —
  // assim, apertar "voltar" do navegador e recarregar esta página ainda
  // mostra o mesmo resultado, em vez de reiniciar a escolha.
  function voltarAoNexus() {
    if (timerRedirecionamento) clearTimeout(timerRedirecionamento);
    try {
      localStorage.setItem('nexus_esferas_dispersar', '1');
    } catch (e) { /* sem storage — segue o redirecionamento normalmente */ }
    window.location.href = '../nexus.html';
  }

  voltar.addEventListener('click', voltarAoNexus);

  // O botão "Voltar" do navegador (ao contrário de recarregar) pode
  // restaurar a página inteira congelada do bfcache, sem re-executar
  // nada deste script — então, se nesse meio tempo o Nexus já tiver
  // rodado a dispersão e resetado os dados, o estado congelado (ainda
  // mostrando o resultado antigo) fica desatualizado e some ele nunca
  // se corrige sozinho. O evento pageshow com persisted=true avisa
  // exatamente quando isso acontece — aí reavaliamos tudo do zero.
  window.addEventListener('pageshow', function (e) {
    if (!e.persisted) return;
    if (timerRedirecionamento) clearTimeout(timerRedirecionamento);
    [container, fala, opcoesWrap, formNome, resultado, voltar, inexistente, inexistenteVoltar].forEach(function (el) {
      el.classList.remove('visivel');
      el.style.display = 'none';
    });
    palco.className = '';
    iniciar();
  });

  iniciar();
})();
</script>
