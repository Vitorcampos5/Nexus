<svg viewBox="0 0 64 64" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bgGradC" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#111019"/>
      <stop offset="100%" stop-color="#07080D"/>
    </linearGradient>
    <linearGradient id="maskGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#F6F1E7"/>
      <stop offset="55%" stop-color="#E3D6F0"/>
      <stop offset="100%" stop-color="#9B7FD4"/>
    </linearGradient>
    <linearGradient id="skinGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#2a2438"/>
      <stop offset="100%" stop-color="#1b1826"/>
    </linearGradient>
  </defs>

  <rect width="64" height="64" rx="12" fill="url(#bgGradC)"/>
  <rect x="0.75" y="0.75" width="62.5" height="62.5" rx="11.5" fill="none" stroke="#9B7FD4" stroke-width="0.6" opacity="0.35"/>

  <!-- rosto base -->
  <path d="M 32 8
           C 20 8, 13 18, 13 28
           C 13 40, 20 50, 32 55
           C 44 50, 51 40, 51 28
           C 51 18, 44 8, 32 8 Z"
        fill="url(#skinGrad)" stroke="#4a3d63" stroke-width="0.7"/>

  <!-- sobrancelhas, simetricas -->
  <path d="M 16 20 C 19 17, 24 16.5, 27 18.5" fill="none" stroke="#3a3350" stroke-width="1.2" stroke-linecap="round"/>
  <path d="M 37 18.5 C 40 16.5, 45 17, 48 20" fill="none" stroke="#3a3350" stroke-width="1.2" stroke-linecap="round"/>

  <!-- olhos, simetricos, mesma altura, sem pupila, pretos -->
  <ellipse cx="22.5" cy="26" rx="3.8" ry="2.3" fill="#08070a"/>
  <ellipse cx="41.5" cy="26" rx="3.8" ry="2.3" fill="#08070a"/>

  <!-- ponte do nariz -->
  <path d="M 32 25 C 31.3 29, 30.8 33, 31.6 36.5 C 32 37.4, 32 37.4, 32.4 36.5"
        fill="none" stroke="#4a3d63" stroke-width="0.7" opacity="0.7"/>

  <!-- boca -->
  <path d="M 26 44.5 C 29 46.3, 35 46.3, 38 44.5"
        fill="none" stroke="#4a3d63" stroke-width="0.9" stroke-linecap="round" opacity="0.75"/>

  <!-- maca do rosto / mandibula, sutil -->
  <path d="M 46 33 C 47.5 39, 45.5 46, 39 51.5" fill="none" stroke="#3a3350" stroke-width="0.5" opacity="0.5"/>
  <path d="M 18 33 C 16.5 39, 18.5 46, 25 51.5" fill="none" stroke="#3a3350" stroke-width="0.5" opacity="0.4"/>

  <!-- mascara: metade esquerda, topo quebrado, buraco pro olho -->
  <path fill-rule="evenodd" fill="url(#maskGrad)" d="
           M 32 8
           L 25 7 L 27 11 L 20 10 L 22 14.5 L 15 15 L 17.5 19 L 12 20.5 L 14.5 24.5 L 13 28
           C 13 40, 20 50, 32 55
           L 32 8 Z
           M 22.5 26 m -4.3 0
           a 4.3 2.7 0 1 0 8.6 0
           a 4.3 2.7 0 1 0 -8.6 0
           Z" />

  <!-- brilho nos pontos da quebra -->
  <g stroke="#FFFFFF" stroke-width="0.6" stroke-linecap="round" opacity="0.55">
    <line x1="24" y1="8.3" x2="26.5" y2="10.2"/>
    <line x1="19" y1="11.5" x2="21.3" y2="13.6"/>
    <line x1="14" y1="16.5" x2="16.5" y2="18.2"/>
    <line x1="11" y1="21.8" x2="13.5" y2="23.7"/>
  </g>

  <!-- borda do buraco do olho -->
  <ellipse cx="22.5" cy="26" rx="4.3" ry="2.7" fill="none" stroke="#7a5da8" stroke-width="0.5" opacity="0.6"/>

  <!-- costura central, onde a mascara encontra a pele -->
  <line x1="32" y1="8" x2="32" y2="55" stroke="#241f33" stroke-width="0.7" opacity="0.55"/>
  <g stroke="#6a4f92" stroke-width="0.6" stroke-linecap="round" opacity="0.6">
    <line x1="29.7" y1="30.5" x2="34.3" y2="33.5"/>
    <line x1="29.7" y1="38.5" x2="34.3" y2="41.5"/>
    <line x1="29.7" y1="46" x2="34.3" y2="49"/>
  </g>

  <!-- cabelo, por cima da mascara, caindo sobre a quebra -->
  <path d="M 14 17 C 17 8, 25 4, 32 6 C 39 4, 47 8, 50 17
           C 46 12.5, 41 10, 36 10.5 C 34.5 9, 33 9.5, 32 11
           C 31 9.5, 29.5 9, 28 10.5 C 23 10, 18 12.5, 14 17 Z"
        fill="#0c0a10"/>
  <path d="M 18 13 L 15 18 M 24 9.5 L 22 15 M 40 9.5 L 42 15 M 46 13 L 49 18"
        stroke="#0c0a10" stroke-width="1.3" stroke-linecap="round"/>
  <path d="M 20.5 11 C 18.5 15, 16.8 19, 15.5 23" stroke="#0c0a10" stroke-width="1.6" stroke-linecap="round" fill="none"/>
  <path d="M 26 9.5 C 24.5 13, 23.3 16.5, 22.7 20" stroke="#0c0a10" stroke-width="1.3" stroke-linecap="round" fill="none"/>
</svg>
