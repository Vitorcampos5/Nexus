<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Leyn</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IM+Fell+English:ital@0;1&display=swap">
<style>
  :root {
    color-scheme: light;
    --bg: #e8e4e9;
    --ink: #21171d;
    --muted: #574a53;
    --line: #a99faf;
    --on-bg: #2a1420;
    --on-ink: #f0e4cc;
    --focus: #8a5a12;
    --accent: #8a5a12;
  }
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) {
      color-scheme: dark;
      --bg: #0e0709;
      --ink: #eadfcf;
      --muted: #a99b93;
      --line: #47313a;
      --on-bg: #c9a24e;
      --on-ink: #1a0e10;
      --focus: #c9a24e;
      --accent: #c9a24e;
    }
  }
  :root[data-theme="dark"] {
    color-scheme: dark;
    --bg: #0e0709;
    --ink: #eadfcf;
    --muted: #a99b93;
    --line: #47313a;
    --on-bg: #c9a24e;
    --on-ink: #1a0e10;
    --focus: #c9a24e;
    --accent: #c9a24e;
  }

  * { box-sizing: border-box; }
  html { -webkit-text-size-adjust: 100%; }
  body {
    margin: 0;
    min-height: 100vh;
    min-height: 100dvh;
    display: grid;
    align-content: center;
    justify-items: center;
    padding: 16px;
    background: var(--bg);
    color: var(--ink);
    font-family: "IM Fell English", Georgia, "Times New Roman", serif;
    font-size: 17px;
    line-height: 1.5;
  }
  main { width: min(100%, 560px, max(280px, calc((100vh - 200px) * 0.8))); }
  @supports (height: 100dvh) {
    main { width: min(100%, 560px, max(280px, calc((100dvh - 200px) * 0.8))); }
  }

  .stage {
    position: relative;
    width: 100%;
    aspect-ratio: 560 / 700;
    overflow: hidden;
    border-radius: 20px;
    background:
      radial-gradient(ellipse 70% 46% at 50% 24%, rgba(150, 30, 52, .32), rgba(150, 30, 52, 0) 100%),
      linear-gradient(180deg, #2a0e1b 0%, #170811 55%, #0d0509 100%);
    box-shadow: inset 0 0 0 1px rgba(255, 255, 255, .06);
    isolation: isolate;
  }
  .stage::after {
    content: "";
    position: absolute;
    inset: 0;
    z-index: 1;
    pointer-events: none;
    background: radial-gradient(ellipse 80% 70% at 50% 42%, rgba(8, 3, 6, 0) 58%, rgba(8, 3, 6, .5) 100%);
  }
  .stage canvas {
    position: absolute;
    inset: 0;
    width: 100%;
    height: 100%;
    display: block;
  }
  .stage h1 {
    position: absolute;
    z-index: 2;
    left: 20px;
    top: 14px;
    margin: 0;
    font-size: 1.5rem;
    font-weight: 400;
    font-style: italic;
    color: #eadfcf;
    text-shadow: 0 1px 10px rgba(0, 0, 0, .7);
    pointer-events: none;
  }
  .stage .fallback {
    display: none;
    position: absolute;
    height: auto;
    transform-origin: 50% 100%;
    animation: breathe 4.6s ease-in-out infinite;
  }
  .stage.no-gl canvas.gl { display: none; }
  .stage.no-gl .fallback { display: block; }
  @keyframes breathe {
    0%, 100% { transform: translateY(0) scale(1); }
    50% { transform: translateY(-.5%) scale(1.008); }
  }

  .controls { margin-top: 18px; display: grid; gap: 14px; }
  .row { display: flex; flex-wrap: wrap; align-items: center; gap: 10px; }
  .chip {
    font: inherit;
    min-height: 44px;
    padding: 0 18px;
    border-radius: 999px;
    border: 1px solid var(--line);
    background: transparent;
    color: var(--ink);
    cursor: pointer;
    touch-action: manipulation;
    transition: background-color .18s, color .18s, border-color .18s;
  }
  .chip[aria-pressed="true"] {
    background: var(--on-bg);
    border-color: var(--on-bg);
    color: var(--on-ink);
  }
  .chip:focus-visible, .speed input:focus-visible {
    outline: 2px solid var(--focus);
    outline-offset: 3px;
  }
  .speed { display: flex; align-items: center; gap: 12px; flex: 1 1 200px; min-width: 180px; }
  .speed input { flex: 1; min-width: 0; accent-color: var(--accent); height: 44px; margin: 0; }
  .hint { margin: 0; font-size: .95rem; color: var(--muted); }

  @media (prefers-reduced-motion: reduce) {
    .stage .fallback { animation: none; }
    .chip { transition: none; }
  }
</style>
</head>
<body>
<main>
  <section class="stage" id="stage">
    <h1>Leyn</h1>
    <canvas class="bg" aria-hidden="true"></canvas>
    <canvas class="gl" role="img" aria-label="Retrato animado de Leyn: cabelo longo e negro, olhos vermelhos, armadura escura com detalhes dourados e uma espada dourada"></canvas>
    <canvas class="fg" aria-hidden="true"></canvas>
    <img class="fallback" alt="Retrato de Leyn: cabelo longo e negro, olhos vermelhos, armadura escura com detalhes dourados e uma espada dourada">
  </section>

  <div class="controls">
    <div class="row">
      <button class="chip" id="play" type="button">Pausar</button>
      <label class="speed"><span>Ritmo</span><input id="speed" type="range" min="0.4" max="2" step="0.05" value="1"></label>
    </div>
    <div class="row" role="group" aria-label="Movimentos">
      <button class="chip" type="button" data-key="breath" aria-pressed="true">Respirar</button>
      <button class="chip" type="button" data-key="hair" aria-pressed="true">Cabelo</button>
      <button class="chip" type="button" data-key="cape" aria-pressed="true">Capa</button>
      <button class="chip" type="button" data-key="eyes" aria-pressed="true">Olhos</button>
      <button class="chip" type="button" data-key="gems" aria-pressed="true">Brilhos</button>
    </div>
    <p class="hint">Liga ou desliga cada movimento.</p>
  </div>
</main>

  /* ---------- estado e controles ---------- */
  const playBtn = document.getElementById('play');
  const speedInput = document.getElementById('speed');
  const chips = Array.from(document.querySelectorAll('.chip[data-key]'));
  const reduceMotion = matchMedia('(prefers-reduced-motion: reduce)').matches;
  const S = { t: reduceMotion ? 0.9 : 0, playing: !reduceMotion, speed: 1 };
  const target = { breath: 1, hair: 1, cape: 1, eyes: 1, gems: 1 };
  const amt = { breath: 1, hair: 1, cape: 1, eyes: 1, gems: 1 };

  function syncPlay() { playBtn.textContent = S.playing ? 'Pausar' : 'Reproduzir'; }
  playBtn.addEventListener('click', () => { S.playing = !S.playing; syncPlay(); });
  speedInput.addEventListener('input', () => { S.speed = parseFloat(speedInput.value) || 1; });
  chips.forEach((chip) => chip.addEventListener('click', () => {
    const on = chip.getAttribute('aria-pressed') !== 'true';
    chip.setAttribute('aria-pressed', on ? 'true' : 'false');
    target[chip.dataset.key] = on ? 1 : 0;
  }));
  function applyHash() {
    const m = /[#&]t=([\d.]+)/.exec(location.hash);
    if (m) { S.t = parseFloat(m[1]); S.playing = false; syncPlay(); }
    const g = /[#&]gain=([\d.]+)/.exec(location.hash);   // ajuste de amplitude (uso interno)
    if (g) window.__gain = parseFloat(g[1]);
  }
  addEventListener('hashchange', applyHash);
  syncPlay();
  applyHash();

  /* ---------- geração do GLSL ---------- */
  const f = (n) => { const s = String(n); return /[.e]/.test(s) ? s : s + '.0'; };
  const v2 = (a) => 'vec2(' + f(a[0]) + ', ' + f(a[1]) + ')';
  const v4 = (a) => 'vec4(' + f(a[0]) + ', ' + f(a[1]) + ', ' + f(a[2]) + ', ' + f(a[3]) + ')';

  function regionExpr(r, pv) {
    const xr = r.xr || [NEG, NEG + 1], xf = r.xf || [POS - 1, POS];
    const yr = r.yr || [NEG, NEG + 1], yf = r.yf || [POS - 1, POS];
    const hp = r.hp || [0, 0, -10, 1];
    return 'region(' + pv + ', ' + v4([xr[0], xr[1], xf[0], xf[1]]) + ', ' +
      v4([yr[0], yr[1], yf[0], yf[1]]) + ', ' + v4(hp) + ')';
  }
  function weightExpr(w, ramp) {
    const list = Array.isArray(w) ? w : [w];
    let e = list.map((r) => regionExpr(r, 'p')).reduce((a, b) => 'max(' + a + ', ' + b + ')');
    if (ramp) e = '(' + e + ') * smoothstep(' + f(ramp.r[0]) + ', ' + f(ramp.r[1]) + ', length(p - ' + v2(ramp.c) + '))';
    return e;
  }
  const GAIN = { breath: 'uAmt.x', hair: 'uAmt.y', cape: 'uAmt.z' };

  function effectGLSL(e, i) {
    const w = 'w' + i, g = GAIN[e.gain];
    let s = '  float ' + w + ' = ' + weightExpr(e.w, e.ramp) + ';\n';
    if (e.type === 'shift') {
      s += '  d += vec2(' + f(e.dx || 0) + ', ' + f(e.dy || 0) + ') * sin(t * ' + f(e.freq) + ' + ' + f(e.phase || 0) + ') * ' + w + ' * ' + g + ' * uGain;\n';
    } else if (e.type === 'rot') {
      s += '  d += (rotAbout(p, ' + v2(e.pivot) + ', ' + f(e.amp) + ' * sin(t * ' + f(e.freq) + ' + ' + f(e.phase || 0) + ') * ' + g + ' * uGain) - p) * ' + w + ';\n';
    } else if (e.type === 'wave') {
      const other = e.axis === 'x' ? 'y' : 'x';
      s += '  d.' + e.axis + ' += ' + f(e.amp) + ' * sin(t * ' + f(e.freq) + ' + ' + f(e.k) + ' * p.' + other + ' + ' + f(e.phase || 0) + ') * ' + w + ' * ' + g + ' * uGain;\n';
    }
    return s;
  }

  function warpGLSL(c) {
    const R = c.rig;
    const eyes = R.eyes.map((e, i) => `
  vec2 e${i} = (p - ${v2([e[0], e[1]])}) / ${v2([e[2], e[3]])};
  float k${i} = exp(-(e${i}.x * e${i}.x * e${i}.x * e${i}.x + e${i}.y * e${i}.y));
  d.y += (${f(R.eyes[i][1])} - p.y) * k${i} * 0.86 * uBlink;`).join('');
    return `
uniform float uTime;
uniform vec4  uAmt;
uniform float uBlink;
uniform float uGain;
uniform vec4  uStage;

float region(vec2 p, vec4 rx, vec4 ry, vec4 hp) {
  float wx = smoothstep(rx.x, rx.y, p.x) * (1.0 - smoothstep(rx.z, rx.w, p.x));
  float wy = smoothstep(ry.x, ry.y, p.y) * (1.0 - smoothstep(ry.z, ry.w, p.y));
  float wh = smoothstep(-hp.w, hp.w, dot(p, hp.xy) - hp.z);
  return wx * wy * wh;
}

vec2 rotAbout(vec2 p, vec2 c, float a) {
  float s = sin(a);
  float k = cos(a);
  vec2 r = p - c;
  return c + vec2(k * r.x - s * r.y, s * r.x + k * r.y);
}

vec2 warp(vec2 p) {
  float t = uTime;
  vec2 d = vec2(0.0);
${R.effects.map(effectGLSL).join('')}
  // piscada: achata a regiao dos olhos na vertical
${eyes}
  return p + d;
}

vec4 toClip(vec2 p) {
  vec2 s = (p * ${f(c.sc)} + uStage.zw) / uStage.xy;
  return vec4(s.x * 2.0 - 1.0, 1.0 - s.y * 2.0, 0.0, 1.0);
}
`;
  }

  const meshVS = (c) => `

varying vec2 vUV;
${warpGLSL(c)}
void main() {
  vUV = aPos / vec2(${f(c.w)}, ${f(c.h)});
  gl_Position = toClip(warp(aPos));
}`;

  const glowVS = (c) => `
attribute vec2 aCenter;
attribute vec2 aCorner;
attribute vec4 aColor;
attribute vec4 aParams;
uniform float uEyes;
uniform float uGems;
varying vec2 vC;
varying vec4 vCol;
varying float vStar;
${warpGLSL(c)}
void main() {
  vec2 shift = warp(aCenter) - aCenter;
  vec2 p = aCenter + aCorner * aParams.x + shift;
  float mode = floor(aParams.w / 10.0 + 0.5);
  float grp = aParams.w - mode * 10.0;
  float amount = mix(mix(uEyes, uGems, step(0.5, grp)), 1.0, step(1.5, grp));
  float dim = 1.0 - uBlink * (1.0 - step(0.5, grp));
  float s1 = sin(uTime * aParams.y + aParams.z);
  float sine = 0.78 + 0.22 * (0.6 * s1 + 0.4 * sin(uTime * aParams.y * 1.73 + aParams.z * 2.1));
  float twinkle = pow(max(0.0, s1), 30.0);
  float flare = 0.62 + 0.12 * s1 + 0.6 * pow(max(0.0, sin(uTime * aParams.y * 1.1 + aParams.z * 3.0)), 24.0);
  float pulse = mix(mix(sine, twinkle, step(0.5, mode)), flare, step(1.5, mode));
  vC = aCorner;
  vStar = step(0.5, mode) * (1.0 - step(1.5, mode));
  vCol = vec4(aColor.rgb, aColor.a * pulse * amount * dim);
  gl_Position = toClip(p);
}`;

  const GLOW_FS = `
precision mediump float;
varying vec2 vC;
varying vec4 vCol;
varying float vStar;
void main() {
  float r = length(vC);
  float disc = exp(-r * r * 3.6);
  float star = exp(-abs(vC.x) * abs(vC.y) * 46.0) * exp(-r * r * 1.4) + 0.5 * disc;
  float g = mix(disc, star, vStar) * (1.0 - smoothstep(0.75, 1.0, r));
  float a = g * vCol.a;
  gl_FragColor = vec4(vCol.rgb * a, a);
}`;

  /* ---------- utilidades ---------- */
  function mulberry(a) {
    return function () {
      a |= 0; a = (a + 0x6D2B79F5) | 0;
      let t = Math.imul(a ^ (a >>> 15), 1 | a);
      t = (t + Math.imul(t ^ (t >>> 7), 61 | t)) ^ t;
      return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
    };
  }
  function blinkAt(t, per) {
    let b = 0;
    const p = t % per[0];
    if (p < 0.2) b = Math.sin((p / 0.2) * Math.PI);
    const q = t % per[1];
    if (q > 0.42 && q < 0.62) b = Math.max(b, Math.sin(((q - 0.42) / 0.2) * Math.PI));
    return b;
  }

  /* ---------- o palco ---------- */
  const el = document.getElementById('stage');
  const glCanvas = el.querySelector('canvas.gl');
  const bgCanvas = el.querySelector('canvas.bg');
  const fgCanvas = el.querySelector('canvas.fg');
  const fb = el.querySelector('img.fallback');
  const bg = bgCanvas.getContext('2d');
  const fg = fgCanvas.getContext('2d');
  let gl = null, G = null;

  fb.src = CFG.src;
  fb.style.left = (CFG.ox / SW * 100) + '%';
  fb.style.top = (CFG.oy / SH * 100) + '%';
  fb.style.width = (CFG.w * CFG.sc / SW * 100) + '%';

  const rnd = mulberry(31);
  const motes = Array.from({ length: 30 }, (_, i) => ({
    front: i % 3 === 0,
    x: rnd() * SW, y: rnd() * SH, v: 5 + rnd() * 11, r: 1.1 + rnd() * 2.3,
    amp: 6 + rnd() * 16, f: 0.25 + rnd() * 0.5, p: rnd() * 6.283, a: 0.25 + rnd() * 0.45,
    kind: rnd() < 0.7 ? 0 : 1
  }));

  function useFallback() { el.classList.add('no-gl'); gl = null; }

  function initGL(img) {
    const opts = { alpha: true, premultipliedAlpha: true, antialias: false };
    gl = glCanvas.getContext('webgl2', opts);
    const isGL2 = !!gl;
    if (!gl) gl = glCanvas.getContext('webgl', opts) || glCanvas.getContext('experimental-webgl', opts);
    if (!gl) { useFallback(); return; }
    try {
      const compile = (type, src) => {
        const s = gl.createShader(type);
        gl.shaderSource(s, src); gl.compileShader(s);
        if (!gl.getShaderParameter(s, gl.COMPILE_STATUS)) throw new Error(gl.getShaderInfoLog(s));
        return s;
      };
      const program = (vs, fs, binds) => {
        const p = gl.createProgram();
        gl.attachShader(p, compile(gl.VERTEX_SHADER, vs));
        gl.attachShader(p, compile(gl.FRAGMENT_SHADER, fs));
        binds.forEach((name, i) => gl.bindAttribLocation(p, i, name));
        gl.linkProgram(p);
        if (!gl.getProgramParameter(p, gl.LINK_STATUS)) throw new Error(gl.getProgramInfoLog(p));
        const u = {};
        ['uTime', 'uAmt', 'uBlink', 'uGain', 'uStage', 'uTex', 'uEyes', 'uGems'].forEach((n) => { u[n] = gl.getUniformLocation(p, n); });
        return { p, u };
      };
      const pm = program(meshVS(CFG), MESH_FS, ['aPos']);
      const pg = program(glowVS(CFG), GLOW_FS, ['aCenter', 'aCorner', 'aColor', 'aParams']);

      // malha do sprite
      const CELL = 10;
      const cols = Math.ceil(CFG.w / CELL), rows = Math.ceil(CFG.h / CELL);
      const verts = new Float32Array((cols + 1) * (rows + 1) * 2);
      let n = 0;
      for (let j = 0; j <= rows; j++) for (let i = 0; i <= cols; i++) {
        verts[n++] = Math.min(i * CELL, CFG.w);
        verts[n++] = Math.min(j * CELL, CFG.h);
      }
      const idx = new Uint16Array(cols * rows * 6);
      n = 0;
      for (let j = 0; j < rows; j++) for (let i = 0; i < cols; i++) {
        const a = j * (cols + 1) + i, b = a + 1, c = a + cols + 1, d = c + 1;
        idx[n++] = a; idx[n++] = b; idx[n++] = c;
        idx[n++] = b; idx[n++] = d; idx[n++] = c;
      }
      const meshVB = gl.createBuffer();
      gl.bindBuffer(gl.ARRAY_BUFFER, meshVB); gl.bufferData(gl.ARRAY_BUFFER, verts, gl.STATIC_DRAW);
      const meshIB = gl.createBuffer();
      gl.bindBuffer(gl.ELEMENT_ARRAY_BUFFER, meshIB); gl.bufferData(gl.ELEMENT_ARRAY_BUFFER, idx, gl.STATIC_DRAW);

      // brilhos (quads que seguem a mesma deformação)
      const glows = CFG.rig.glows;
      const corners = [[-1, -1], [1, -1], [1, 1], [-1, 1]];
      const gd = new Float32Array(glows.length * 4 * 12);
      const gi = new Uint16Array(glows.length * 6);
      glows.forEach((g, k) => {
        corners.forEach((c, m) => {
          gd.set([g[0], g[1], c[0], c[1], g[3], g[4], g[5], g[6], g[2], g[7], g[8], g[9]], (k * 4 + m) * 12);
        });
        gi.set([0, 1, 2, 0, 2, 3].map((v) => v + k * 4), k * 6);
      });
      const glowVB = gl.createBuffer();
      gl.bindBuffer(gl.ARRAY_BUFFER, glowVB); gl.bufferData(gl.ARRAY_BUFFER, gd, gl.STATIC_DRAW);
      const glowIB = gl.createBuffer();
      gl.bindBuffer(gl.ELEMENT_ARRAY_BUFFER, glowIB); gl.bufferData(gl.ELEMENT_ARRAY_BUFFER, gi, gl.STATIC_DRAW);

      // textura: alfa pré-multiplicado; com WebGL2 dá para usar mipmaps (o sprite é grande)
      const tex = gl.createTexture();
      gl.bindTexture(gl.TEXTURE_2D, tex);
      gl.pixelStorei(gl.UNPACK_PREMULTIPLY_ALPHA_WEBGL, true);
      gl.texImage2D(gl.TEXTURE_2D, 0, gl.RGBA, gl.RGBA, gl.UNSIGNED_BYTE, img);
      if (isGL2) {
        gl.generateMipmap(gl.TEXTURE_2D);
        gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_MIN_FILTER, gl.LINEAR_MIPMAP_LINEAR);
      } else {
        gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_MIN_FILTER, gl.LINEAR);
      }
      gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_MAG_FILTER, gl.LINEAR);
      gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_WRAP_S, gl.CLAMP_TO_EDGE);
      gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_WRAP_T, gl.CLAMP_TO_EDGE);

      gl.enable(gl.BLEND);
      G = { pm, pg, meshVB, meshIB, glowVB, glowIB, meshCount: idx.length, glowCount: gi.length, tex };
    } catch (err) {
      console.error('WebGL:', err);
      useFallback();
    }
  }

  glCanvas.addEventListener('webglcontextlost', (e) => { e.preventDefault(); useFallback(); });

  function common(u, blink) {
    gl.uniform1f(u.uTime, S.t);
    gl.uniform4f(u.uAmt, amt.breath, amt.hair, amt.cape, 0);
    gl.uniform1f(u.uBlink, blink);
    gl.uniform1f(u.uGain, window.__gain || 1);
    gl.uniform4f(u.uStage, SW, SH, CFG.ox, CFG.oy);
  }

  function drawGL(blink) {
    gl.viewport(0, 0, glCanvas.width, glCanvas.height);
    gl.clearColor(0, 0, 0, 0);
    gl.clear(gl.COLOR_BUFFER_BIT);

    // sprite
    gl.useProgram(G.pm.p);
    common(G.pm.u, blink);
    gl.activeTexture(gl.TEXTURE0);
    gl.bindTexture(gl.TEXTURE_2D, G.tex);
    gl.uniform1i(G.pm.u.uTex, 0);
    gl.blendFunc(gl.ONE, gl.ONE_MINUS_SRC_ALPHA);
    gl.bindBuffer(gl.ARRAY_BUFFER, G.meshVB);
    gl.bindBuffer(gl.ELEMENT_ARRAY_BUFFER, G.meshIB);
    for (let i = 1; i < 4; i++) gl.disableVertexAttribArray(i);
    gl.enableVertexAttribArray(0);
    gl.vertexAttribPointer(0, 2, gl.FLOAT, false, 8, 0);
    gl.drawElements(gl.TRIANGLES, G.meshCount, gl.UNSIGNED_SHORT, 0);

    // brilhos (mistura "screen")
    gl.useProgram(G.pg.p);
    common(G.pg.u, blink);
    gl.uniform1f(G.pg.u.uEyes, amt.eyes);
    gl.uniform1f(G.pg.u.uGems, amt.gems);
    gl.blendFunc(gl.ONE, gl.ONE_MINUS_SRC_COLOR);
    gl.bindBuffer(gl.ARRAY_BUFFER, G.glowVB);
    gl.bindBuffer(gl.ELEMENT_ARRAY_BUFFER, G.glowIB);
    for (let i = 0; i < 4; i++) gl.enableVertexAttribArray(i);
    gl.vertexAttribPointer(0, 2, gl.FLOAT, false, 48, 0);
    gl.vertexAttribPointer(1, 2, gl.FLOAT, false, 48, 8);
    gl.vertexAttribPointer(2, 4, gl.FLOAT, false, 48, 16);
    gl.vertexAttribPointer(3, 4, gl.FLOAT, false, 48, 32);
    gl.drawElements(gl.TRIANGLES, G.glowCount, gl.UNSIGNED_SHORT, 0);
  }

  function drawMotes(ctx, canvas, front) {
    const k = canvas.width / SW;
    ctx.setTransform(k, 0, 0, k, 0, 0);
    ctx.clearRect(0, 0, SW, SH);
    const span = SH + 40;
    for (const m of motes) {
      if (m.front !== front) continue;
      const y = (((m.y - m.v * S.t) % span) + span) % span - 20;
      const x = m.x + Math.sin(S.t * m.f + m.p) * m.amp;
      const edge = Math.max(0, Math.min(1, y / 80, (SH - y) / 80));
      const al = m.a * (0.55 + 0.45 * Math.sin(S.t * 0.9 + m.p)) * edge * (front ? 0.8 : 1);
      if (al <= 0.005) continue;
      const rgb = m.kind === 0 ? '214,58,70' : '232,214,190';
      ctx.fillStyle = 'rgba(' + rgb + ',' + (al * 0.16).toFixed(3) + ')';
      ctx.beginPath(); ctx.arc(x, y, m.r * 3.4, 0, Math.PI * 2); ctx.fill();
      ctx.fillStyle = 'rgba(' + rgb + ',' + al.toFixed(3) + ')';
      ctx.beginPath(); ctx.arc(x, y, m.r, 0, Math.PI * 2); ctx.fill();
    }
  }

  function drawBack() {
    drawMotes(bg, bgCanvas, false);
    // halo atras da cabeça, pulsando com a respiração
    const k = bgCanvas.width / SW;
    bg.setTransform(k, 0, 0, k, 0, 0);
    const pulse = 0.92 + 0.08 * Math.sin(S.t * 1.25) * amt.breath;
    const cx = 270, cy = 168, R = 300;
    const g = bg.createRadialGradient(cx, cy, 0, cx, cy, R);
    g.addColorStop(0, 'rgba(196,44,66,' + (0.30 * pulse).toFixed(3) + ')');
    g.addColorStop(0.45, 'rgba(120,24,46,' + (0.20 * pulse).toFixed(3) + ')');
    g.addColorStop(1, 'rgba(120,24,46,0)');
    bg.globalCompositeOperation = 'destination-over';
    bg.fillStyle = g;
    bg.fillRect(0, 0, SW, SH);
    bg.globalCompositeOperation = 'source-over';
  }

  function render() {
    drawBack();
    drawMotes(fg, fgCanvas, true);
    if (gl && G) drawGL(blinkAt(S.t, CFG.blink) * amt.eyes);
  }

  function resize() {
    const r = el.getBoundingClientRect();
    const dpr = Math.min(window.devicePixelRatio || 1, 3);
    const w = Math.max(2, Math.round(r.width * dpr));
    const h = Math.max(2, Math.round(r.height * dpr));
    [glCanvas, bgCanvas, fgCanvas].forEach((c) => {
      if (c.width !== w) c.width = w;
      if (c.height !== h) c.height = h;
    });
  }
  new ResizeObserver(resize).observe(el);
  resize();

  const img = new Image();
  img.onload = () => initGL(img);
  img.onerror = useFallback;
  img.src = CFG.src;

  /* ---------- laço principal ---------- */
  let last = performance.now();
  function frame(now) {
    const dt = Math.min(0.05, Math.max(0, (now - last) / 1000));
    last = now;
    if (S.playing) S.t += dt * S.speed;
    const k = 1 - Math.exp(-dt * 9);
    for (const key in amt) amt[key] += (target[key] - amt[key]) * k;
    render();
    requestAnimationFrame(frame);
  }
  requestAnimationFrame((now) => { last = now; frame(now); });
})();
</script>
</body>
</html>
