<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100">
  <defs>
    <linearGradient id="drillGold" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%"  stop-color="#F3D989"/>
      <stop offset="50%" stop-color="#C4A35A"/>
      <stop offset="100%" stop-color="#8B6B2E"/>
    </linearGradient>
  </defs>

  <!-- corpo cônico da broca — proporção (altura ~1.6x a largura da base) tirada do modelo real -->
  <path d="M50,10 L76,90 L24,90 Z" fill="url(#drillGold)" stroke="#4A3818" stroke-width="2" stroke-linejoin="round"/>

  <!-- linhas de rosca em espiral — número e afunilamento também baseados no modelo -->
  <path d="M28.5,76 Q50,80 71.5,76" fill="none" stroke="#4A3818" stroke-width="2.3" stroke-linecap="round"/>
  <path d="M32.4,64 Q50,67.5 67.6,64" fill="none" stroke="#4A3818" stroke-width="2.2" stroke-linecap="round"/>
  <path d="M36,53 Q50,56 64,53"       fill="none" stroke="#4A3818" stroke-width="2.1" stroke-linecap="round"/>
  <path d="M38.9,44 Q50,46.5 61.1,44" fill="none" stroke="#4A3818" stroke-width="2"   stroke-linecap="round"/>
  <path d="M41.5,36 Q50,38 58.5,36"   fill="none" stroke="#4A3818" stroke-width="1.8" stroke-linecap="round"/>

  <!-- pequeno encaixe/base abaixo do corpo principal, como no modelo original -->
  <path d="M40,90 L60,90 L55,97 L45,97 Z" fill="url(#drillGold)" stroke="#4A3818" stroke-width="2" stroke-linejoin="round"/>
</svg>
