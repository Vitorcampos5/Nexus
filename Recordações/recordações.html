<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Recordações</title>
<meta name="description" content="Álbuns de recordações vividas através de jogos.">
<link rel="icon" type="image/svg+xml" href="recordacoes-favicon.svg">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght@0,9..144,600;1,9..144,500&family=Caveat:wght@500;600&family=EB+Garamond:ital,wght@0,400;1,400&family=Cinzel:wght@400;600&family=Share+Tech+Mono&display=swap" rel="stylesheet">
<style>
  :root{
    --bg:#14100D;
    --bg2:#1B1510;
    --panel:#221A14;
    --panel2:#2A2016;
    --panel-line: rgba(94,196,187,0.22);
    --accent:#5EC4BB;
    --accent-soft: rgba(94,196,187,0.14);
    --accent-dim: rgba(94,196,187,0.42);
    --text:#EDE3D2;
    --dim: rgba(237,227,210,0.52);
    --dimmer: rgba(237,227,210,0.28);
    --paper:#F2ECDD;
    --caption-ink:#F0DFB8;
  }

  *{ margin:0; padding:0; box-sizing:border-box; }

  html,body{
    background:
      radial-gradient(ellipse 80% 50% at 50% -10%, rgba(94,196,187,0.09), transparent 60%),
      var(--bg);
    color:var(--text);
    min-height:100vh;
    font-family:'EB Garamond', serif;
  }

  body{
    display:flex;
    flex-direction:column;
    align-items:center;
    padding:min(9vh,80px) 20px 100px;
    position:relative;
  }

  .nexus-return{
    display:inline-block; position:absolute; top:0; left:0; z-index:10;
    font-family:'Cinzel', serif; font-size:.58rem; letter-spacing:.28em; text-transform:uppercase;
    text-decoration:none; color:var(--dim); padding:1rem 1.2rem; background:none;
  }
  .nexus-return:hover{ color:var(--accent); }

  .ornament{
    display:flex; align-items:center; gap:14px;
    color:var(--accent-dim); margin-bottom:20px; user-select:none;
  }
  .ornament .rule{ width:56px; height:1px; background:linear-gradient(90deg, transparent, var(--accent-dim)); }
  .ornament .rule.right{ background:linear-gradient(90deg, var(--accent-dim), transparent); }
  .ornament .diamond{ width:6px; height:6px; background:var(--accent); transform:rotate(45deg); box-shadow:0 0 8px var(--accent-dim); }

  h1{
    font-family:'Fraunces', serif;
    font-optical-sizing:auto;
    font-weight:600;
    font-size:clamp(2.2rem, 6vw, 3.2rem);
    letter-spacing:0.01em;
    color:var(--text);
    text-shadow:0 0 30px rgba(94,196,187,0.18);
  }

  .tagline{
    font-style:italic;
    font-weight:400;
    color:var(--dim);
    font-size:1.05rem;
    margin-top:10px;
    text-align:center;
    max-width:38ch;
  }

  .meta-line{
    font-family:'Share Tech Mono', monospace;
    font-size:0.7rem;
    letter-spacing:0.1em;
    text-transform:uppercase;
    color:var(--dimmer);
    margin-top:14px;
    margin-bottom:36px;
  }

  .origem{
    display:flex;
    flex-direction:column;
    align-items:center;
    gap:12px;
    margin-bottom:40px;
  }
  .origem-foto{
    width:112px; height:112px;
    border-radius:50%;
    object-fit:cover;
    border:5px solid var(--paper);
    box-shadow:0 14px 30px rgba(0,0,0,.55), 0 0 0 1px var(--panel-line);
    transition:box-shadow .35s ease;
  }
  .origem-foto:hover{
    box-shadow:0 14px 34px rgba(0,0,0,.6), 0 0 0 1px var(--accent-dim);
  }
  .origem-legenda{
    font-family:'Caveat', cursive;
    font-weight:500;
    font-size:1.3rem;
    color:var(--caption-ink);
    text-align:center;
  }

  main{
    width:100%;
    max-width:960px;
    display:flex;
    flex-direction:column;
    gap:14px;
  }

  /* ── Álbum (card fechado) ── */
  .album-card{
    all:unset;
    display:flex;
    align-items:center;
    gap:22px;
    width:100%;
    background:linear-gradient(180deg, var(--panel), var(--bg2));
    border:1px solid var(--panel-line);
    border-radius:6px;
    padding:20px 26px;
    cursor:pointer;
    box-sizing:border-box;
    transition:border-color .35s ease, box-shadow .35s ease;
  }
  .album-card:hover, .album-card:focus-visible{
    border-color:var(--accent-dim);
    box-shadow:0 0 40px -16px rgba(94,196,187,0.4);
  }
  .album-card:focus-visible{ outline:2px solid var(--accent); outline-offset:3px; }

  .album-stack{
    position:relative;
    flex:0 0 auto;
    width:120px;
    height:104px;
  }
  .stack-photo{
    position:absolute; top:50%; left:50%;
    width:100px; height:100px;
    object-fit:cover;
    border-radius:2px;
    border:4px solid var(--paper);
    box-shadow:0 10px 22px rgba(0,0,0,.5);
    transition:transform .4s ease;
  }
  .stack-photo.s1{ transform:translate(-50%,-50%) rotate(-10deg) translate(-26px, 6px); z-index:1; }
  .stack-photo.s2{ transform:translate(-50%,-50%) rotate(8deg) translate(24px, -6px); z-index:2; }
  .stack-photo.s3{ transform:translate(-50%,-50%) rotate(-2deg) translate(-2px, 2px); z-index:3; }
  .album-card:hover .stack-photo.s1{ transform:translate(-50%,-50%) rotate(-16deg) translate(-38px, 10px); }
  .album-card:hover .stack-photo.s2{ transform:translate(-50%,-50%) rotate(13deg) translate(34px, -12px); }
  .album-card:hover .stack-photo.s3{ transform:translate(-50%,-50%) rotate(-3deg) translate(-2px, -6px) scale(1.03); }

  .album-info{
    flex:1 1 auto;
    display:flex;
    flex-direction:column;
    gap:4px;
    text-align:left;
  }
  .album-name{
    font-family:'Fraunces', serif;
    font-weight:600;
    font-size:1.4rem;
    color:var(--text);
  }
  .album-count{
    font-family:'Share Tech Mono', monospace;
    font-size:.7rem;
    letter-spacing:.08em;
    text-transform:uppercase;
    color:var(--dim);
  }

  .album-chevron{
    flex:0 0 auto;
    width:16px; height:16px;
    fill:var(--dim);
    transition:transform .35s ease;
  }
  .album-card[aria-expanded="true"] .album-chevron{ transform:rotate(180deg); fill:var(--accent); }

  /* ── Dica secreta (só no card de Gurren Lagann) ──
     Mesmo verde do gatilho da broca em nexus.html — pra quem prestar
     atenção, o link entre "energia espiral" e "tempestade" começa aqui. */
  .album-card.tem-dica{ flex-wrap:wrap; row-gap:6px; }
  .segredo-dica{
    flex-basis:100%;
    padding-left:142px;
    font-family:'Caveat', cursive;
    font-size:1.05rem;
    line-height:1.4;
    text-align:left;
    color:#39FF7A;
    text-shadow:0 0 8px rgba(57,255,122,.55);
    animation:dicaPulsar 3.2s ease-in-out infinite;
    pointer-events:none;
  }
  @keyframes dicaPulsar{ 0%,100%{ opacity:.5; } 50%{ opacity:1; } }
  @media (max-width:680px){
    .segredo-dica{ padding-left:0; margin-top:2px; font-size:.95rem; }
  }

  /* ── Painel da Canção da Tempestade — mesmo componente usado em
     OOT/MM/nexus (ver Lib/cancao-tempestade.js). Replicado aqui porque
     esta página tem seu próprio sistema de estilos e não compartilha o
     style.css do diário TLOZ. ── */
  .cancao-painel {
    position: fixed; left: 1.2rem; bottom: 1.2rem; z-index: 700;
    width: 40px; height: 40px; border-radius: 50%;
    display: flex; align-items: center; justify-content: center;
    background: rgba(10,10,14,.85);
    border: 1px solid rgba(184,184,192,.35);
    transition: border-color .4s ease, box-shadow .4s ease;
    animation: cancaoFloat 4s ease-in-out infinite;
  }
  @keyframes cancaoFloat { 0%,100%{transform:translateY(0)} 50%{transform:translateY(-6px)} }
  .cancao-nota {
    width: 18px; height: 18px; fill: none;
    stroke: #B8B8C0; stroke-width: 1.6;
    stroke-linecap: round; stroke-linejoin: round;
    transition: stroke .4s ease, filter .4s ease;
  }
  .cancao-painel.completa { border-color: rgba(232,137,26,.65); box-shadow: 0 0 18px rgba(232,137,26,.5); }
  .cancao-painel.completa .cancao-nota { stroke: #FFD98A; filter: drop-shadow(0 0 7px rgba(255,217,138,.85)); }
  .cancao-painel.piscando { cursor: pointer; animation: cancaoFloat 4s ease-in-out infinite, cancaoPiscar 1.6s ease-in-out infinite; }
  @keyframes cancaoPiscar {
    0%, 100% { box-shadow: 0 0 0 rgba(184,184,192,0); border-color: rgba(184,184,192,.35); }
    50%      { box-shadow: 0 0 16px rgba(184,184,192,.85); border-color: rgba(184,184,192,.9); }
  }

  /* ── Grade de fotos (aberta) ── */
  .album-grid{
    max-height:0;
    overflow:hidden;
    opacity:0;
    display:grid;
    grid-template-columns:repeat(auto-fill, minmax(110px, 1fr));
    gap:8px;
    margin-top:0;
    transition:max-height .5s ease, opacity .4s ease, margin-top .5s ease, margin-bottom .5s ease;
  }
  .album-grid.open{
    max-height:5000px;
    opacity:1;
    margin-top:16px;
    margin-bottom:26px;
  }

  .photo-item{
    all:unset;
    position:relative;
    display:block;
    aspect-ratio:1/1;
    border-radius:4px;
    overflow:hidden;
    cursor:pointer;
    background:#000;
    border:1px solid var(--panel-line);
    box-sizing:border-box;
    transition:transform .2s ease, border-color .3s ease;
  }
  .photo-item:hover, .photo-item:focus-visible{
    transform:translateY(-3px);
    border-color:var(--accent-dim);
  }
  .photo-item:focus-visible{ outline:2px solid var(--accent); outline-offset:2px; }
  .photo-item img{ width:100%; height:100%; object-fit:cover; display:block; }
  .photo-item .photo-caption-src{ display:none; }

  .video-badge{
    position:absolute; top:6px; right:6px; z-index:2;
    display:flex; align-items:center; gap:4px;
    padding:3px 7px;
    border-radius:20px;
    background:rgba(20,16,13,0.75);
    border:1px solid var(--accent-dim);
    backdrop-filter:blur(3px);
    font-family:'Cinzel', serif;
    font-size:0.52rem;
    letter-spacing:0.1em;
    text-transform:uppercase;
    color:var(--text);
    pointer-events:none;
  }
  .video-badge svg{ width:8px; height:8px; fill:var(--accent); flex:0 0 auto; }

  footer{
    margin-top:60px;
    font-family:'Cinzel', serif;
    font-size:0.66rem;
    letter-spacing:0.14em;
    color:var(--dimmer);
    text-transform:uppercase;
    text-align:center;
  }

  /* ── Lightbox ── */
  .lightbox{
    position:fixed; inset:0; z-index:100000;
    display:none;
    align-items:center; justify-content:center;
    overscroll-behavior:contain;
  }
  .lightbox.open{ display:flex; }
  .lightbox-scrim{
    position:absolute; inset:0;
    background:
      radial-gradient(ellipse at 50% 40%, rgba(94,196,187,0.07), transparent 60%),
      rgba(8,6,4,0.94);
    backdrop-filter:blur(3px);
  }
  .lightbox-shell{
    position:relative; z-index:1;
    max-width:min(92vw, 920px);
    max-height:90vh;
    display:flex;
    flex-direction:column;
    align-items:center;
    gap:18px;
  }
  .lb-media{
    position:relative;
    display:flex;
    align-items:center;
    justify-content:center;
    max-height:74vh;
  }
  #lbImg{
    max-width:100%; max-height:74vh;
    border-radius:2px;
    border:7px solid var(--paper);
    box-shadow:0 24px 60px rgba(0,0,0,.6);
    display:block;
  }
  #lbVideo{
    max-width:100%; max-height:74vh;
    border-radius:4px;
    border:1px solid var(--panel-line);
    box-shadow:0 24px 60px rgba(0,0,0,.6);
    background:#000;
    display:block;
  }
  #lbImg[hidden], #lbVideo[hidden]{ display:none; }
  .lb-caption{
    font-family:'Caveat', cursive;
    font-weight:500;
    font-size:1.55rem;
    line-height:1.35;
    color:var(--caption-ink);
    text-align:center;
    max-width:62ch;
    padding:0 12px;
  }
  .lb-caption.is-empty{
    font-family:'EB Garamond', serif;
    font-style:italic;
    font-weight:400;
    font-size:0.95rem;
    color:var(--dimmer);
  }

  .lb-close, .lb-nav{
    all:unset;
    position:absolute;
    z-index:2;
    width:44px; height:44px;
    border-radius:50%;
    background:rgba(20,16,13,0.65);
    border:1px solid var(--panel-line);
    color:var(--text);
    display:flex; align-items:center; justify-content:center;
    cursor:pointer;
    font-size:1.3rem;
    line-height:1;
    box-sizing:border-box;
    transition:background .25s ease, border-color .25s ease;
  }
  .lb-close:hover, .lb-nav:hover, .lb-close:focus-visible, .lb-nav:focus-visible{
    background:var(--accent-soft);
    border-color:var(--accent-dim);
  }
  .lb-close:focus-visible, .lb-nav:focus-visible{ outline:2px solid var(--accent); outline-offset:2px; }
  .lb-close{ top:18px; right:18px; }
  .lb-prev{ left:14px; top:50%; transform:translateY(-50%); }
  .lb-next{ right:14px; top:50%; transform:translateY(-50%); }

  @media (max-width:680px){
    .album-card{ gap:16px; padding:16px 18px; }
    .album-stack{ width:96px; height:90px; }
    .stack-photo{ width:82px; height:82px; }
    .album-name{ font-size:1.18rem; }
    .album-grid{ grid-template-columns:repeat(auto-fill, minmax(84px, 1fr)); gap:6px; }
    .lb-prev{ left:6px; } .lb-next{ right:6px; }
    .lb-prev, .lb-next{ width:38px; height:38px; font-size:1.1rem; }
    .lb-close{ top:8px; right:8px; }
    /* botões pequenos de propósito (não brigam com a foto) — a área de
       toque ao redor é maior do que parece, só invisível */
    .lb-close::after, .lb-nav::after{ content:''; position:absolute; inset:-8px; }
  }

  @media (max-width:400px){
    body{ padding:min(7vh,60px) 14px 90px; }
    .album-card{ gap:12px; padding:14px 14px; }
    .album-stack{ width:82px; height:78px; }
    .stack-photo{ width:70px; height:70px; }
    .album-grid{ grid-template-columns:repeat(auto-fill, minmax(76px, 1fr)); gap:5px; }
  }

  @media (prefers-reduced-motion: reduce){
    .stack-photo, .album-grid, .photo-item, .album-chevron, .album-card{ transition:none; }
    .segredo-dica{ animation:none; opacity:.85; }
  }

  /* ── Esfera do Dragão (easter egg secreto) ── */
  #dragonball-sphere{ display:none; position:fixed; right:1.2rem; bottom:1.2rem; z-index:999999; cursor:pointer; animation:dbFloat 3.4s ease-in-out infinite; }
  @keyframes dbFloat{ 0%,100%{transform:translateY(0)} 50%{transform:translateY(-8px)} }
  .db-sphere-orb{ position:relative; width:64px; height:64px; border-radius:50%;
    background:radial-gradient(circle at 32% 28%, #FFE9B0 0%, #FFC24D 18%, #E8891A 55%, #A34E08 85%, #6B3204 100%);
    box-shadow:0 0 22px rgba(232,137,26,.55), inset -6px -6px 14px rgba(0,0,0,.35), inset 4px 6px 10px rgba(255,255,255,.25);
    animation:dbSpin 9s linear infinite; }
  @keyframes dbSpin{ to{ transform:rotate(360deg); } }
  #dragonball-sphere:hover .db-sphere-orb{ box-shadow:0 0 32px rgba(232,137,26,.8), inset -6px -6px 14px rgba(0,0,0,.35), inset 4px 6px 10px rgba(255,255,255,.35); }
  .db-sphere-orb .estrela{ position:absolute; width:9px; height:9px; background:#C21818; clip-path:polygon(50% 0%, 61% 35%, 98% 35%, 68% 56%, 79% 91%, 50% 69%, 21% 91%, 32% 56%, 2% 35%, 39% 35%); filter:drop-shadow(0 1px 1px rgba(0,0,0,.55)); }
</style>

  <div class="lightbox" id="lightbox" aria-hidden="true">
    <div class="lightbox-scrim" data-close></div>

    <div class="lightbox-shell" role="dialog" aria-modal="true" aria-label="Visualização de foto">
      <div class="lb-media">
        <img id="lbImg" alt="" hidden>
        <video id="lbVideo" controls hidden></video>
      </div>
      <p class="lb-caption" id="lbCaption"></p>

  <script>
  (function(){
    // ── Álbuns: abrir/fechar ──
    document.querySelectorAll('.album-card').forEach(function(card){
      card.addEventListener('click', function(){
        var grid = document.getElementById(card.getAttribute('data-target'));
        if(!grid) return;
        var isOpen = grid.classList.toggle('open');
        card.setAttribute('aria-expanded', isOpen ? 'true' : 'false');
      });
    });

    // ── Lightbox ──
    var lightbox = document.getElementById('lightbox');
    var lbImg = document.getElementById('lbImg');
    var lbVideo = document.getElementById('lbVideo');
    var lbCaption = document.getElementById('lbCaption');
    var lbClose = document.getElementById('lbClose');
    var lbPrev = document.getElementById('lbPrev');
    var lbNext = document.getElementById('lbNext');

    var currentList = [];
    var currentIndex = -1;
    var lastFocused = null;

    function captionFor(item){
      var src = item.querySelector('.photo-caption-src');
      return src ? src.textContent.trim() : '';
    }

    function show(index){
      if(!currentList.length) return;
      currentIndex = (index + currentList.length) % currentList.length;
      var item = currentList[currentIndex];
      var isVideo = item.getAttribute('data-video') === 'true';
      var full = item.getAttribute('data-full');

      lbVideo.pause();
      lbVideo.removeAttribute('src');
      lbVideo.load();
      lbImg.removeAttribute('src');

      if(isVideo){
        lbImg.hidden = true;
        lbVideo.hidden = false;
        lbVideo.src = full;
      } else {
        lbVideo.hidden = true;
        lbImg.hidden = false;
        lbImg.src = full;
      }

      var cap = captionFor(item);
      lbCaption.textContent = cap || 'legenda pendente';
      lbCaption.classList.toggle('is-empty', !cap);
    }

    function openLightbox(item){
      var grid = item.closest('.album-grid');
      if(!grid) return;
      currentList = Array.prototype.slice.call(grid.querySelectorAll('.photo-item'));
      var idx = currentList.indexOf(item);
      lastFocused = document.activeElement;
      lightbox.classList.add('open');
      lightbox.setAttribute('aria-hidden', 'false');
      document.body.style.overflow = 'hidden';
      show(idx);
      lbClose.focus();
    }

    function closeLightbox(){
      lightbox.classList.remove('open');
      lightbox.setAttribute('aria-hidden', 'true');
      document.body.style.overflow = '';
      lbVideo.pause();
      if(lastFocused && lastFocused.focus) lastFocused.focus();
    }

    document.querySelectorAll('.photo-item').forEach(function(item){
      item.addEventListener('click', function(){ openLightbox(item); });
      item.addEventListener('keydown', function(e){
        if(e.key === 'Enter' || e.key === ' '){
          e.preventDefault();
          openLightbox(item);
        }
      });
    });

    lbClose.addEventListener('click', closeLightbox);
    document.querySelectorAll('[data-close]').forEach(function(el){
      el.addEventListener('click', closeLightbox);
    });
    lbPrev.addEventListener('click', function(){ show(currentIndex - 1); });
    lbNext.addEventListener('click', function(){ show(currentIndex + 1); });

    document.addEventListener('keydown', function(e){
      if(!lightbox.classList.contains('open')) return;
      if(e.key === 'Escape'){ closeLightbox(); }
      else if(e.key === 'ArrowLeft'){ show(currentIndex - 1); }
      else if(e.key === 'ArrowRight'){ show(currentIndex + 1); }
    });

    // ── Swipe no lightbox (celular) ──
    var lbMedia = document.querySelector('.lb-media');
    var SWIPE_MIN_PX = 50;
    var touchStartX = 0, touchStartY = 0, touchTracking = false;

    lbMedia.addEventListener('touchstart', function(e){
      if(e.touches.length !== 1) return;
      touchStartX = e.touches[0].clientX;
      touchStartY = e.touches[0].clientY;
      touchTracking = true;
    }, {passive:true});

    lbMedia.addEventListener('touchmove', function(e){
      if(!touchTracking || e.touches.length !== 1) return;
      var dx = e.touches[0].clientX - touchStartX;
      var dy = e.touches[0].clientY - touchStartY;
      // Gesto predominantemente horizontal: segura o scroll vertical da página
      // enquanto o dedo desliza, pra não brigar com o swipe.
      if(Math.abs(dx) > Math.abs(dy) && Math.abs(dx) > 10){
        e.preventDefault();
      }
    }, {passive:false});

    lbMedia.addEventListener('touchend', function(e){
      if(!touchTracking) return;
      touchTracking = false;
      var touch = e.changedTouches[0];
      var dx = touch.clientX - touchStartX;
      var dy = touch.clientY - touchStartY;
      if(Math.abs(dx) > SWIPE_MIN_PX && Math.abs(dx) > Math.abs(dy)){
        show(currentIndex + (dx < 0 ? 1 : -1));
      }
    });

    lbMedia.addEventListener('touchcancel', function(){
      touchTracking = false;
    });
  })();
  </script>

  <script src="../Lib/dragonball.js"></script>
  <script>
  (function () {
    if (!window.NexusEsferas) return;
    var meuId = 'recordacoes';
    var n = NexusEsferas.esferaDestaPagina(meuId);
    if (n === null) return;

    var POSICOES_ESTRELA = {
      1:[[0,0]], 2:[[-11,-8],[11,8]], 3:[[0,-16],[-13,10],[13,10]],
      4:[[-13,-13],[13,-13],[-13,13],[13,13]],
      5:[[0,-18],[-15,-3],[15,-3],[-10,16],[10,16]],
      6:[[-13,-15],[13,-15],[-13,0],[13,0],[-13,15],[13,15]],
      7:[[0,-18],[-15,-10],[15,-10],[-15,9],[15,9],[-8,18],[8,18]]
    };

    var wrap = document.getElementById('dragonball-sphere');
    var orb  = wrap.querySelector('.db-sphere-orb');
    POSICOES_ESTRELA[n].forEach(function (p) {
      var e = document.createElement('span');
      e.className = 'estrela';
      e.style.left = (32 + p[0] - 4.5) + 'px';
      e.style.top  = (32 + p[1] - 4.5) + 'px';
      orb.appendChild(e);
    });
    wrap.style.display = 'block';
    wrap.setAttribute('aria-label', 'Esfera do Dragão de ' + n + ' estrela' + (n > 1 ? 's' : ''));

    wrap.addEventListener('click', function () {
      NexusEsferas.encontrar(meuId);
      wrap.style.transition = 'opacity .5s ease, transform .5s ease';
      wrap.style.opacity = '0';
      wrap.style.transform = 'scale(.3)';
      setTimeout(function () { wrap.style.display = 'none'; }, 550);
    });
  })();
  </script>

  <!-- ── Terceiro fragmento da Canção da Tempestade — ao contrário do
       OOT/MM, aqui não tem quebra-cabeça: a dica secreta no card do
       Gurren Lagann (.segredo-dica) já É a descoberta. Um
       IntersectionObserver marca o fragmento encontrado quando ela fica
       visível na tela por um instante — tempo o bastante pra sugerir que
       foi notada, não só cruzada rolando rápido demais. ── -->
  <script src="../Lib/cancao-tempestade.js"></script>
  <script>
  (function () {
    if (!window.NexusCancao) return;
    var PAGE_ID = 'recordacoes';
    if (NexusCancao.estaCompleta(PAGE_ID)) return;

    var dica = document.querySelector('.segredo-dica');
    if (!dica || !window.IntersectionObserver) return;

    var DURACAO_NOTADA_MS = 600;
    var timer = null;

    var observer = new IntersectionObserver(function (entradas) {
      entradas.forEach(function (entrada) {
        if (entrada.isIntersecting) {
          if (timer) return;
          timer = setTimeout(function () {
            NexusCancao.marcarEncontrada(PAGE_ID);
            observer.disconnect();
          }, DURACAO_NOTADA_MS);
        } else if (timer) {
          clearTimeout(timer);
          timer = null;
        }
      });
    }, { threshold: 0.6 });

    observer.observe(dica);
  })();
  </script>
