<style>
* { box-sizing: border-box; margin: 0; padding: 0; }

body {
  font-family: Georgia, 'Times New Roman', serif;
  background: #1a1208;
  color: #d4b896;
  -webkit-text-size-adjust: 100%;
}

.page {
  min-height: 100vh;
  padding: 20px 16px 40px;
  max-width: 680px;
  margin: 0 auto;
  background: transparent;
}

.header {
  text-align: center;
  padding: 20px 0 16px;
  border-bottom: 1px solid #4a3520;
  margin-bottom: 16px;
}

.header h1 {
  font-size: 22px;
  font-weight: normal;
  color: #e8c97a;
  letter-spacing: 0.1em;
  text-shadow: 0 0 20px rgba(232,201,122,0.3);
}

.header p {
  font-size: 12px;
  color: #7a6040;
  letter-spacing: 0.15em;
  margin-top: 4px;
  text-transform: uppercase;
}

.search-wrap {
  margin-bottom: 12px;
  position: relative;
}

.search-wrap input {
  width: 100%;
  padding: 9px 14px;
  border-radius: 4px;
  border: 1px solid #4a3520;
  background: #0f0b05;
  color: #d4b896;
  font-family: Georgia, serif;
  font-size: 14px;
  outline: none;
  -webkit-appearance: none;
}

.search-wrap input::placeholder { color: #4a3520; }
.search-wrap input:focus { border-color: #8a6030; }

.search-clear {
  position: absolute;
  right: 10px;
  top: 50%;
  transform: translateY(-50%);
  background: none;
  border: none;
  color: #4a3520;
  font-size: 16px;
  cursor: pointer;
  padding: 2px 4px;
  line-height: 1;
  display: none;
}
.search-clear:hover { color: #d4b896; }


.filters {
  display: flex;
  flex-wrap: wrap;
  gap: 6px;
  margin-bottom: 12px;
}

.filter-btn {
  padding: 4px 11px;
  border-radius: 3px;
  border: 1px solid #4a3520;
  background: transparent;
  color: #7a6040;
  font-family: Georgia, serif;
  font-size: 12px;
  cursor: pointer;
  letter-spacing: 0.05em;
  -webkit-tap-highlight-color: transparent;
  transition: all 0.15s;
}
.filter-btn:hover { border-color: #8a6030; color: #d4b896; }
.filter-btn.active { border-color: #e8c97a; color: #e8c97a; background: rgba(232,201,122,0.08); }
.filter-btn.urgent-btn { border-color: rgba(180,60,20,0.4); color: #e07050; }
.filter-btn.urgent-btn.active { border-color: #e07050; background: rgba(180,60,20,0.12); }

.count {
  font-size: 11px;
  color: #4a3520;
  margin-bottom: 10px;
  letter-spacing: 0.1em;
  text-transform: uppercase;
}

.card {
  border: 1px solid #3a2a14;
  border-radius: 3px;
  padding: 12px 14px;
  margin-bottom: 8px;
  background: #120d06;
  position: relative;
}

.card::before {
  content: '';
  position: absolute;
  left: 0; top: 0; bottom: 0;
  width: 3px;
  border-radius: 3px 0 0 3px;
}

.card.cat-aliado::before   { background: #1D9E75; }
.card.cat-inimigo::before  { background: #993C1D; }
.card.cat-morto::before    { background: #444441; }
.card.cat-entidade::before { background: #534AB7; }
.card.cat-familia::before  { background: #993556; }
.card.cat-outro::before    { background: #854F0B; }
.card.b-warn-stripe::before { background: #B07010; }

.card-header {
  display: flex;
  justify-content: space-between;
  align-items: flex-start;
  gap: 8px;
  margin-bottom: 6px;
  flex-wrap: wrap;
}

.card-name {
  font-size: 15px;
  color: #e8c97a;
  font-weight: normal;
  letter-spacing: 0.03em;
}

.card-sess {
  font-size: 11px;
  color: #4a3520;
  margin-top: 2px;
  font-family: Georgia, serif;
  letter-spacing: 0.08em;
}

.badge {
  display: inline-block;
  padding: 2px 8px;
  border-radius: 2px;
  font-size: 11px;
  font-family: Georgia, serif;
  white-space: nowrap;
  flex-shrink: 0;
  letter-spacing: 0.04em;
  border: 1px solid;
}

.b-aliado   { background: rgba(29,158,117,0.12);  color: #5DCAA5; border-color: rgba(29,158,117,0.3); }
.b-inimigo  { background: rgba(153,60,29,0.15);   color: #F0997B; border-color: rgba(153,60,29,0.4); }
.b-morto    { background: rgba(68,68,65,0.2);     color: #888780; border-color: rgba(68,68,65,0.4); }
.b-entidade { background: rgba(83,74,183,0.15);   color: #AFA9EC; border-color: rgba(83,74,183,0.4); }
.b-familia  { background: rgba(153,53,86,0.15);   color: #ED93B1; border-color: rgba(153,53,86,0.4); }
.b-outro    { background: rgba(133,79,11,0.15);   color: #EF9F27; border-color: rgba(133,79,11,0.4); }
.b-warn     { background: rgba(160,100,10,0.18);  color: #F0C060; border-color: rgba(180,120,20,0.5); }

.card-desc {
  font-size: 12px;
  color: #8a7055;
  line-height: 1.6;
  margin-top: 5px;
  word-break: break-word;
  font-family: Georgia, serif;
}

/* ── Important NPCs: subtle gold distinction ── */
.card.card-important {
  border-color: #3d2e14;
  background: #140f07;
}
.card.card-important::before {
  width: 4px;
  box-shadow: 0 0 8px rgba(232,201,122,0.18);
}
.card.card-important .card-name {
  font-size: 16px;
  text-shadow: 0 0 12px rgba(232,201,122,0.2);
}
.important-crown {
  font-size: 9px;
  color: #6a4e20;
  letter-spacing: 0.15em;
  text-transform: uppercase;
  margin-top: 1px;
}

.card-meta {
  display: flex;
  align-items: center;
  flex-wrap: wrap;
  gap: 8px;
  margin-top: 8px;
  padding-top: 7px;
  border-top: 1px solid #2a1e0e;
}

.hp-bar {
  font-size: 11px;
  font-family: Georgia, serif;
  letter-spacing: 0.04em;
  white-space: nowrap;
}

.ac-val {
  font-size: 11px;
  font-family: Georgia, serif;
  color: #AFA9EC;
  letter-spacing: 0.04em;
}

.meta-sep {
  color: #3a2a14;
  font-size: 11px;
}

.links-row {
  font-size: 11px;
  color: #5a4530;
  font-family: Georgia, serif;
  flex: 1;
  min-width: 0;
}

.links-row a {
  color: #8a6a3a;
  text-decoration: none;
  cursor: pointer;
  border-bottom: 1px dotted #4a3520;
}

.links-row a:hover {
  color: #e8c97a;
  border-color: #8a6030;
}

.urgent-tag {
  display: inline-flex;
  align-items: center;
  gap: 4px;
  padding: 2px 7px;
  border-radius: 2px;
  font-size: 10px;
  font-family: Georgia, serif;
  letter-spacing: 0.06em;
  background: rgba(180,60,20,0.15);
  color: #e07050;
  border: 1px solid rgba(180,60,20,0.35);
  white-space: nowrap;
  text-transform: uppercase;
}

.urgent-dot {
  width: 5px;
  height: 5px;
  border-radius: 50%;
  background: #e07050;
  animation: blink 1.8s infinite;
  flex-shrink: 0;
}

@keyframes blink {
  0%, 100% { opacity: 1; }
  50%       { opacity: 0.25; }
}

.divider {
  text-align: center;
  color: #3a2a14;
  font-size: 14px;
  letter-spacing: 0.3em;
  margin: 4px 0 12px;
}

.desc-section {
  margin-top: 8px;
}
.desc-label {
  display: block;
  font-size: 10px;
  color: #7a5828;
  letter-spacing: 0.18em;
  text-transform: uppercase;
  margin-bottom: 2px;
  font-family: Georgia, serif;
  border-bottom: 1px solid #2a1e0e;
  padding-bottom: 2px;
}
.desc-content {
  font-size: 12px;
  color: #8a7055;
  line-height: 1.6;
  font-family: Georgia, serif;
  margin-top: 3px;
}
.desc-plain {
  font-size: 12px;
  color: #8a7055;
  line-height: 1.6;
  font-family: Georgia, serif;
}

.no-results {
  text-align: center;
  color: #4a3520;
  font-size: 13px;
  padding: 32px 0;
  letter-spacing: 0.06em;
}

.header-runes {
  font-size: 20px;
  color: #3a2a14;
  letter-spacing: 0.4em;
  margin-bottom: 8px;
}

/* ── ACESSIBILIDADE: MOVIMENTO REDUZIDO ─────────── */
@media (prefers-reduced-motion: reduce) {

  }
}
</style>

<script>
function esc(s) {
