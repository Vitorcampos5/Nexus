  {id:49,nome:"Mapa do Culto — Ponto de Convergência",tipo:"Outro",subtipo:"Documento · Inteligência Inimiga",status:"Em Posse",possuidor:"Leyn Sepet (Sentinela custodiando)",saga:"Saga 14",local:"Recuperado dos cadáveres — Catacumbas da Vila Sepet",raridade:"Incomum",atributos:["Marca a Vila Sepet, a Fortaleza do Culto (sudeste) e um 'Ponto de Convergência' (localização codificada)","Localização do Ponto de Convergência requer tradução de cifra do Culto para ser decifrada","Parcialmente sobrepõe o Mapa Parcial de Valtheris de Leyn — informações complementares","Recuperado do mesmo conjunto de cadáveres que o Grimório"],descricao:"O mapa mostra onde o Culto está e para onde quer ir. A Vila Sepet está marcada — eles sabiam exatamente onde vinham. A Fortaleza do Culto ao sudeste está indicada com símbolo de base operacional. E há um terceiro ponto: o 'Ponto de Convergência', localização codificada em cifra que ninguém no grupo sabe ler ainda. Mas a cifra pode estar no Grimório. Quando Aldric chegar em três dias, talvez ele reconheça."},
  {id:50,nome:"Núcleo Mágico do Construto",tipo:"Artefato",subtipo:"Componente Mágico · Integrado",status:"Integrado — Victória",possuidor:"Leyn Sepet (via Victória)",saga:"Saga 21",local:"Integrado à lâmina Victória — Catacumbas da Vila Sepet",raridade:"Raro",atributos:["[INTEGRADO — não existe mais como objeto separado]","Conteúdo revelado: criança de ~7 anos, cabelo negro, olhos âmbar — aprisionada pelos homens de mantos roxos do Culto num campo de flores amarelas","Raiva dentro do núcleo era armadura — maior que o corpo que protegia; não agressão coordenada, desespero que virou violência","Leyn não usou ritual de substituição de Aldric; encontrou a presença no canto da escuridão, sentou e esperou","Presença veio até Leyn; ele tocou sua cabeça; ela foi — com luz âmbar, não com raiva; última comunicação: 'Obrigada por me ver. Não como ferramenta. Como eu era.'","Ao partir: cristal integrou-se à base da Espada Longa do Ferreiro em veios dourados; inscrição 'Levanta' emergiu por escolha da própria presença","Kaira identificou a cor dos veios âmbar: idêntica aos próprios olhos dourados","Teren sentiu a partida mesmo sendo vampiro novo de horas; Rory sentiu sem entender magia alguma","Aldric: 'O que você fez não tem nome em nenhum texto que já li'"],descricao:"Entrou neste catálogo como esfera de cristal negro rachada, com magia residual profana e vontade aprisionada que Kaira chamou de 'ainda está viva?'. Saiu dele integrado à lâmina de uma espada como veios dourados e a palavra Levanta gravada por escolha própria. O que estava dentro nunca foi combustível para Construto — foi criança num campo de flores que viu homens de manto roxo aparecerem na borda do mundo. A raiva que projetava era tudo o que sobrou dela depois de anos comprimida em cristal. Leyn não purificou. Escutou. A criança foi embora com luz. O núcleo foi com ela — mas deixou a cor dos olhos dela na lâmina, para que não seja esquecida."},
  {id:51,nome:"Cajado com Cristal Corrompido",tipo:"Arma",subtipo:"Cajado Mágico · Profano",status:"Em Posse",possuidor:"Leyn Sepet (Sentinela custodiando)",saga:"Saga 14",local:"Recuperado dos cadáveres dos Conjuradores — Catacumbas da Vila Sepet",raridade:"Incomum",atributos:["1 cajado intacto de 3 recuperados (2 destruídos pelas armadilhas)","Cristal no topo pulsa com energia profana residual","Usado pelos Conjuradores do Culto para canalizar magias de ataque (Raio Gélido, Proteção, Luz)","Magia profana: pode amplificar feitiços de corrupção e trevas — uso por vampiro requer cautela","Pode ser reforjado/purificado por mago competente, ou usado como fonte de informação sobre magia do Culto"],descricao:"Dois dos três cajados viraram cinzas com os portadores. Este sobreviveu porque estava no Conjurador #2, o que a Sentinela decapitou — morte instantânea preservou o equipamento. O cristal ainda pulsa. Energia profana residual que não some com a morte do portador. Útil para estudo. Potencialmente perigoso para manusear sem preparo. A Sentinela o organizou na pilha de evidências com o mesmo pragmatismo de quem já viu muita coisa."},
  {id:52,nome:"Veneno Suicida dos Cultistas",tipo:"Consumível",subtipo:"Veneno · Neurotoxina",status:"Em Posse",possuidor:"Elise (2 doses = 6 flechas)",saga:"Saga 14",local:"Recuperado dos cadáveres — dentes ocos de 2 cultistas guerreiros",raridade:"Incomum",atributos:["Neurotoxina extraída de criatura abissal","Efeito: Salvaguarda de Constituição CD 15 — Falha: Paralisia em 1 rodada + 3d6 de dano de veneno/rodada por 3 rodadas","Sucesso: Metade do dano, sem paralisia","Funciona em: humanos, construtos biológicos, mortos-vivos fracos","NÃO funciona em: construtos puramente mecânicos, espíritos, demônios maiores","Cada dose = suficiente para 3 flechas","[Saga 14] Recuperado de dentes ocos — cultistas o carregavam para evitar interrogatório","[Saga 15] Transferido por Leyn a Elise: 'use na ponta de suas flechas quando achar necessário'"],descricao:"Dois cultistas guerreiros carregavam veneno em dentes ocos — peças ocas de porcelana instaladas cirurgicamente para prevenir captura e interrogatório. A Sentinela recuperou com precisão cirúrgica. O líquido negro viscoso cheira a amêndoas amargas misturadas com carne podre: sinal de origem abissal. Leyn o passou para Elise sem cerimônia, tratando como ferramenta tática. Para Elise — ex-inquisidora que passou décadas como aberração — receber veneno como equipamento de combate e ser chamada de família no mesmo dia é uma combinação peculiar de normalidade."},
  {id:53,nome:"Marca da Maioridade — Kaira Sepet",tipo:"Artefato",subtipo:"Transformação Permanente",status:"Em Posse",possuidor:"Kaira Sepet",saga:"Saga 16",local:"Câmara da Provação — Salão Comunal Central, Vila Sepet",raridade:"Artefato Único",atributos:["Kaira atingiu nível 3 como Guerreira após as Três Provações (ganhou 2 níveis)","HP: 10 a 25 (3d10 + CON)","Força 12 a 14, Constituição 12 a 14, Carisma 15 a 16","Habilidades ganhas: Action Surge, Second Wind (1d10+3), Estilo Proteção","Poderes primordiais completos: Regeneração Vampírica (2 PV/turno em combate · 2 PV/hora fora de combate), Mordida poderosa (2d6+2 + drena 2d6 HP)","Aura dourada visível quando em estado emocional intenso","Três Provações: Medo do Abandono/Criador, Auto-Aceitação, Escolha de Identidade (Porta Dourada — Família)","Vila Sepet celebrou: pela primeira vez em 100 anos, jovem vampiro Sepet alcança maioridade"],descricao:"A Câmara não age por crueldade. Age por sabedoria. Kaira enfrentou o Padre Traidor e o socou até rachar. Abraçou a versão criança de si mesma no espelho ao invés de negar. E diante de três portas — Poder, Liberdade, Família — escolheu a dourada sem hesitar: cem anos sozinha me ensinaram que segurança sem amor não é vida, é apenas sobrevivência. Saiu transformada. Não fisicamente dramática — mas completa. Sem os medos que a paralisavam, sem vergonha do passado, sem dúvida sobre quem é. A linhagem Sepet continua."},
  {id:54,nome:"Anel de Prata dos Primeiros",tipo:"Acessório",subtipo:"Anel · Artefato da Linhagem",status:"Em Posse",possuidor:"Leyn Sepet",saga:"Saga 17",local:"Caixa de Madeira Escura — guardada por Aldric Voss por 100 anos após o massacre Sepet",raridade:"Artefato Único",atributos:["Prata com gema vermelha escura no centro — pulsou ao reconhecer sangue Sepet no momento do contato","Gravação interna em escrita vampírica antiga: 'Que o último carregue o que os primeiros construíram'","Ajuste automático ao dedo do portador — reconhece sangue Sepet, não aceita outro","Memória comprimida: cinco mil anos de linhagem encapsulados em prata e pedra vermelha — por enquanto manifestada apenas como presença, 'a mão de alguém que não se vê'","Aldric encontrou nos escombros de acampamento Sepet duas semanas após o massacre — guardou 100 anos aguardando portador certo","Encontrado junto ao Fragmento de Pergaminho Primordial na mesma caixa; os dois pertencem ao mesmo conjunto","Caixa de madeira escura gravada com runas de proteção contra deterioração: item preservado impecavelmente por mais de um século"],descricao:"Cem anos numa caixa de madeira escura, dentro da capa de um vampiro que não sabia o nome de quem receberia. Aldric Voss o encontrou nos escombros duas semanas após o massacre — o acampamento já estava frio, os rastros já tinham sumido, mas a caixa com runas de proteção ainda pulsava com sangue Sepet, recusando-se a apagar. Ele a guardou sem saber se haveria alguém vivo para recebê-la. Quando a tampa se abriu sob os dedos de Leyn sem resistência — como se sempre soubesse — o anel estava no veludo escurecido pelo tempo, exatamente como havia sido colocado. A gravação não é promessa. É instrução. Cinco mil anos de linhagem dizendo ao último: não comece do zero. Carregue o que construímos."},
  {id:55,nome:"Fragmento de Pergaminho Primordial",tipo:"Outro",subtipo:"Documento · Primordial Arcaico",status:"Em Posse",possuidor:"Leyn Sepet",saga:"Saga 17",local:"Caixa de Madeira Escura — junto ao Anel de Prata dos Primeiros",raridade:"Raro",atributos:["Três linhas em escrita primordial arcaica — escritos à mão, tinta intacta após mais de um século","Escrita anterior ao que Aldric aprendeu em mais de três séculos de estudo: primordial pré-fundação","Aldric Voss confirmou incapacidade de leitura — estreita significativamente o campo de quem pode traduzir","Conteúdo: completamente desconhecido — requer especialista em primordial arcaico","Guardado dobrado junto ao Anel dos Fundadores — os dois foram deixados intencionalmente como conjunto","A tinta não desbotou: ou magia de preservação deliberada, ou o que está escrito recusou desaparecer"],descricao:"Três linhas. Não são muitas palavras. Mas a tinta não desbotou em mais de um século dentro da caixa — o que, para pergaminho, significa ou magia de preservação intencional, ou que o que está escrito recusou desaparecer. Aldric Voss tem 342 anos de estudo de línguas mortas e admitiu que não consegue ler. Isso estreita muito o campo de quem pode. Leyn o guarda dobrado junto ao anel, como se ambos pertencessem ao mesmo conjunto — porque pertencem. Quem os deixou na mesma caixa sabia o que estava fazendo."},
  {id:56,nome:"Provação da Dignidade — Marca do Protetor",tipo:"Artefato",subtipo:"Transformação Permanente · Marca Ancestral",status:"Em Posse",possuidor:"Leyn Sepet",saga:"Saga 17",local:"Sala da Provação da Dignidade — Catacumbas da Vila Sepet",raridade:"Artefato Único",atributos:["ESCUDO DO PROTETOR (Passivo): quando aliado a até 15 pés seria reduzido a 0 HP, Leyn pode usar Reação para absorver metade do dano — transferindo-o para si mesmo","PRESENÇA ANCESTRAL (1x por Descanso Longo): Ação Bônus — manifesta a linhagem Sepet completa por 1 minuto; aliados a 30 pés ganham +2 em ataques e salvaguardas; inimigos que vejam Leyn fazem Salvaguarda de Sabedoria CD 14 ou ficam abalados (desvantagem em ataques contra Leyn) por 1 rodada","NOME GRAVADO (Permanente): nome de Leyn inscrito nas paredes da Câmara — magias de supressão de identidade, amnésia forçada ou dissolução de linhagem não funcionam dentro do perímetro da Vila Sepet","Aprovado por um dos Primeiros — a figura que emergiu na sala era ancestral de cinco mil anos, não construção da magia da Câmara","Marcação gravada: 'Aquele que protege porque sempre foi feliz fazendo isso. E não deixou o mundo tirar isso dele.'","Inscrição gravada logo abaixo de Kael Sepet: 'Aquele que ficou quando todos foram. Aquele que enterrou os nomes para que não fossem esquecidos.'","Condição de aprovação: honestidade sem ornamentos — resposta encontrada no meio de uma dúvida genuína, não preparada","A sala permaneceu como câmara branca por quase duas horas (externo) — internamente pareceu minutos"],descricao:"A Provação da Dignidade não testa força nem feitos. Faz uma única pergunta — por que você protege? — e aguarda a resposta verdadeira. Leyn não chegou com resposta preparada. Chegou com uma dúvida honesta e a encontrou no meio dela: protejo porque sempre fui feliz fazendo isso. Antes do massacre, antes da prisão, antes do século de escuridão. Esse algo que o mundo tentou arrancar por cem anos não saiu. Um dos Primeiros — ancestral de cinco mil anos com a dignidade específica de quem nunca teve pressa — emergiu da figura sem rosto, inclinou-se para o descendente e disse: respondeu como Sepet. Não como vampiro que decidiu ser bom. Como alguém que sempre foi isso. O nome de Leyn foi gravado nas paredes da Câmara entre milhares de outros. Logo abaixo de Kael Sepet. Como se sempre devesse estar ali."},
  {id:57,nome:"Escudo Médio — Arsenal Sepet",tipo:"Armadura",subtipo:"Escudo · Médio",status:"Em Posse",possuidor:"Kaira Sepet",saga:"Saga 18",local:"Arsenal da Vila Sepet",raridade:"Comum",atributos:["+2 de CA quando equipado","Compatível com Estilo de Luta: Proteção — permite usar Reação para impor desvantagem em ataques de criaturas a 5 pés contra aliados adjacentes","Escolhido com orientação da Sentinela — tamanho médio equilibra proteção e mobilidade com lança de alcance","Mara comentou ao ver Kaira partir: 'bem-vinda ao problema de todo guerreiro que escolhe proteção antes de pensar na logística'","Kaira levou tempo conversando com a Sentinela sobre qual modelo combinaria melhor com uso de lança de dois metros","Completa o Estilo de Proteção — sem ele, a habilidade era apenas potencial sem função"],descricao:"Kaira escolheu Estilo de Luta: Proteção antes de ter escudo. Não por descuido — por ter escolhido primeiro o que queria proteger, e só depois percebido o que precisava para fazê-lo. A Sentinela corrigiu esse detalhe com paciência de centenária. O escudo médio do Arsenal é equilibrado: pesado o suficiente para proteger, leve o suficiente para não travar o alcance da lança de dois metros. Kaira voltou segurando os dois, um pouco envergonhada mas sorrindo, enquanto Mara ria e Leyn fingia não notar. O Estilo de Proteção agora tem sentido completo."},
  {id:58,nome:"Pedra de Detecção",tipo:"Acessório",subtipo:"Cristal · Detecção Mágica",status:"Em Posse",possuidor:"Aldric Voss",saga:"Saga 18",local:"Cedida por Aldric Voss — Catacumbas da Vila Sepet",raridade:"Incomum",atributos:["Brilha azul quando a menos de 50 pés de magia profana ativa","Intensidade do brilho aumenta com a proximidade — guia direcional passivo","Tamanho: polegar humano; presa em corrente fina de prata","Não é precisa — indica presença geral, não localização exata","Localizou a Estaca Ritual do Culto (Ponto Alfa) ao norte da Vila Sepet em ~40 minutos de busca metódica","Arremessada como distração improvisada: Ataque à Distância 1d20+2 Dex = 3 — FALHA CRÍTICA","Ricocheteou na casca de uma árvore, girou no ar como moeda, caiu a 3 metros de Leyn dentro da Noite Eterna — ainda brilhando","O barulho alertou os cultistas; paradoxalmente a situação que se seguiu plantou dúvida em dois deles"],descricao:"Do tamanho de um polegar, azul como vidro claro em sua corrente de prata fina. Aldric a tirou da capa antes de Leyn partir sozinho — instrumento prático para trabalho que exigia pragmatismo. Cumpriu sua função com competência: guiou Leyn até a Estaca Ritual em menos de uma hora de busca. Depois, num momento de improviso questionável, foi arremessada como distração contra o conjurador cultista. O resultado foi um dos arremessos mais memoráveis de um vampiro primordial: a pedra ricocheteou em árvore, girou no ar como moeda bêbada, caiu a três metros do portador, ainda brilhando intensamente, fazendo barulho suficiente para confirmar presença de intrusos. O que deveria ser distração virou confirmação. Paradoxalmente, o desastre foi o catalisador para a conversa que se seguiu."},
  {id:59,nome:"Estaca Ritual do Culto — Ponto Alfa",tipo:"Artefato",subtipo:"Artefato Profano · Ponto de Ancoragem",status:"Destruído",possuidor:null,saga:"Saga 19",local:"Floresta Norte — ~1km do perímetro da Vila Sepet (destruída no local)",raridade:"Raro",atributos:["Pedra negra de ~comprimento de braço — runas profanas em espiral com brilho roxo fraco","Marcador de Ponto de Ancoragem do Ritual de Convergência — vértice norte do triângulo ritual","DESTRUÍDA por Rory (Kael) — espada descendo com força total, som de CRACK, runas explodindo em luz roxa violenta como gêiser antes de se dissipar","Estaca rachada ao meio, depois despedaçada em fragmentos de pedra negra no musgo","Explosão alertou TODOS os cristais de comunicação da operação simultaneamente — a 'Mestra' respondeu com múltiplas vozes sobrepostas: 'IMPOSSÍVEL. BARREIRA ESTAVA ATIVA.'","Cristal de comunicação da Equipe Três esmagado por Teren imediatamente após — silêncio de rádio completo","[TRIÂNGULO QUEBRADO] Ritual de Convergência não pode ser executado sem os três pontos — contingência inimiga: novo ponto pode ser criado em ~1 semana","Contingência do Culto confirmada por Aldric: destruição de um ponto não cancela o plano, apenas o atrasa"],descricao:"Kael disse 'que os deuses me perdoem, ou não, tanto faz' e desceu a espada. O CRACK foi o som de seis anos de servilidade sendo cortados ao meio junto com a pedra. A explosão roxa varreu a floresta por meio segundo. Os fragmentos de pedra negra caíram no musgo. Todos os cristais de comunicação do Culto dispararam ao mesmo tempo — a 'Mestra' com múltiplas vozes sobrepostas declarando impossível o que acabou de acontecer. Teren esmagou o cristal sob a bota. O triângulo ritual está quebrado. O Ponto Alfa não existe mais. O Culto pode reconstruir em uma semana — mas essa semana agora pertence à família Sepet."},
  {id:60,nome:"Mantos de Contenção Mágica",tipo:"Armadura",subtipo:"Manto · Proteção Arcana Solar",status:"Em Posse",possuidor:"Arsenal da Vila Sepet",saga:"Saga 18",local:"Arsenal da Vila Sepet — prateleiras dos Fundadores",raridade:"Raro",atributos:["Bloqueiam radiação solar por tempo limitado — duração exata não especificada; estimada em minutos","Reduzem (não eliminam) dano e efeitos de relíquias solares como A Lança do Amanhecer","Contramedida específica contra Arcebispo Davren Solharte — estimativa de chegada: próximo amanhecer","Não são solução completa — são margem de sobrevivência; a ameaça persiste durante a duração","Quantidade no Arsenal: indeterminada","Identificados pela Sentinela como única contramedida disponível contra fontes de luz solar aprisionada","Providência prática dos Fundadores: equiparam o Arsenal prevendo ataques com luz sagrada"],descricao:"Os Fundadores eram práticos. Quando construíram o Arsenal, não presumiram que inimigos seriam gentis o suficiente para não usar luz solar contra vampiros. Os mantos não foram feitos para eliminar o perigo — foram feitos para dar tempo: segundos extras, metros extras, a diferença entre desviar de A Lança do Amanhecer e ser incinerado por ela. A Sentinela os identificou como única contramedida disponível no Arsenal. Não são solução. São a margem entre sobrevivência e não sobrevivência quando o Arcebispo chegar. Pequena margem. Mas margem."},
  {id:61,nome:"A Lança do Amanhecer",tipo:"Arma",subtipo:"Relíquia Solar · Ameaça Inimiga",status:"Localização Desconhecida",possuidor:"Arcebispo Davren Solharte",saga:"Saga 18",local:"Em posse do Arcebispo Davren Solharte — Igreja do Sol Agonizante (a caminho da Vila)",raridade:"Lendário",atributos:["Fragmento de luz solar aprisionada em cristal","Queima mortos-vivos em raio de 30 pés simplesmente por existir próxima — sem ativação necessária","Portador: Arcebispo Davren Solharte — líder da ala militar da Igreja do Sol Agonizante","Davren: fanático de 'pureza absoluta' e 'eficiência brutal' — declara região contaminada, população desaparece em menos de uma semana","Luz solar aprisionada ainda é luz — pode ser bloqueada, desviada ou absorvida com materiais adequados","Contramedida disponível: Mantos de Contenção Mágica do Arsenal Sepet — reduzem, não eliminam","ETA estimado: Davren chega ao amanhecer com a Igreja do Sol Agonizante","Fonte da inteligência: Aldric Voss — conhecimento direto de mais de três séculos de observação"],descricao:"Não é arma que se combate frontalmente. É ameaça de área que queima pelo simples fato de estar próxima. Aldric Voss conhece Davren Solharte — 342 anos de existência ensinam a reconhecer o que mata vampiros antes que precise ser ativado. Fragmento de luz solar aprisionada em cristal: a coisa mais hostil que pode existir próxima de um morto-vivo, carregada por fanático que não hesitaria em usá-la. Davren a porta como símbolo de autoridade e como arma simultânea — sem distinção entre os dois usos. Os Mantos de Contenção do Arsenal podem reduzir o raio de queima. Reduzir não é eliminar. A margem continua sendo pequena quando o amanhecer chegar."},
  {id:62,nome:"Arma Morfológica",tipo:"Arma",subtipo:"Arma Espectral · Origem Desconhecida",status:"Em Posse",possuidor:"Caçadora do Luar",saga:"Sob o Luar",local:"Em posse da Caçadora do Luar — origem desconhecida",raridade:"Artefato Único",atributos:["FORMA ADAGA (preferida): +6 atq · 1d6+3 dano espectral · toca espectros em vez de ferir — não dispersa · corpo a corpo 5 pés","FORMA GANCHO: +6 atq · 1d8+3 dano espectral · ancora espectro, impede dispersão involuntária · alcance 5/10 pés","FORMA PÁ: +6 atq · 2d6+3 dano espectral · área 10 pés · desvantagem no próximo turno do alvo · forma de alta energia","FORMA AUTÔNOMA (1× por combate): muda de forma antes que a portadora forme intenção consciente — a arma concede uma Reação adicional exclusiva para Ataque de Oportunidade — não consome a Reação normal do turno.","Opera no plano espectral — distinção absoluta: ferir dispersa espectros, tocar estabelece contato sem destruição","Emite luminescência azul-fria no plano espectral — detectável por quem conhece sinais espectrais","Nenhuma arma documentada em Valtheris replica sua forma de operar — sem origem catalogada, sem marca de forja","A arma processa ameaças antes da portadora — mudança de forma é discreta, não dramática"],descricao:"Sem marca. Sem origem rastreável. Muda de forma conforme a intenção da portadora — e às vezes antes que a intenção exista. A versão autônoma ocorre em momentos de ameaça que a Caçadora ainda não processou conscientemente: quando olha, já é outra coisa. A distinção entre tocar e ferir não é técnica — é filosófica. Ferir dispersa. Tocar pergunta. A arma opera sobre essa diferença com precisão que nenhuma forja documentada em Valtheris replicou. Para quem observa de fora: a arma nunca é a mesma forma duas vezes seguidas, emite luz azul-fria no plano espectral, e parece às vezes tomar decisão própria. Nenhuma classificação da Igreja, de magos ou de arquivistas conseguiu nomeá-la adequadamente. A portadora tampouco."},
  {id:63,nome:"Recipiente dos Cristalizados",tipo:"Artefato",subtipo:"Recipiente Espectral · Estados Emocionais Colapsados",status:"Em Posse",possuidor:"Caçadora do Luar",saga:"Sob o Luar",local:"Carregado junto da Caçadora do Luar — sempre presente",raridade:"Artefato Único",atributos:["ÓDIO (vermelho-sangue): fala com a portadora — chega a conclusões frias partindo da raiva; a raiva é motor, não método","AMOR (vermelho-vinho): contesta Ódio com frequência — perturbado pela frieza; perspectiva oposta e necessária","FELICIDADE (verde): responde ao ambiente com leveza — externamente indistinguível de Vazio sem tempo de observação","PAZ (branco): nunca disse uma palavra — presença como peso quieto que impede a portadora de desaparecer completamente no ofício","VAZIO (azul): absorve sem responder — externamente indistinguível de Felicidade; diferença só aparece com tempo","CUSTO: usar Ódio + Amor simultaneamente exige Teste de SAB CD 13 ou dissociação por 1d4 rodadas","CUSTO MÁXIMO: moldar todos os cinco numa sessão — −1d8 Sanidade permanente","Visíveis como cinco pontos de luz colorida para quem sabe o que procurar — não escondidos ativamente"],descricao:"Cinco espectros emocionais colapsados. Não ferramentas, não prisioneiros — a portadora reconhece em cada um algo que existe dentro de qualquer pessoa que preste atenção suficiente ao próprio interior. Ódio e Amor são os que mais falam: um chega a conclusões frias pela raiva, o outro contesta essa frieza com frequência. Paz nunca falou uma palavra — mas a presença dela é diferente das outras, um peso quieto que ancora. Felicidade e Vazio a confundiram por tempo suficiente para que ela aprendesse a esperar antes de nomear qual é qual. Externamente são idênticos até que o tempo revela a diferença: leveza versus absorção. O custo de moldar todos os cinco é permanente. Ela aceita esse preço como parte do ofício."},
  {id:64,nome:"Valaquia",tipo:"Arma",subtipo:"Espada Longa · Linhagem · Vinculação Latente",status:"Em Posse",possuidor:"Leyn Sepet",saga:"Saga 20",local:"Casa dos Sepet — quarto de Leyn, Vila Sepet (esperando na parede por cem anos)",raridade:"Lendário",atributos:["Inscrição na base em vampírico antigo: 'Para Leyn. Que sua lâmina proteja os que não podem se proteger. — Pai'","Forjada por encomenda para Leyn — ferreiro que conhecia magia de vínculo; a intenção estava no metal desde o início; não era apenas presente, era preparação de missão","VINCULAÇÃO LATENTE: vínculo enfraqueceu sem portador mas não apagou — sustentado cem anos pela magia da Vila Sepet sem que a Vila soubesse; estado ao ser reencontrada: latente, estrutura intacta, faminta","ECO DO PAI: impressão deixada pelo pai de Leyn durante o forjamento — única emoção cristalizada no metal: orgulho; amplificada pelo abraço completo de Leyn na Saga 20; não é fantasma nem espírito preso, é eco de intenção",  "Teste de Arcana 19 (Sucesso Crítico): Leyn sentiu o vínculo a 2cm da lâmina — reconhecimento antes do contato; ao tocar, o vínculo pulsou uma vez, forte, como coração que lembra que existe","Nome dado por Leyn na Saga 20: 'Valaquia — aquela que mesmo em uma terra destruída permaneceu esperando seu mestre'","Resposta ao nome: calor imperceptível subindo frações de grau através da armadura; vínculo moveu de espera profunda para estado 'pronto'","PRONTA: aguarda ativação formal — requer trabalho, intenção e possivelmente custo; vínculo completo não estabelecido ainda","Dano base: 1d8+2 cortante (como espada longa com modificador de Força +2 de Leyn) — propriedades de vínculo ainda não ativas","Suporte vazio deixado na parede — Leyn decidiu não preencher o espaço; lembrete de que algo que deveria estar perdido foi encontrado"],descricao:"O pai de Leyn pagou caro por esta espada. Não pela lâmina — pela intenção dentro dela. Um ferreiro que conhecia magia de vínculo, instruções específicas gravadas em vampírico antigo, e uma data: a noite antes de Leyn partir em primeira missão solo. A missão nunca aconteceu. O massacre aconteceu. A espada ficou na parede do quarto por cem anos, dentro do perímetro que os Fundadores construíram, sustentada pela magia da Vila que preservava tudo sem saber o que cada coisa significava. Leyn a encontrou pelo toque — sentiu o vínculo antes mesmo de tocar. Abraçou a lâmina como filho abraça objeto que carrega as mãos do pai. O eco respondeu com orgulho cristalizado em metal frio. Ela disse seu nome em voz baixa: Valaquia. Aquela que esperou. A lâmina aqueceu frações de grau. Cem anos é muito tempo para esperar. Mas ela esperou."},
  {id:65,nome:"Faca de Reserva",tipo:"Arma",subtipo:"Faca · Mundana",status:"Em Posse",possuidor:"Caçadora do Luar",saga:"Sob o Luar",local:"Em posse da Caçadora do Luar",raridade:"Comum",atributos:["1d4+3 de dano perfurante · bônus de ataque +6 (DEX +3 + Proficiência +3)","Alcance: 5 / 20 pés","Mundana — não opera no plano espectral","Para situações onde a arma morfológica não é o instrumento certo — problemas inteiramente físicos","Reserva por design: a arma morfológica é a ferramenta principal; a faca existe para o que ela não alcança"],descricao:"Para o plano dos vivos, quando necessário. A arma morfológica opera no espectral — quando o problema é inteiramente físico, a faca entra. Sem história. Sem propriedades. O tipo de ferramenta que qualquer pessoa sensata carrega quando trabalha em lugares onde as coisas que matam ainda têm corpo. Não há nada de especial nela. Esse é o ponto."},
  {id:66,nome:"Capa Escura de Viagem",tipo:"Acessório",subtipo:"Manto · Vestuário",status:"Em Posse",possuidor:"Caçadora do Luar",saga:"Sob o Luar",local:"Em posse da Caçadora do Luar",raridade:"Comum",atributos:["Escura — sem insígnia, sem marca de afiliação, guilda, Igreja ou qualquer outra instituição","Sem rastro documental — nenhuma filiação visível para quem examinar","A imagem gravada em quem a encontrou: cabelos pretos, capa escura, nenhum nome","Não é afetação — é o uniforme de quem trabalha no escuro por necessidade operacional"],descricao:"Escura. Sem marca. Parte da metodologia de quem não deixa nome. Em múltiplas regiões de Valtheris há relatos de presença espectral resolvida, cabelos pretos, nenhuma conta pendente — e a capa aparece em todos eles. Não como detalhe ornamental. Como instrumento: quem trabalha no escuro veste o escuro. Não é afetação. É o mesmo raciocínio que aboliu o nome."},
  {id:67,nome:"Diário de Campo — Cifrado",tipo:"Outro",subtipo:"Documento · Diário Operacional",status:"Em Posse",possuidor:"Caçadora do Luar",saga:"Sob o Luar",local:"Em posse da Caçadora do Luar",raridade:"Incomum",atributos:["Cifrado — escrita inteligível apenas para a portadora; cifra personalizada, não sistema conhecido","Registra instalações espectrais — locais de atividade e padrões documentados ao longo de anos de trabalho","Registra comportamento dos Cristalizados — observações sobre Ódio, Amor, Felicidade, Paz e Vazio","Cobre múltiplas regiões de Valtheris — registro operacional cumulativo de anos de caçadas","Decifrar sem chave: provavelmente impossível — não é código padrão que analistas ou magos reconheceriam"],descricao:"O único registro do trabalho dela que existe. E existe apenas porque a cifra o tornou inútil para qualquer outro. Anos de operações documentadas em texto que ninguém além da portadora consegue ler: padrões de espectros, comportamentos dos Cristalizados, observações sobre instalações em dezenas de locais de Valtheris. A metodologia de uma caçadora que nunca deixa nome em lugar algum — exceto aqui, onde ninguém pode ler."},
  {id:68,nome:"Compostos de Sal e Ferro",tipo:"Consumível",subtipo:"Material Alquímico · Barreira de Emergência",status:"Em Posse",possuidor:"Caçadora do Luar",saga:"Sob o Luar",local:"Em posse da Caçadora do Luar · 3 doses",raridade:"Comum",atributos:["Barreira de emergência contra espectros físicos — impede cruzamento espectral básico pelo tempo que durar","Uso mundano — não opera no plano espectral de forma avançada; ferramenta de último recurso","3 doses disponíveis","Última linha de defesa quando o trabalho espectral e os Cristalizados não são a resposta certa"],descricao:"Sal e ferro. A solução mais antiga de Valtheris para presença espectral indesejada, antes de qualquer magia sistematizada. Para quem opera no plano espectral diariamente, carregar os compostos mundanos é lembrete de que nem tudo que funciona é sofisticado. Três doses. Suficiente para três situações onde a arma morfológica e os Cristalizados não são a resposta certa."},

function sagaOrder(s) { const n = (s||"").replace(/[^0-9]/g,""); return n ? parseInt(n) : 999; }

function getFiltered() {
  const q = state.busca.toLowerCase();
  const filtered = ITEMS.filter(item => {
    const matchPossuidor = state.possuidor === "Todos" || (item.possuidor && item.possuidor.includes(state.possuidor));
    return (!q || [item.nome, item.descricao, item.possuidor, item.local].some(f => f?.toLowerCase().includes(q)))
      && (state.tipo === "Todos" || item.tipo === state.tipo)
      && (state.status === "Todos" || item.status === state.status)
      && (state.raridade === "Todas" || item.raridade === state.raridade)
      && matchPossuidor;
  });
  return [...filtered].sort((a,b) => {
    switch(state.ordem) {
      case "nome-asc": return a.nome.localeCompare(b.nome,"pt");
      case "nome-desc": return b.nome.localeCompare(a.nome,"pt");
      case "raridade-asc": return RARIDADE_ORDER.indexOf(a.raridade) - RARIDADE_ORDER.indexOf(b.raridade);
      case "raridade-desc": return RARIDADE_ORDER.indexOf(b.raridade) - RARIDADE_ORDER.indexOf(a.raridade);
      case "saga-asc": return sagaOrder(a.saga) - sagaOrder(b.saga);
      case "saga-desc": return sagaOrder(b.saga) - sagaOrder(a.saga);
      default: return 0;
    }
  });
}

function esc(s) {
  if (!s) return "";
  return s.replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;").replace(/"/g,"&quot;");
}

function renderCardBody(item) {
  const rar = RARIDADE_COLORS[item.raridade] || "#b0a89a";
  const tipo = item.tipo;
  let localColor = "#7a5030", attrColor = "#c09070", descColor = "#5a3020", bullet = "▶";
  let sectionLabelColor = "#4a1818";

  // Raridade override: Lendário e Artefato Único dominam o interior
  if (item.raridade === "Lendário") {
    localColor = rar + "bb"; attrColor = rar + "dd"; descColor = rar + "88";
    bullet = "✦"; sectionLabelColor = rar + "66";
  } else if (item.raridade === "Artefato Único") {
    localColor = rar + "cc"; attrColor = rar; descColor = rar + "99";
    bullet = "✦"; sectionLabelColor = rar + "77";
  } else if (item.raridade === "Muito Raro") {
    localColor = rar + "99"; attrColor = rar + "cc"; descColor = rar + "66";
    bullet = "◆"; sectionLabelColor = rar + "55";
  } else if (item.raridade === "Raro") {
    localColor = rar + "88"; attrColor = rar + "bb"; descColor = rar + "55";
    bullet = "◆"; sectionLabelColor = rar + "44";
  } else if (item.raridade === "Incomum") {
    localColor = rar + "77"; attrColor = rar + "aa"; descColor = rar + "44";
    bullet = "▶"; sectionLabelColor = rar + "38";
  } else {
    // Comum — mais neutro, só um toque da cor
    localColor = rar + "60"; attrColor = rar + "90"; descColor = rar + "35";
    bullet = "▶"; sectionLabelColor = rar + "28";
  }

  let html = `<div style="border-top:1px solid ${rar}20;margin-top:2px;padding-top:12px;animation:fadeIn .2s ease">`;

  // Local — label contextual por status
  if (item.local) {
    const localLabel = (item.status === "Destruído") ? "Local de Destruição"
      : (item.status === "Perdido" || item.status === "Localização Desconhecida") ? "Último Local Conhecido"
      : (item.status === "Em Posse") ? "Localização"
      : "Local de Origem";
    html += `<div class="section"><span class="section-label" style="color:${sectionLabelColor}">${localLabel}</span><p class="section-text" style="color:${localColor};font-size:12px">${esc(item.local)}</p></div>`;
  }

  // Atributos — separados em mecânicos (maiúsculas, dano, CA, HP, CD) vs notas narrativas
  if (item.atributos && item.atributos.length) {
    const mec = item.atributos.filter(a => /^\[|\d[d+]|\bCA\b|\bHP\b|\bCD\s*\d|\+\d|\bx por|\bUso Único\b|^[A-ZÁÉÍÓÚÀÃÂÊÔÛÇ]{3,}/.test(a));
    const nar = item.atributos.filter(a => !mec.includes(a));

    const mecLabel = tipo === "Armadura" ? "Atributos de Defesa" : tipo === "Consumível" ? "Efeitos" : "Propriedades";
    const narLabel = "Notas de Campo";

    if (mec.length) {
      html += `<div class="section"><span class="section-label" style="color:${sectionLabelColor};font-weight:600">${mecLabel}</span>`;
      mec.forEach(a => {
        const isHighlight = /^[A-ZÁÉÍÓÚÀÃÂÊÔÛÇ\[]{2}/.test(a);
        const bulletGlow = (item.raridade === "Lendário" || item.raridade === "Artefato Único") ? `filter:drop-shadow(0 0 3px ${rar})` : "";
        html += `<div class="attr-row" style="color:${isHighlight ? rar+"ee" : attrColor};${isHighlight ? `font-family:'Cinzel',serif;font-size:11px;letter-spacing:.03em` : ""}"><span class="attr-bullet" style="color:${rar};${bulletGlow}">${bullet}</span>${esc(a)}</div>`;
      });
      html += `</div>`;
    }

    if (nar.length) {
      html += `<div class="section" style="margin-top:6px"><span class="section-label" style="color:${sectionLabelColor};opacity:.7">${narLabel}</span>`;
      nar.forEach(a => {
        html += `<div class="attr-row" style="color:${attrColor}88;font-style:italic"><span class="attr-bullet" style="color:${rar}55">·</span>${esc(a)}</div>`;
      });
      html += `</div>`;
    }
  }

  // Durabilidade — exibida para itens físicos ativos (não consumíveis, não destruídos, não perdidos)
  const tiposSemDur = ["Consumível","Outro"];
  const statusSemDur = ["Destruído","Perdido","Localização Desconhecida"];
  if (!tiposSemDur.includes(item.tipo) && !statusSemDur.includes(item.status)) {
    const dmap = DURABILIDADE_MAP[item.raridade];
    if (dmap) {
      const temAtual = item.dur_atual !== undefined;
      const pct = temAtual && dmap.max_ref ? Math.round((item.dur_atual / dmap.max_ref) * 100) : null;
      const barColor = pct !== null ? (pct > 60 ? dmap.cor : pct > 30 ? "#8a6a20" : "#8a2020") : dmap.cor;
      const autoIcon = dmap.auto_reparo === "Sim" ? "↺ " : dmap.auto_reparo === "Parcial" ? "↻ " : "";
      html += `<div style="border-top:1px solid ${rar}15;margin-top:10px;padding-top:8px">
        <span class="section-label" style="color:${sectionLabelColor};display:block;margin-bottom:5px">Durabilidade</span>
        <div style="display:flex;align-items:center;gap:10px;flex-wrap:wrap">
          <div style="font-size:11px;color:${dmap.cor};font-family:'Cinzel',serif;letter-spacing:.05em">${dmap.qualidade}</div>
          <div style="font-size:11px;color:${attrColor}88">${autoIcon}${dmap.faixa} pts · Auto-reparo: ${dmap.auto_reparo}</div>`;
      if (temAtual && dmap.max_ref) {
        html += `<div style="display:flex;align-items:center;gap:6px;margin-left:auto">
            <div style="font-size:11px;color:${barColor};font-family:'Fira Code',monospace">${item.dur_atual}/${dmap.max_ref}</div>
            <div style="width:72px;height:5px;background:${rar}20;border-radius:2px;overflow:hidden">
              <div style="width:${pct}%;height:100%;background:${barColor};transition:width .3s"></div>
            </div>
          </div>`;
      } else if (dmap.faixa === "∞" || dmap.faixa === "∞/100+") {
        html += `<div style="font-size:12px;color:${dmap.cor};margin-left:auto">∞</div>`;
      }
      html += `</div></div>`;
    }
  }

  // Descrição narrativa — bloco separado com linha divisória leve
  if (item.descricao) {
    html += `<div style="border-top:1px solid ${rar}12;margin-top:10px;padding-top:10px">
      <p class="card-descricao" style="color:${descColor};line-height:1.8">${esc(item.descricao)}</p>
    </div>`;
  }

  html += `</div>`;
  return html;
}

          </div>
          <div class="card-right">
            <div class="card-status" style="color:${st}">${statusIcon} ${esc(item.status)}</div>
            ${item.possuidor ? `<div class="card-possuidor">${esc(item.possuidor)}</div>` : ""}
          </div>
        </div>${bodyHtml}
        <div class="card-toggle">${exp ? "▲" : "▼"}</div>
      </div>
    </div>`;
  }

  // ── RARIDADE: Incomum ──
  if (item.raridade === "Incomum") {
    return `<div id="card-${item.id}" onclick="toggleCard(${item.id})" class="card-shell"
        style="border-left:3px solid ${rar}77;background:linear-gradient(135deg,${rar}10 0%,#0f0b1c 30%,#100c1e 100%);box-shadow:0 1px 6px rgba(0,0,0,.4);transition:box-shadow .18s,border-left-color .18s;"
        onmouseenter="this.style.boxShadow='inset 3px 0 16px ${rar}20,0 4px 18px rgba(0,0,0,.6)'"
        onmouseleave="this.style.boxShadow='0 1px 6px rgba(0,0,0,.4)'">
      <div style="position:absolute;top:0;left:0;right:0;height:1px;background:linear-gradient(to right,${rar}44,${rar}66,${rar}44);pointer-events:none"></div>
      <div style="position:absolute;right:12px;top:50%;transform:translateY(-50%);font-size:50px;opacity:.04;color:${rar};user-select:none;pointer-events:none">${icon}</div>
      <div class="card-inner" style="position:relative">
        <div class="card-header">
          <div class="card-left">
            <div class="card-name-row">
              <span class="card-icon" style="color:${rar};filter:drop-shadow(0 0 4px ${rar}55)">${icon}</span>
              <span class="card-name" style="color:#d8d0ec">${esc(item.nome)}</span>
            </div>
            <div class="card-meta">
              <span class="card-rarity" style="color:${rar}">${esc(item.raridade)}</span>
              ${item.subtipo ? `<span class="card-subtipo" style="color:${rar}55">· ${esc(item.subtipo)}</span>` : ""}
              <span class="card-saga">${esc(item.saga)}</span>
            </div>
          </div>
          <div class="card-right">
            <div class="card-status" style="color:${st}">${statusIcon} ${esc(item.status)}</div>
            ${item.possuidor ? `<div class="card-possuidor">${esc(item.possuidor)}</div>` : ""}
          </div>
        </div>${bodyHtml}
        <div class="card-toggle">${exp ? "▲" : "▼"}</div>
      </div>
    </div>`;
  }

  // ── RARIDADE: Raro ──
  if (item.raridade === "Raro") {
    return `<div id="card-${item.id}" onclick="toggleCard(${item.id})" class="card-shell"
        style="border-left:3px solid ${rar}aa;background:linear-gradient(120deg,${rar}18 0%,#100c20 25%,#0f0b1e 70%,${rar}10 100%);box-shadow:0 0 14px ${rar}14,inset 3px 0 20px ${rar}0a;transition:filter .2s,box-shadow .2s;"
        onmouseenter="this.style.boxShadow='inset 3px 0 24px ${rar}22,0 4px 20px ${rar}20'"
        onmouseleave="this.style.boxShadow='0 0 14px ${rar}14,inset 3px 0 20px ${rar}0a'">
      <div style="position:absolute;top:0;left:0;right:0;height:1px;background:linear-gradient(to right,${rar}60,${rar}99,${rar}60);pointer-events:none"></div>
      <div style="position:absolute;top:8px;left:8px;width:4px;height:4px;border-radius:50%;background:${rar}60;box-shadow:0 0 6px ${rar}90;pointer-events:none"></div>
      <div style="position:absolute;top:8px;right:8px;width:4px;height:4px;border-radius:50%;background:${rar}60;box-shadow:0 0 6px ${rar}90;pointer-events:none"></div>
      <div style="position:absolute;right:10px;top:50%;transform:translateY(-50%);font-size:52px;opacity:.06;color:${rar};user-select:none;pointer-events:none;filter:blur(1px)">${icon}</div>
      <div class="card-inner" style="position:relative">
        <div class="card-header">
          <div class="card-left">
            <div class="card-name-row">
              <span class="card-icon" style="color:${rar};filter:drop-shadow(0 0 6px ${rar}88)">${icon}</span>
              <span class="card-name" style="color:#e8e0f8;text-shadow:0 0 12px ${rar}25">${esc(item.nome)}</span>
            </div>
            <div class="card-meta">
              <span class="card-rarity" style="color:${rar};text-shadow:0 0 6px ${rar}55">${esc(item.raridade)}</span>
              ${item.subtipo ? `<span class="card-subtipo" style="color:${rar}66">· ${esc(item.subtipo)}</span>` : ""}
              <span class="card-saga" style="color:${rar}55">${esc(item.saga)}</span>
            </div>
          </div>
          <div class="card-right">
            <div class="card-status" style="color:${st}">${statusIcon} ${esc(item.status)}</div>
            ${item.possuidor ? `<div class="card-possuidor">${esc(item.possuidor)}</div>` : ""}
          </div>
        </div>${bodyHtml}
        <div class="card-toggle" style="color:${rar}66">${exp ? "▲" : "▼"}</div>
      </div>
    </div>`;
  }

  // ── RARIDADE: Muito Raro ──
  if (item.raridade === "Muito Raro") {
    return `<div id="card-${item.id}" onclick="toggleCard(${item.id})" class="card-shell"
        style="border-left:3px solid ${rar}cc;background:linear-gradient(125deg,${rar}22 0%,#120e26 30%,#100c22 65%,${rar}18 100%);box-shadow:0 0 24px ${rar}20,inset 3px 0 28px ${rar}10;transition:filter .2s,box-shadow .2s;"
        onmouseenter="this.style.boxShadow='inset 3px 0 32px ${rar}28,0 6px 28px ${rar}30'"
        onmouseleave="this.style.boxShadow='0 0 24px ${rar}20,inset 3px 0 28px ${rar}10'">
      <div style="position:absolute;top:0;left:0;right:0;height:1px;background:linear-gradient(to right,transparent,${rar}88,${rar}cc,${rar}88,transparent);pointer-events:none"></div>
      <div style="position:absolute;bottom:0;left:0;right:0;height:1px;background:linear-gradient(to right,transparent,${rar}44,transparent);pointer-events:none"></div>
      <div style="position:absolute;top:7px;left:9px;width:5px;height:5px;border-radius:50%;background:${rar}70;box-shadow:0 0 8px ${rar}aa;pointer-events:none;animation:pulse-border 3s ease-in-out infinite"></div>
      <div style="position:absolute;top:7px;right:9px;width:5px;height:5px;border-radius:50%;background:${rar}70;box-shadow:0 0 8px ${rar}aa;pointer-events:none;animation:pulse-border 3s 1.5s ease-in-out infinite"></div>
      <div style="position:absolute;right:10px;top:50%;transform:translateY(-50%);font-size:52px;opacity:.07;color:${rar};user-select:none;pointer-events:none;filter:blur(.5px)">${icon}</div>
      <div class="card-inner" style="position:relative">
        <div class="card-header">
          <div class="card-left">
            <div class="card-name-row">
              <span class="card-icon" style="color:${rar};filter:drop-shadow(0 0 8px ${rar}aa)">${icon}</span>
              <span class="card-name" style="color:#f0e8ff;text-shadow:0 0 16px ${rar}38">${esc(item.nome)}</span>
            </div>
            <div class="card-meta">
              <span class="card-rarity" style="color:${rar};text-shadow:0 0 8px ${rar}77">${esc(item.raridade)}</span>
              ${item.subtipo ? `<span class="card-subtipo" style="color:${rar}77">· ${esc(item.subtipo)}</span>` : ""}
              <span class="card-saga" style="color:${rar}60">${esc(item.saga)}</span>
            </div>
          </div>
          <div class="card-right">
            <div class="card-status" style="color:${st}">${statusIcon} ${esc(item.status)}</div>
            ${item.possuidor ? `<div class="card-possuidor">${esc(item.possuidor)}</div>` : ""}
          </div>
        </div>${bodyHtml}
        <div class="card-toggle" style="color:${rar}77">${exp ? "▲" : "▼"}</div>
      </div>
    </div>`;
  }

  // fallback (não deve ser atingido)
  return `<div id="card-${item.id}" onclick="toggleCard(${item.id})" style="
      position:relative;cursor:pointer;background:#0e0c09;border:1px solid ${rar}22;border-radius:2px;">
    <div style="padding:14px 18px 10px">
      <div class="card-header">
        <div class="card-left">
          <div class="card-name-row">
            <span class="card-icon" style="color:${rar}">${icon}</span>
            <span class="card-name" style="color:#d0c8b8">${esc(item.nome)}</span>
          </div>
          <div class="card-meta">
            <span class="card-rarity" style="color:${rar}">${esc(item.raridade)}</span>
            ${item.subtipo ? `<span class="card-subtipo" style="color:${rar}44">· ${esc(item.subtipo)}</span>` : ""}
            <span class="card-saga" style="color:${rar}30">${esc(item.saga)}</span>
          </div>
        </div>
        <div class="card-right">
          <div class="card-status" style="color:${st}">${statusIcon} ${esc(item.status)}</div>
          ${item.possuidor ? `<div class="card-possuidor" style="color:${st}44">${esc(item.possuidor)}</div>` : ""}
        </div>
      </div>${bodyHtml}
      <div class="card-toggle" style="color:${rar}33;font-size:8px;text-align:center;margin-top:8px">${exp ? "▲" : "▼"}</div>
    </div>
  </div>`;
}

function toggleCard(id) {
  if (state.expanded.has(id)) state.expanded.delete(id);
  else state.expanded.add(id);
  render();
}

function buildChips(containerId, options, currentVal, field, colorMap) {
  const container = document.getElementById(containerId);
  if (!container) return;
  container.innerHTML = "";
  options.forEach(opt => {
    const btn = document.createElement("button");
    btn.className = "filter-chip" + (currentVal === opt ? " active" : "");
    btn.textContent = opt;
    const col = colorMap && opt !== "Todos" && opt !== "Todas" ? colorMap[opt] : null;
    if (currentVal === opt) {
      if (col) {
        btn.style.background = col + "18";
        btn.style.borderColor = col;
        btn.style.color = col;
      } else {
        btn.style.background = "rgba(139,26,40,.18)";
        btn.style.borderColor = "var(--blood)";
        btn.style.color = "#e88090";
      }
    } else if (col) {
      btn.style.borderColor = col + "40";
      btn.style.color = col + "aa";
    }
    btn.addEventListener("click", () => { state[field] = opt; render(); });
    container.appendChild(btn);
  });
}

function buildTipoTabs(currentVal) {
  const container = document.getElementById("filter-tipo");
  if (!container) return;
  container.innerHTML = "";
  TIPOS.forEach(opt => {
    const btn = document.createElement("button");
    btn.className = "tipo-tab" + (currentVal === opt ? " active" : "");
    const icon = opt === "Todos" ? "◈" : (TIPO_ICONS[opt] || "◈");
    btn.innerHTML = `<span class="tipo-icon">${icon}</span><span>${opt}</span>`;
    btn.addEventListener("click", () => { state.tipo = opt; render(); });
    container.appendChild(btn);
  });
}

function buildOrdemChips() {
  const container = document.getElementById("filter-ordem");
  if (!container) return;
  container.innerHTML = "";
  ORDENS.forEach(opt => {
    const btn = document.createElement("button");
    btn.className = "filter-chip" + (state.ordem === opt.value ? " active" : "");
    btn.textContent = opt.label;
    if (state.ordem === opt.value) {
      btn.style.background = "rgba(139,26,40,.18)";
      btn.style.borderColor = "var(--blood)";
      btn.style.color = "#e88090";
    }
    btn.addEventListener("click", () => { state.ordem = opt.value; render(); });
    container.appendChild(btn);
  });
}

function render() {
  state.busca = document.getElementById("busca").value;

  buildTipoTabs(state.tipo);
  buildChips("filter-status",    STATUS_LIST,     state.status,    "status",    STATUS_COLORS);
  buildChips("filter-raridade",  RARIDADES,       state.raridade,  "raridade",  RARIDADE_COLORS);
  buildChips("filter-possuidor", getPossuidores(), state.possuidor, "possuidor", null);
  buildOrdemChips();

  // Active filter count badge
  const activeFilters = [
    state.status !== "Todos",
    state.raridade !== "Todas",
    state.possuidor !== "Todos",
    state.ordem !== "saga-asc"
  ].filter(Boolean).length;

  const badge = document.getElementById("filter-active-count");
  const clearBtn = document.getElementById("filter-clear-btn");
  const toggleBtn = document.getElementById("filter-toggle-btn");
  if (badge) {
    badge.style.display = activeFilters > 0 ? "inline-flex" : "none";
    badge.textContent = activeFilters;
  }
  if (clearBtn) clearBtn.style.display = activeFilters > 0 ? "inline-block" : "none";
  if (toggleBtn) toggleBtn.classList.toggle("has-active", activeFilters > 0);

  // Header counts
  const rarCounts = {};
  ITEMS.forEach(i => { rarCounts[i.raridade] = (rarCounts[i.raridade] || 0) + 1; });
  document.getElementById("header-count").textContent = `${ITEMS.length} itens registrados`;
  document.getElementById("header-type-counts").innerHTML = RARIDADE_ORDER
    .filter(r => rarCounts[r])
    .map(r => {
      const col = RARIDADE_COLORS[r] || "#b0a89a";
      return `<span class="header-type-count" style="color:${col};border-color:${col}40">${r} <strong>${rarCounts[r]}</strong></span>`;
    }).join("");

  const filtrados = getFiltered();
  document.getElementById("divider-count").textContent = filtrados.length > 0
    ? `${filtrados.length} ITEM${filtrados.length !== 1 ? "S" : ""}`
    : "—";

  const cardsEl = document.getElementById("cards");
  if (filtrados.length === 0) {
    cardsEl.innerHTML = `<div class="empty"><div class="empty-icon">◇</div><p class="empty-body">Nenhum item corresponde aos filtros selecionados.</p></div>`;
  } else {
    cardsEl.innerHTML = filtrados.map(renderCard).join("");
  }
}


function toggleFilterDrawer() {
  const drawer = document.getElementById("filter-drawer");
  const btn = document.getElementById("filter-toggle-btn");
  drawer.classList.toggle("open");
  btn.style.borderColor = drawer.classList.contains("open") ? "var(--blood)" : "";
  btn.style.color = drawer.classList.contains("open") ? "#e88090" : "";
}

function clearFilters() {
  state.status = "Todos";
  state.raridade = "Todas";
  state.possuidor = "Todos";
  state.ordem = "saga-asc";
  render();
}

render();
</script>

<script>
// Notifica o hub quando o leitor clica em qualquer link desta página
document.addEventListener('click', function(e) {
  const a = e.target.closest('a[href]');
  if (!a) return;
  const to = a.getAttribute('href');
  if (!to || to.startsWith('#') || to.startsWith('javascript')) return;
  try { window.parent.postMessage({ type: 'nav', to: to }, '*'); } catch(e2) {}
});
</script>
</body>
</html>
