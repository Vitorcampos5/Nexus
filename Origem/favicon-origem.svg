<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32">
  <defs>
    <radialGradient id="glow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#C4A35A" stop-opacity="0.55"/>
      <stop offset="100%" stop-color="#C4A35A" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <!-- halo suave do ponto de origem -->
  <circle cx="16" cy="16" r="11" fill="url(#glow)"/>

  <!-- raios irradiando do centro -->
  <g stroke="#C4A35A" stroke-width="1" stroke-linecap="round" opacity="0.85">
    <line x1="16" y1="2"  x2="16" y2="8"/>
    <line x1="16" y1="24" x2="16" y2="30"/>
    <line x1="2"  y1="16" x2="8"  y2="16"/>
    <line x1="24" y1="16" x2="30" y2="16"/>
    <line x1="6.5"  y1="6.5"  x2="10.5" y2="10.5" opacity="0.6"/>
    <line x1="21.5" y1="21.5" x2="25.5" y2="25.5" opacity="0.6"/>
    <line x1="25.5" y1="6.5"  x2="21.5" y2="10.5" opacity="0.6"/>
    <line x1="10.5" y1="21.5" x2="6.5"  y2="25.5" opacity="0.6"/>
  </g>

  <!-- anel fino ao redor do ponto -->
  <circle cx="16" cy="16" r="5.5" fill="none" stroke="#C4A35A" stroke-width="1" opacity="0.5"/>

  <!-- o ponto de origem -->
  <circle cx="16" cy="16" r="2.4" fill="#C4A35A"/>
</svg>
